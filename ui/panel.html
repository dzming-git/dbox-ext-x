<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X 下载</title>
<!-- HLS 播放支持：X 视频为 m3u8 流，原生 <video> 无法直接播放，需 hls.js。
     若 CDN 不可达（离线环境），会静默失败，下方逻辑自动退化为“打开详情预览”。 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" onerror="window.__HLS_FAILED=true"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f7f8fa; color: #1f2329; }

  .wrap { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ---- 工具栏 ---- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e3e6eb; background: #fff; flex-shrink: 0; }
  .toolbar .title { font-weight: 600; font-size: 14px; }
  .toolbar #fullscreen { background: none; border: 1px solid #d0d4dc; color: #555; border-radius: 8px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .toolbar #fullscreen:hover { color: #1d9bf0; border-color: #1d9bf0; }

  /* ---- 表单区（始终可见） ---- */
  .form { padding: 10px 12px; border-bottom: 1px solid #e3e6eb; background: #fff; flex-shrink: 0; }
  .form input[type=text] { width: 100%; border: 1px solid #d0d4dc; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }
  .form select { width: 100%; border: 1px solid #d0d4dc; border-radius: 8px; padding: 7px 10px; font-size: 13px; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .opts label { display: inline-flex; align-items: center; gap: 4px; }
  .form .run-row { display: flex; gap: 8px; align-items: center; }
  .form button { background: #1d9bf0; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
  .form button:hover { filter: brightness(1.06); }
  .hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.5; }

  /* ---- 预览区（表单下方，不隐藏表单） ---- */
  .preview { flex: 1; overflow-y: auto; padding: 10px 12px; display: none; flex-direction: column; gap: 10px; min-height: 0; max-height: 55vh; }
  .preview.active { display: flex; }
  .preview .tweet { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 10px 12px; }
  .preview .author { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .preview .author a { color: #1d9bf0; text-decoration: none; }
  .preview .ttext { font-size: 12.5px; color: #333; white-space: pre-wrap; word-break: break-word; line-height: 1.5; max-height: 96px; overflow: hidden; position: relative; }
  .preview .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .media { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .media .thumb { position: relative; width: 100%; aspect-ratio: 16 / 10; background: #eef0f4; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; max-height: 200px; }
  .media .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .media .thumb:hover img { transform: scale(1.03); }
  .media .thumb .placeholder { font-size: 12px; color: #999; text-align: center; padding: 8px; }
  .media .play { position: absolute; inset: 0; margin: auto; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(0,0,0,.45); color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-left: 3px; }
  .media .play:hover { background: rgba(29,155,240,.85); }
  .media video { width: 100%; aspect-ratio: 16 / 10; background: #000; display: block; }
  .media .note { position: absolute; inset: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; }
  .media .meta { padding: 7px 10px; font-size: 12px; color: #555; display: flex; align-items: center; gap: 6px; }
  .media .meta input { accent-color: #1d9bf0; }
  .media .tag { margin-left: auto; font-size: 11px; color: #1a7f37; background: #e8f5e9; border-radius: 4px; padding: 0 5px; }
  .preview .actions { display: flex; gap: 8px; padding-bottom: 8px; }
  .preview .actions button { flex: 1; border-radius: 8px; padding: 10px 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .preview .actions .primary { background: #1d9bf0; color: #fff; }
  .preview .actions .primary:hover { filter: brightness(1.06); }
  .preview .actions .cancel { background: #fff; color: #666; border: 1px solid #d0d4dc; }
  .preview .actions .cancel:hover { color: #d33; border-color: #f3a6a6; }

  /* ---- 状态/日志区（下载时显示；预览时收为辅助区） ---- */
  .status { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; display: none; }
  .status.active { display: block; }
  /* 预览阶段：日志区缩小，让预览内容成为主视图 */
  .preview.active ~ .status.active { flex: 0 0 auto; max-height: 120px; }
  .progress { height: 8px; background: #e3e6eb; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .progress > div { height: 100%; background: #1d9bf0; width: 0; transition: width .3s; }
  .status-msg { font-size: 13px; color: #333; margin-bottom: 10px; }
  .log { font-size: 12px; color: #666; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 8px; max-height: 220px; overflow-y: auto; }
  .log .err { color: #f56c6c; }

  /* ---- Lightbox（点击图片放大 + 左右切换） ---- */
  .lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox.active { display: flex; }
  .lightbox img, .lightbox video { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; font-size: 28px; opacity: 0; transition: opacity .2s; user-select: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .lightbox:hover .nav { opacity: .7; }
  .lightbox .nav:hover { opacity: 1; }
  .lightbox .nav.prev { left: 0; }
  .lightbox .nav.next { right: 0; }
  .lightbox .nav.prev::after { content: '‹'; }
  .lightbox .nav.next::after { content: '›'; }
  .lightbox .counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 4px 14px; border-radius: 12px; z-index: 1; }
  .lightbox .lb-note { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1; }
  .lightbox .lb-note-tip { color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 10px; max-width: 80vw; text-align: center; }
  .lightbox .lb-dl { align-self: center; background: #1d9bf0; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  .lightbox .lb-dl:hover { background: #1a8cd8; }

  /* 推文详情页覆盖层 */
  .detail { position: fixed; inset: 0; z-index: 9998; background: #f5f6f7; display: none; flex-direction: column; }
  .detail.active { display: flex; }
  .detail-box { display: flex; flex-direction: column; height: 100%; }
  .detail-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e3e6eb; }
  .detail-back { background: none; border: none; color: #1d9bf0; font-size: 14px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .detail-back:hover { background: #eef5fd; }
  .detail-title { font-weight: 600; font-size: 14px; color: #0f1419; }
  .detail-scroll { flex: 1; overflow-y: auto; padding: 14px; }
  .dt-card { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .dt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dt-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .dt-name { font-weight: 600; font-size: 15px; color: #0f1419; }
  .dt-handle { color: #536471; font-size: 13px; }
  .dt-time { color: #8899a6; font-size: 13px; margin-left: auto; }
  .dt-text { font-size: 16px; line-height: 1.6; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .dt-media { border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .dt-media img { width: 100%; display: block; }
  .dt-media video { width: 100%; border-radius: 12px; }
  .dt-counts { display: flex; gap: 16px; padding: 10px 0; border-top: 1px solid #eef0f2; border-bottom: 1px solid #eef0f2; margin-bottom: 12px; color: #536471; font-size: 13px; }
  .dt-counts b { color: #0f1419; }
  .dt-actions { display: flex; gap: 8px; }
  .dt-actions button { flex: 1; border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 9px; font-size: 13px; cursor: pointer; color: #536471; transition: background .15s; }
  .dt-actions .dl { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .dt-actions .dl:hover { background: #1a8cd8; }
  .dt-actions .fav.on { background: #e0245e; color: #fff; border-color: #e0245e; }
  .dt-actions .openx { color: #1d9bf0; }
  .dt-reply-title { font-weight: 600; font-size: 14px; color: #0f1419; margin: 6px 0 10px; }
  .dt-reply { display: flex; gap: 8px; background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .dt-reply .rv { flex: 1; min-width: 0; }
  .dt-reply .rv .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dt-reply .rv .rname { font-weight: 600; font-size: 13px; color: #0f1419; }
  .dt-reply .rv .rhandle { color: #536471; font-size: 12px; }
  .dt-reply .rv .rtext { font-size: 14px; line-height: 1.5; color: #0f1419; white-space: pre-wrap; word-break: break-word; }
  .dt-reply img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .dt-reply .dt-reply-media { margin-top: 6px; }
  .dt-reply .dt-reply-media img { width: 100%; height: auto; max-height: 240px; object-fit: contain; border-radius: 8px; }
  .bm-newbar { text-align: center; margin-bottom: 10px; }
  .bm-newbar button { width: 100%; padding: 9px; border: none; background: #fff5d6; color: #b58900; border-radius: 9px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .bm-folderbar { display: flex; gap: 6px; margin-bottom: 10px; }
  .bm-folderbar select, .bm-folderbar input { flex: 1; border: 1px solid #e3e6eb; border-radius: 8px; padding: 7px 8px; font-size: 12px; color: #0f1419; background: #fff; }
  .bm-folderbar button { border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; color: #536471; }
  .mc-stats { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: #536471; }
  .mc-stats b { color: #0f1419; }
  .mc-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: #536471; }
  .mc-item .type { font-weight: 600; color: #0f1419; min-width: 40px; }
  .mc-item .size { margin-left: auto; }

  /* 选择型交互 */
  .pick { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .pick label { display: block; padding: 4px 0; font-size: 13px; }
  .pick button { margin-top: 8px; background: #1d9bf0; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }

  /* 标签切换 */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { flex: 1; background: #f3f5f7; border: 1px solid #e3e6eb; border-radius: 9px; padding: 9px 10px; font-size: 13px; cursor: pointer; color: #536471; }
  .tab.active { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .quickdl { display: flex; gap: 6px; margin-bottom: 10px; }
  .quickdl input { flex: 1; border: 1px solid #e3e6eb; border-radius: 9px; padding: 9px 12px; font-size: 13px; color: #0f1419; background: #fff; }
  .quickdl input:focus { outline: none; border-color: #1d9bf0; box-shadow: 0 0 0 3px rgba(29,155,240,.15); }
  .quickdl button { border: none; background: #1d9bf0; color: #fff; border-radius: 9px; padding: 0 16px; font-size: 13px; cursor: pointer; }
  .quickdl button:hover { background: #1a8cd8; }

  /* X 收藏 / 浏览 */
  /* 视图需独立滚动：wrap 是 overflow:hidden 的 flex column，此视图占满剩余高度并滚动 */
  #view-bookmarks, #view-browse { flex: 1; overflow-y: auto; min-height: 0; padding: 12px; }
  .bm-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .bm-toolbar button { flex: 1; border-radius: 9px; padding: 9px 10px; font-size: 13px; cursor: pointer; border: 1px solid #e3e6eb; }
  .bm-toolbar .primary { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .bm-toolbar .secondary { background: #fff; color: #536471; }
  .bm-list { display: flex; flex-direction: column; gap: 10px; }
  .bm-empty { color: #8899a6; font-size: 13px; text-align: center; padding: 24px 0; }
  .bm-card { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 10px 12px; }
  .bm-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bm-card .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }
  .bm-card .name { font-weight: 600; font-size: 13px; color: #0f1419; cursor: pointer; }
  .bm-card .name:hover { text-decoration: underline; }
  .bm-card .handle { color: #536471; font-size: 12px; }
  .bm-card .time { color: #8899a6; font-size: 12px; margin-left: auto; }
  .bm-card .text { font-size: 13px; line-height: 1.4; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; }
  /* 媒体布局：单图占满限高，多图 grid（2x2/3+） */
  .bm-card .media { display: grid; gap: 4px; margin-bottom: 6px; border-radius: 10px; overflow: hidden; }
  .bm-card .media.m1 { grid-template-columns: 1fr; }
  /* 单图：保持原图比例完整显示，限高 320px 不裁切，背景浅灰填充 */
  .bm-card .media.m1 .bm-media { max-height: 320px; background: #f3f5f7; }
  .bm-card .media.m1 .bm-media img, .bm-card .media.m1 .bm-media video {
    width: auto; max-width: 100%; max-height: 320px;
    object-fit: contain; display: block; margin: 0 auto;
  }
  .bm-card .media.m2 { grid-template-columns: 1fr 1fr; }
  .bm-card .media.m3, .bm-card .media.m4 { grid-template-columns: 1fr 1fr; }
  .bm-card .media.m2 .bm-media, .bm-card .media.m3 .bm-media, .bm-card .media.m4 .bm-media { aspect-ratio: 16/10; }
  .bm-card .media.m2 img, .bm-card .media.m2 video,
  .bm-card .media.m3 img, .bm-card .media.m3 video,
  .bm-card .media.m4 img, .bm-card .media.m4 video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bm-card .bm-media { position: relative; cursor: pointer; overflow: hidden; background: #f3f5f7; }
  .bm-card .bm-play { position: absolute; inset: 0; margin: auto; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; padding-left: 3px; pointer-events: none; }
  .bm-card .actions { display: flex; gap: 6px; margin-top: 4px; }
  .bm-card .actions button { flex: 1; border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 6px; font-size: 12px; cursor: pointer; color: #536471; transition: background .15s, color .15s, border-color .15s; }
  .bm-card .actions .dl { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .bm-card .actions .dl:hover { background: #1a8cd8; }
  .bm-card .actions .fav { color: #e0245e; }
  .bm-card .actions .fav.on { background: #e0245e; color: #fff; border-color: #e0245e; }
  .bm-card .actions button:disabled { opacity: .6; cursor: not-allowed; }
  .bm-card .loading, .bm-card .err { font-size: 13px; color: #8899a6; padding: 8px 0; }
  .bm-card .err { color: #e0245e; }
  .bm-loadmore { margin-top: 10px; text-align: center; }
  .bm-loadmore button { width: 100%; padding: 9px; border: 1px solid #e3e6eb; background: #fff; border-radius: 9px; color: #1d9bf0; font-size: 13px; cursor: pointer; transition: opacity .15s; }
  .bm-loadmore button:disabled { color: #8899a6; cursor: default; opacity: .7; }
  .bm-loadmore .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #e3e6eb; border-top-color: #1d9bf0; border-radius: 50%; animation: xd-spin .7s linear infinite; margin-right: 6px; vertical-align: -1px; }
  @keyframes xd-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <span class="title">🐦 X</span>
  </div>

  <!-- 标签切换：首页（浏览）为主，下载是辅助功能放最后 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="browse">🏠 首页</button>
    <button class="tab" data-view="bookmarks">⭐ 收藏</button>
    <button class="tab" data-view="history">🕘 历史</button>
    <button class="tab" data-view="cache">📦 缓存</button>
    <button class="tab" data-view="download">⬇ 下载</button>
  </div>

  <!-- 下载表单视图 -->
  <div class="view" id="view-download" style="display:none">
  <!-- 表单：始终可见 -->
  <div class="form" id="form">
    <input id="url" type="text" placeholder="粘贴 X / Twitter 推文链接…" />
    <select id="library"><option value="">目标资源库（加载中…）</option></select>
    <div class="opts">
      <label><input type="checkbox" id="preview" checked /> 先预览确认</label>
      <label><input type="checkbox" id="hidden" /> 隐藏资源（仅帖子流可见）</label>
    </div>
    <div class="run-row">
      <button id="run">解析预览</button>
    </div>
    <div class="hint">粘贴推文链接 → 解析并预览图片/视频 → 确认后下载整个帖子。</div>
  </div>
  </div><!-- /view-download -->

  <!-- X 收藏视图 -->
  <div class="view" id="view-bookmarks" style="display:none">
    <div class="bm-toolbar">
      <button id="bm-sync" class="primary">🔄 从 X 同步收藏</button>
      <button id="bm-show-folder" class="secondary">📁 我已收藏 (dbox)</button>
    </div>
    <div id="bm-folder-bar" class="bm-folderbar" style="display:none">
      <select id="bm-collection"><option value="">全部收藏</option></select>
      <input id="bm-collection-input" type="text" placeholder="新集合名" />
      <button id="bm-collection-add" class="secondary">＋ 新建集合</button>
    </div>
    <div id="bm-x-list" class="bm-list"><div class="bm-empty">点击「从 X 同步收藏」加载你在 X 上收藏的推文。</div></div>
    <div id="bm-folder-list" class="bm-list" style="display:none"><div class="bm-empty">你还没有把任何收藏保存到 dbox。在「从 X 同步收藏」中点击「加入收藏夹」即可。</div></div>
  </div>

  <!-- 历史视图（P1-7 本地浏览历史） -->
  <div class="view" id="view-history" style="display:none">
    <div class="bm-toolbar">
      <button id="hs-refresh" class="primary">🔄 刷新历史</button>
      <button id="hs-clear" class="secondary">🗑 清空</button>
    </div>
    <div id="hs-list" class="bm-list"><div class="bm-empty">浏览过的推文会记录在这里，可回看。</div></div>
  </div>

  <!-- 缓存管理视图（P2-9） -->
  <div class="view" id="view-cache" style="display:none">
    <div class="bm-toolbar">
      <button id="mc-refresh" class="primary">🔄 刷新</button>
      <button id="mc-clear" class="secondary">🗑 清空缓存</button>
    </div>
    <div id="mc-stats" class="mc-stats"></div>
    <div id="mc-list" class="bm-list"><div class="bm-empty">点开的图片/视频会缓存到本地。</div></div>
  </div>

  <!-- 浏览（首页·关注流）视图 -->
  <div class="view" id="view-browse">
    <!-- 快速打开：在首页粘贴链接即可浏览该推文，看完再决定是否下载 -->
    <div class="quickdl" id="quickdl">
      <input id="qdl-url" type="text" placeholder="粘贴推文链接，回车打开浏览…" />
      <button id="qdl-btn">🔍 打开</button>
    </div>
    <div class="bm-toolbar">
      <button id="br-refresh" class="primary">🔄 刷新</button>
      <button id="br-batch" class="secondary" disabled>⬇ 批量下载选中 (0)</button>
    </div>
    <div id="br-list" class="bm-list"><div class="bm-empty">点击「刷新」加载你关注的人的最新推文。</div></div>
    <div class="bm-loadmore" id="br-loadmore" style="display:none"><button id="br-more">加载更多</button></div>
  </div>

  <!-- 预览区：在表单下方展开，不隐藏表单 -->
  <div class="preview" id="pv-wrap">
    <div class="tweet">
      <div class="author" id="pv-author"></div>
      <div class="ttext" id="pv-text"></div>
    </div>
    <div class="grid" id="pv-grid"></div>
    <div class="actions">
      <button id="pv-download" class="primary">⬇ 下载整个帖子</button>
      <button id="pv-cancel" class="cancel">关闭预览</button>
    </div>
  </div>

  <!-- Lightbox：点击图片放大 -->
  <div class="lightbox" id="lb">
    <button class="nav prev" id="lb-prev" aria-label="上一张"></button>
    <img id="lb-img" alt="" />
    <button class="nav next" id="lb-next" aria-label="下一张"></button>
    <div class="counter" id="lb-counter"></div>
  </div>

  <!-- 推文详情页（DBox 内预览推文 + 评论区） -->
  <div class="detail" id="detail">
    <div class="detail-box">
      <div class="detail-top">
        <button class="detail-back" id="dt-back">← 返回</button>
        <span class="detail-title">推文详情</span>
      </div>
      <div class="detail-scroll" id="dt-scroll">
        <div id="dt-body"><div class="bm-empty">加载中…</div></div>
        <div class="detail-replies" id="dt-replies"></div>
        <div class="bm-loadmore" id="dt-loadmore" style="display:none"><button id="dt-more">加载更多回复</button></div>
      </div>
    </div>
  </div>

  <!-- 日志/状态区：下载时显示 -->
  <div class="status" id="status">
    <div class="progress" id="prog" style="display:none"><div id="prog-bar"></div></div>
    <div class="status-msg" id="status-msg"></div>
    <div class="log" id="log" style="display:none"></div>
    <div id="pick"></div>
  </div>
</div>
<script>
  let TOKEN = '';
  let librariesLoaded = false;
  let standaloneRoute = '';
  let _lbItems = [];    // lightbox 左右切换的混合序列（图片 + 视频）
  let _lbIdx = 0;
  const API = '/api/ext/x_downloader';
  const JOB_KEY = 'xd_job';  // localStorage key for active job
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'DBOX_TOKEN' && e.data.token) {
      TOKEN = e.data.token;
      if (!librariesLoaded) loadLibraries();
      // token 到达后恢复可能存在的旧任务（iframe 重建场景）
      if (!jobId) { const saved = restoreJob(); if (saved) { jobId = saved; startPolling(); } }
    }
    if (e.data.type === 'DBOX_EXT_INFO' && e.data.standalone_route) {
      standaloneRoute = e.data.standalone_route;
    }
  });
  window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), logEl = $('log'), progEl = $('prog'), progBar = $('prog-bar');
  const formEl = $('form'), previewEl = $('pv-wrap'), gridEl = $('pv-grid');
  let jobId = null, poller = null;
  const seenLogs = new Set();

  // ---- 跨 iframe 重建恢复：从 localStorage 恢复活跃任务 ----
  function saveJob(id) {
    if (id) { try { localStorage.setItem(JOB_KEY, id); } catch(_) {} }
    else { try { localStorage.removeItem(JOB_KEY); } catch(_) {} }
  }
  function restoreJob() {
    try { return localStorage.getItem(JOB_KEY) || null; } catch(_) { return null; }
  }
  // 页面加载时检查是否有未完成任务，自动恢复轮询
  window.addEventListener('load', () => {
    const saved = restoreJob();
    if (saved && TOKEN) {
      jobId = saved;
      startPolling();
    }
  });
  // token 到达时也尝试恢复（token 可能比 load 晚）
  const _origTokenHandler = null; // 标记需要在 message 监听里加恢复逻辑

  // 预览开关控制按钮文案
  $('preview').addEventListener('change', () => {
    $('run').textContent = $('preview').checked ? '解析预览' : '开始下载';
  });

  // 全屏入口已统一由框架层（ExtensionHost）面板 header 的「⛶ 全屏」按钮提供，
  // panel 自身不再维护独立全屏按钮。


  const AUTH = () => ({ 'Authorization': 'Bearer ' + TOKEN });

  // 读取当前最可能有效的 token（主站 axios 刷新后会写回 localStorage，iframe 同源可共享）。
  function latestToken() {
    try {
      return localStorage.getItem('token')
        || localStorage.getItem('access_token')
        || sessionStorage.getItem('token')
        || TOKEN;
    } catch (_) { return TOKEN; }
  }

  // 向父窗口重新索要最新 token（父窗口会实时读 localStorage/store）。
  function requestTokenFromParent() {
    return new Promise((resolve) => {
      let resolved = false;
      const done = (e) => {
        if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) {
          resolved = true;
          window.removeEventListener('message', done);
          resolve(e.data.token);
        }
      };
      window.addEventListener('message', done);
      window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');
      setTimeout(() => { window.removeEventListener('message', done); if (!resolved) resolve(null); }, 1500);
    });
  }

  // 用 refresh_token 主动刷新 access_token（不依赖主站是否触发刷新）。
  async function refreshToken() {
    try {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return null;
      const resp = await fetch('/api/v2/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      const data = await resp.json();
      if (data && data.success && data.data && data.data.access_token) {
        const nt = data.data.access_token;
        localStorage.setItem('token', nt);
        localStorage.setItem('access_token', nt);
        if (data.data.refresh_token) localStorage.setItem('refresh_token', data.data.refresh_token);
        return nt;
      }
    } catch (_) {}
    return null;
  }

  // 获取新鲜 token：优先父窗口注入，其次 refresh_token 主动刷新，最后读 localStorage。
  async function requestToken() {
    const fromParent = await requestTokenFromParent();
    if (fromParent && fromParent !== latestToken()) return fromParent;
    const refreshed = await refreshToken();
    if (refreshed) return refreshed;
    return latestToken();
  }

  // 带鉴权 + 401 自动重试的请求：token 过期时重新获取并重试一次。
  async function req(path, opts = {}) {
    const _do = (token) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token } });
    let r = await _do(TOKEN);
    if (r.status === 401) {
      const fresh = await requestToken();
      if (fresh && fresh !== TOKEN) {
        TOKEN = fresh;
        r = await _do(fresh);
      }
    }
    return r;
  }

  // 加载资源库列表
  async function loadLibraries() {
    if (librariesLoaded) return;
    if (!TOKEN) return;
    librariesLoaded = true;
    try {
      const r = await fetch('/api/my-libraries', { headers: AUTH() });
      const d = await r.json();
      const libs = (d.data || d.libraries || []);
      const sel = $('library');
      sel.innerHTML = libs.map(l => `<option value="${l.id}">${l.name}</option>`).join('') || '<option value="">（无可用库）</option>';
    } catch (e) {
      $('library').innerHTML = '<option value="">（加载库失败）</option>';
    }
  }

  /* ---- 视图切换 ---- */
  function showStatus() { statusEl.classList.add('active'); previewEl.classList.remove('active'); }
  function showPreview() { previewEl.classList.add('active'); statusEl.classList.remove('active'); }
  function showIdle() { previewEl.classList.remove('active'); statusEl.classList.remove('active'); }

  /* ---- 缓存：预览数据在关闭后保留，重新打开时直接渲染 ---- */
  let _cachedPreview = null;

  function pushLog(msg, isErr) {
    logEl.style.display = 'block';
    if (seenLogs.has(msg)) return;
    seenLogs.add(msg);
    const line = document.createElement('div');
    line.className = isErr ? 'err' : '';
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(pct, msg) {
    progEl.style.display = 'block';
    progBar.style.width = (pct || 0) + '%';
    if (msg) $('status-msg').textContent = msg;
  }

  function startPolling() {
    if (poller) clearInterval(poller);
    poller = setInterval(async () => {
      if (!jobId) return;
      try {
        const r = await fetch(`${API}/status?job_id=${encodeURIComponent(jobId)}`, { headers: AUTH() });
        const s = await r.json();
        if (!s.success) return;
        setProgress(s.percent, s.message || '');
        (s.logs || []).forEach((l) => pushLog(l));
        if (s.pending_input) {
          // 解析已完成（预览/选择），进度应标满
          setProgress(100, s.message || s.pending_input.title || '解析完成');
          if (s.pending_input.type === 'preview') renderPreview(s.pending_input);
          else renderPick(s.pending_input);
        }
        if (s.done) {
          clearInterval(poller); poller = null;
          pushLog(s.error ? ('失败: ' + s.error) : '任务完成。');
          const btn = document.createElement('button');
          btn.textContent = '← 再来一个';
          btn.style.cssText = 'margin-top:10px;background:#1d9bf0;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;';
          btn.onclick = () => { showIdle(); seenLogs.clear(); $('log').textContent = ''; $('status-msg').textContent = ''; progEl.style.display = 'none'; jobId = null; saveJob(null); };
          statusEl.appendChild(btn);
        }
      } catch (e) {}
    }, 800);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ---- 预览渲染 ---- */
  function renderPreview(input) {
    _cachedPreview = input; // 缓存

    const author = input.author || {};
    let authorHtml = '';
    if (author.screen_name) {
      const name = author.name || author.screen_name;
      authorHtml = `<a href="https://x.com/${esc(author.screen_name)}" target="_blank" rel="noopener">${esc(name)}</a> @${esc(author.screen_name)}`;
    } else if (author.name) {
      authorHtml = esc(author.name);
    }
    $('pv-author').innerHTML = authorHtml;
    $('pv-text').textContent = (input.text || '').trim() || '（该推文无文字内容）';

    const media = input.media || [];
    gridEl.innerHTML = media.map((m, i) => {
      const kindTag = m.type === 'video' ? '<span class="tag">视频</span>'
                    : m.type === 'document' ? '<span class="tag">文档</span>'
                    : '<span class="tag">图片</span>';
      let thumb;
      if (m.type === 'video') {
        const cover = m.cover || '';
        const playable = m.mp4 || (m.url || '').endsWith('.mp4');
        thumb = `<div class="thumb">
          ${cover
            ? `<img src="${esc(cover)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'placeholder\\'>封面加载失败</div>'" />`
            : '<div class="placeholder">视频</div>'}
          <button class="play" data-i="${i}">▶</button>
          <div class="note" hidden>该视频需下载后播放</div>
        </div>`;
        if (!playable) {
          thumb = thumb.replace('<button class="play"', '<button class="play" data-noplay="1"');
        }
      } else if (m.type === 'document') {
        thumb = '<div class="thumb"><div class="placeholder">📄 文档附件</div></div>';
      } else {
        thumb = `<div class="thumb">
          <img src="${esc(m.url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'placeholder\\'>图片加载失败</div>'" />
        </div>`;
      }
      const label = m.label || (m.type === 'video' ? '视频' : m.type === 'document' ? '文档' : '图片');
      return `<div class="media" data-i="${i}">${thumb}
        <label class="meta"><input type="checkbox" data-i="${i}" checked /> ${esc(label)}${kindTag}</label>
      </div>`;
    }).join('');

    // 视频点击播放
    gridEl.querySelectorAll('.media .play').forEach((btn) => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.i);
        const m = media[i];
        const wrap = btn.parentElement;
        if (btn.dataset.noplay) {
          wrap.querySelector('.note').hidden = false;
          btn.hidden = true;
          return;
        }
        const src = m.mp4 || m.url;
        wrap.innerHTML = `<video src="${esc(src)}" controls autoplay playsinline></video>`;
      });
    });

    // 收集 lightbox 可切换序列（图片 + 视频）
    _lbItems = [];
    media.forEach((m, i) => {
      if (m.type === 'video') {
        // 能直接播的直链 mp4（非 m3u8）；否则只能下载后播放
        const direct = (m.mp4 && !m.mp4.includes('.m3u8')) ? m.mp4 : '';
        _lbItems.push({
          type: 'video',
          mi: i,                       // 原始媒体索引，用于单独下载
          src: direct,                 // 空字符串表示无法直接播放
          cover: m.cover || '',
          label: m.label || '视频',
          playable: !!direct,
        });
      } else if (m.type !== 'document') {
        if (m.url) _lbItems.push({ type: 'image', src: m.url, label: m.label || '图片' });
      }
    });

    // 缩略图点击放大（lightbox，图片/视频均可）
    gridEl.querySelectorAll('.media .thumb').forEach((thumb) => {
      thumb.addEventListener('click', (e) => {
        if (e.target.closest('.play')) return; // 不拦截视频列表内播放按钮
        const i = Number(thumb.closest('.media').dataset.i);
        // 在 lightbox 序列中按原始媒体索引匹配
        const idx = _lbItems.findIndex((x) => x.mi === i);
        showLightbox(idx >= 0 ? idx : 0);
      });
    });

    // 显示预览，但【不要隐藏状态/日志区】：解析/下载往往还在后台进行
    // （如 GraphQL 阶段已先返回预览数据），隐藏会让人误以为卡死/消失。
    previewEl.classList.add('active');
    // 注意：故意不调用 showPreview()，以免移除 status 的 active 类。
  }

  // 关闭预览 → 回到空闲状态（表单保留），缓存不清除
  $('pv-cancel').onclick = () => { showIdle(); };

  /* ---- Lightbox：点击图片放大查看 + 左右切换（图片/视频） ---- */
  const lbEl = $('lb');
  const lbImg = $('lb-img');
  const lbCounter = $('lb-counter');
  function showLightbox(idx) {
    _lbIdx = idx;
    renderLightbox();
    lbEl.classList.add('active');
  }
  function renderLightbox() {
    const item = _lbItems[_lbIdx];
    if (!item) return;
    // 清理上一项（避免多个 video 同时播放）
    const oldVid = lbEl.querySelector('video');
    if (oldVid) { oldVid.pause(); oldVid.remove(); }
    const oldNote = lbEl.querySelector('.lb-note');
    if (oldNote) oldNote.remove();
    if (item.type === 'video') {
      lbImg.style.display = 'none';
      if (item.playable) {
        const v = document.createElement('video');
        v.src = item.src;
        v.controls = true; v.autoplay = true; v.playsInline = true;
        v.preload = 'metadata';
        v.muted = true;  // 现代浏览器要求 autoplay 必须静音
        v.addEventListener('click', (e) => e.stopPropagation());
        lbEl.insertBefore(v, lbCounter);
      } else {
        // 无法直接播放（m3u8 或后端未取到直链）：显示封面 + 下载提示
        lbImg.style.display = '';
        lbImg.src = item.cover || '';
        const note = document.createElement('div');
        note.className = 'lb-note';
        note.innerHTML = `<div class="lb-note-tip">该视频为加密流（m3u8），浏览器无法直接播放，需下载后查看。</div>
          <button class="lb-dl" id="lb-dl-video">⬇ 下载此视频</button>`;
        lbEl.appendChild(note);
        $('lb-dl-video').addEventListener('click', (e) => {
          e.stopPropagation();
          showStatus();
          setProgress(0, '开始下载视频…');
          postInput({ action: 'download', items: [item.mi] });
        });
      }
    } else {
      lbImg.style.display = '';
      lbImg.src = item.src;
    }
    const total = _lbItems.length;
    lbCounter.textContent = total > 1 ? `${_lbIdx + 1} / ${total}` : '';
    const hide = total <= 1;
    $('lb-prev').style.display = hide ? 'none' : 'flex';
    $('lb-next').style.display = hide ? 'none' : 'flex';
  }
  function lbStep(dir) {
    if (_lbItems.length <= 1) return;
    _lbIdx = (_lbIdx + dir + _lbItems.length) % _lbItems.length;
    renderLightbox();
  }
  $('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); lbStep(-1); });
  $('lb-next').addEventListener('click', (e) => { e.stopPropagation(); lbStep(1); });
  lbImg.addEventListener('click', (e) => e.stopPropagation());
  lbCounter.addEventListener('click', (e) => e.stopPropagation());
  lbEl.addEventListener('click', () => lbEl.classList.remove('active'));
  // 关闭时停止视频播放
  document.addEventListener('keydown', (e) => {
    if (!lbEl.classList.contains('active')) return;
    if (e.key === 'Escape') {
      const v = lbEl.querySelector('video'); if (v) v.pause();
      lbEl.classList.remove('active');
    }
    else if (e.key === 'ArrowLeft') { lbStep(-1); }
    else if (e.key === 'ArrowRight') { lbStep(1); }
  });
  // 点击背景关闭并停止视频
  lbEl.addEventListener('click', () => { const v = lbEl.querySelector('video'); if (v) v.pause(); });

  /* ---- 备选选择 ---- */
  function renderPick(input) {
    if ($('pick').dataset.for === jobId + JSON.stringify(input)) return;
    $('pick').dataset.for = jobId + JSON.stringify(input);
    const opts = (input.options || []).map((o) =>
      `<label><input type="${input.multi ? 'checkbox' : 'radio'}" name="pick" value="${esc(o.value)}"> ${esc(o.label)}</label>`).join('');
    $('pick').innerHTML = `<div class="pick"><div>${esc(input.prompt || '请选择')}</div>${opts}
      <button id="pick-ok">确认</button></div>`;
    $('pick-ok').onclick = async () => {
      const vals = Array.from(document.querySelectorAll('input[name=pick]:checked')).map(x => x.value);
      if (!vals.length) { alert('请至少选择一项'); return; }
      await postInput({ action: 'download', items: vals });
      $('pick').innerHTML = '';
    };
  }

  async function postInput(value) {
    await fetch(`${API}/input`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...AUTH() },
      body: JSON.stringify({ job_id: jobId, value }),
    });
  }

  /* ---- 提交任务 ---- */
  $('run').onclick = async () => {
    const url = $('url').value.trim();
    const library_id = $('library').value;
    if (!url) { alert('请填写推文链接'); return; }
    if (!library_id) { alert('请选择目标资源库'); return; }
    if (!TOKEN) { alert('尚未获取到 token'); return; }
    jobId = null; seenLogs.clear();
    $('log').textContent = ''; $('pick').innerHTML = ''; $('status-msg').textContent = ''; progEl.style.display = 'none';
    previewEl.dataset.for = '';
    showStatus();
    setProgress(0, '提交任务…');
    try {
      const r = await fetch(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...AUTH() },
        body: JSON.stringify({
          library_id,
          params: {
            url,
            preview: $('preview').checked,
            auto: true,
            hidden: $('hidden').checked,
          }
        })
      });
      const d = await r.json();
      if (!d.success) { pushLog('提交失败: ' + (d.message || ''), true); return; }
      jobId = d.job_id;
      saveJob(jobId);
      startPolling();
    } catch (e) { pushLog('提交异常: ' + e.message, true); }
  };

  /* ---- 预览区下载 ---- */
  $('pv-download').onclick = async () => {
    const items = Array.from(gridEl.querySelectorAll('input[data-i]:checked')).map(x => Number(x.dataset.i));
    if (!items.length) { alert('请至少勾选一个媒体'); return; }
    showStatus();
    setProgress(0, '开始下载…');
    await postInput({ action: 'download', items });
  };

  /* ---- 首次加载兜底 ---- */
  let loadRetries = 0;
  (function ensureLibraries() {
    if (librariesLoaded) return;
    if (TOKEN) { loadLibraries(); return; }
    if (loadRetries++ < 20) setTimeout(ensureLibraries, 300);
  })();

  /* ---- 标签切换 ---- */
  const tabsEl = $('tabs');
  const viewDownload = $('view-download');
  const viewBrowse = $('view-browse');
  const viewHistory = $('view-history');
  const viewCache = $('view-cache');
  const viewBookmarks = $('view-bookmarks');
  // 进入浏览 tab 时同步 dbox folder 到 favSet（仅一次）
  let brFavSynced = false;
  async function syncFavFromServer() {
    if (brFavSynced) return;
    brFavSynced = true;
    try {
      const r = await req(`${API}/bookmarks/folder`);
      const d = await r.json();
      if (d.success && d.items) {
        let added = 0;
        for (const it of d.items) {
          if (it.tweet_id && !favSet.has(it.tweet_id)) { favSet.add(it.tweet_id); added++; }
        }
        if (added) saveFavSet();
      }
    } catch (_) {}
  }

  // ---- hash 路由（刷新保持视图 / 可深链 / 全屏返回）----
  function switchView(v, { silent = false } = {}) {
    tabsEl.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.view === v));
    viewDownload.style.display = v === 'download' ? '' : 'none';
    viewBrowse.style.display = v === 'browse' ? '' : 'none';
    viewHistory.style.display = v === 'history' ? '' : 'none';
    viewCache.style.display = v === 'cache' ? '' : 'none';
    viewBookmarks.style.display = v === 'bookmarks' ? '' : 'none';
    if (!silent) location.hash = '#/view/' + v;
    if (v === 'browse') {
      syncFavFromServer();
      if (!brList.querySelector('.bm-card')) { brAutoRestore = true; loadBrowse(true); }
    } else if (v === 'history') {
      loadHistory();
    } else if (v === 'cache') {
      loadCache();
    } else if (v === 'bookmarks') {
      if (!bmXList.querySelector('.bm-card') && !bmShowingFolder) loadBookmarks();
    }
  }

  function parseHash() {
    const m = (location.hash || '').match(/^#\/view\/(\w+)/);
    return m ? m[1] : null;
  }

  tabsEl.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });

  // 初始视图：优先用 hash，否则默认 browse（同原逻辑）。
  // 延迟到脚本末尾再执行，避免 switchView 内引用的 bmXList/bmShowingFolder 等 const 尚未初始化的 TDZ 问题。
  const initialView = parseHash() || 'browse';
  setTimeout(() => switchView(initialView, { silent: true }), 0);

  window.addEventListener('hashchange', () => {
    const v = parseHash();
    if (v && ['download', 'browse', 'history', 'cache', 'bookmarks'].includes(v)) switchView(v, { silent: true });
  });

  /* ---- X 收藏 ---- */
  const bmXList = $('bm-x-list');
  const bmFolderList = $('bm-folder-list');
  let bmShowingFolder = false;

  function esc2(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtTime(ts) {
    if (!ts) return '';
    try {
      const d = new Date(ts);
      if (isNaN(d)) return String(ts);
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch { return String(ts); }
  }

  // 把 twimg 媒体 URL 转成本地代理缓存接口：点开即缓存，回看命中本地字节。
  function mediaUrl(url, type) {
    if (!url || !/twimg\.com|pbs\.twimg/.test(url)) return url || '';
    return `${API}/media?u=${encodeURIComponent(url)}&type=${type || 'image'}`;
  }

  // 在卡片内就地播放视频：有 mp4 直链用原生 video；仅有 m3u8 流用 hls.js（经 /media 代理）。
  // 返回 true 表示已处理（调用方勿再走其它分支）。
  function playVideoEl(el) {
    const v = el.querySelector('video');
    if (!v) return false;
    const src = el.dataset.src, m3u8 = el.dataset.m3u8;
    if (src && !v.src) {
      v.src = src; v.controls = true; v.muted = true;
      v.play().catch(() => {});
      return true;
    }
    if (m3u8) {
      if (v.src) { v.paused ? v.play().catch(()=>{}) : v.pause(); return true; }
      const Hls = window.Hls;
      if (Hls && Hls.isSupported()) {
        // capLevelToPlayerSize:false —— 不按缩略图小尺寸锁低清；
        // 全屏时强制最高 level 保证清晰度（hls.js 在小窗下会自动选低码率，全屏不升档导致糊）。
        const hls = new Hls({ enableWorker: true, lowLatencyMode: false, capLevelToPlayerSize: false });
        hls.loadSource(m3u8);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          v.controls = true; v.muted = true;
          if (document.fullscreenElement === v && hls.levels && hls.levels.length) {
            hls.currentLevel = hls.levels.length - 1;
          }
          v.play().catch(()=>{});
        });
        const syncLevel = () => {
          if (hls.levels && hls.levels.length) {
            hls.currentLevel = (document.fullscreenElement === v || v.webkitDisplayingFullscreen)
              ? hls.levels.length - 1 : -1; // 全屏强制最高清，退出恢复 ABR 自动
          }
        };
        v.addEventListener('fullscreenchange', syncLevel);
        v.addEventListener('webkitbeginfullscreen', syncLevel);
        v.addEventListener('webkitendfullscreen', syncLevel);
        v._hls = hls;
        return true;
      }
      // hls.js 不可用（离线/未加载）：退化为打开详情预览（详情页能播 mp4/原生）
      const openBtn = el.closest('.bm-card')?.querySelector('.open');
      if (openBtn) { openBtn.click(); return true; }
    }
    // 仅有空 video：尝试播放/暂停
    if (v) { v.paused ? v.play().catch(()=>{}) : v.pause(); return true; }
    return false;
  }

  function renderBmCard(item, inFolder) {
    const a = item.author || {};
    const medias = (item.media || []).slice(0, 4);
    const mediaHtml = medias.map((m, idx) => {
      if (m.type === 'video') {
        const poster = mediaUrl(m.cover || m.url || '', 'image');
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        // X 视频常见为 m3u8 流：有 mp4 直链优先 data-src 原生播放；仅有 m3u8 则保留 data-m3u8 供 hls.js 播放
        const direct = (!isM3u8 && m.url) ? mediaUrl(m.url, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        return poster ? `<div class="bm-media" data-idx="${idx}" data-type="video"${direct ? ` data-src="${esc2(direct)}"` : ''}${m3u8 ? ` data-m3u8="${esc2(m3u8)}"` : ''}><video src="" poster="${esc2(poster)}" muted playsinline></video><span class="bm-play">▶</span></div>` : '';
      }
      return m.url ? `<div class="bm-media" data-idx="${idx}" data-type="image"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></div>` : '';
    }).join('');
    const tid = item.tweet_id || '';
    const card = document.createElement('div');
    card.className = 'bm-card';
    card.innerHTML = `
      <div class="head">
        ${a.avatar ? `<img class="avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          <div class="name">${esc2(a.name || a.screen_name || '未知用户')}</div>
          <div class="handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="time">${esc2(fmtTime(item.created_at))}</div>
      </div>
      <div class="text">${esc2(item.text || '')}</div>
      ${mediaHtml ? `<div class="media">${mediaHtml}</div>` : ''}
      <div class="actions">
        ${inFolder
          ? `<button class="open" data-url="${esc2(item.url || '')}">打开原推文</button>
             <button class="del" data-tid="${esc2(tid)}">移出收藏夹</button>`
          : `<button class="open" data-url="${esc2(item.url || '')}">打开原推文</button>
             <button class="add" data-tid="${esc2(tid)}">加入收藏夹</button>`}
      </div>`;
    // 收藏媒体缩略图点击 → lightbox 预览（图片全图 / 视频真实播放）。
    // 复用下载预览的 lightbox（lb），临时把收藏媒体的 URL 序列填进 _lbItems。
    // 视频项 m.url 通常是 twimg 的 mp4 直链，可真实播放；无直链时才回退封面。
    const bmLBItems = medias.filter((m) => m.url || m.cover).map((m) => {
      if (m.type === 'video') {
        // mp4 直链走本地代理缓存接口（点开即缓存）；m3u8 无法直接代理，回退封面
        const direct = (m.url && !m.url.includes('.m3u8')) ? mediaUrl(m.url, 'video') : '';
        return { type: 'video', src: direct, cover: mediaUrl(m.cover || m.url || '', 'image'), label: '视频', playable: !!direct };
      }
      return { type: 'image', src: mediaUrl(m.url || '', 'image'), label: '图片' };
    });
    card.querySelectorAll('.bm-media').forEach((el) => {
      el.addEventListener('click', () => {
        // 视频缩略图 → 就地播放（不弹 lightbox）
        if (el.dataset.type === 'video') { playVideoEl(el); return; }
        // 图片缩略图 → lightbox 大图
        const idx = Number(el.dataset.idx || 0);
        if (!bmLBItems.length) return;
        _lbItems = bmLBItems;
        _lbIdx = Math.min(idx, bmLBItems.length - 1);
        showLightbox(_lbIdx);
      });
    });
    card.querySelectorAll('.open').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url; if (u) window.open(u, '_blank', 'noopener');
    }));
    if (inFolder) {
      card.querySelectorAll('.del').forEach((b) => b.addEventListener('click', async () => {
        const tid = b.dataset.tid;
        b.disabled = true; b.textContent = '移除中…';
        try {
          const r = await req(`${API}/bookmarks/folder/${encodeURIComponent(tid)}`, { method: 'DELETE' });
          const d = await r.json();
          if (d.success) renderFolder(d.items);
        } catch (e) { b.disabled = false; b.textContent = '移出收藏夹'; alert('移除失败: ' + e.message); }
      }));
    } else {
      card.querySelectorAll('.add').forEach((b) => b.addEventListener('click', async () => {
        const tid = b.dataset.tid;
        b.disabled = true; b.textContent = '已加入 ✓';
        try {
          // 带入当前选中集合（若有）
          const selEl = document.getElementById('bm-collection');
          const coll = selEl && selEl.value ? selEl.value : null;
          const payload = { ...item };
          if (coll) payload.collection = coll;
          const r = await req(`${API}/bookmarks/folder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const d = await r.json();
          if (!d.success) { b.disabled = false; b.textContent = '加入收藏夹'; alert('加入失败: ' + (d.message || '')); }
        } catch (e) { b.disabled = false; b.textContent = '加入收藏夹'; alert('加入异常: ' + e.message); }
      }));
    }
    return card;
  }

  async function loadXBookmarks() {
    bmXList.innerHTML = '<div class="bm-empty">正在从 X 同步收藏…</div>';
    const all = [];
    let cursor = null;
    let page = 0;
    const MAX_PAGES = 20; // 每页 50 条，最多拉 1000 条，防异常死循环
    try {
      while (page < MAX_PAGES) {
        page++;
        const url = `${API}/bookmarks?count=50${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ''}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (!all.length) { bmXList.innerHTML = `<div class="bm-empty err">同步失败: ${esc2(d.message || '未知错误')}</div>`; return; }
          break; // 中途某页失败，保留已拉到的
        }
        const pageItems = d.items || [];
        pageItems.forEach((it) => all.push(it));
        cursor = d.next_cursor || null;
        // 本页无新增推文或没有下一页了，停止翻页
        if (!cursor || !pageItems.length) break;
      }
      if (!all.length) { bmXList.innerHTML = '<div class="bm-empty">你在 X 上还没有收藏任何推文。</div>'; return; }
      bmXList.innerHTML = '';
      all.forEach((it) => bmXList.appendChild(renderBmCard(it, false)));
    } catch (e) {
      if (!all.length) bmXList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  async function loadCollections() {
    try {
      const r = await req(`${API}/bookmarks/collections`);
      const d = await r.json();
      const sel = $('bm-collection');
      if (!sel) return;
      const cur = sel.value;
      sel.innerHTML = '<option value="">全部收藏</option>';
      (d.items || []).forEach((c) => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = cur || '';
    } catch (_) {}
  }

  async function loadFolder() {
    bmFolderList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const coll = $('bm-collection').value || '';
      const r = await req(`${API}/bookmarks/folder${coll ? `?collection=${encodeURIComponent(coll)}` : ''}`);
      const d = await r.json();
      if (!d.success) { bmFolderList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      renderFolder(d.items || []);
    } catch (e) {
      bmFolderList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  function renderFolder(items) {
    if (!items.length) {
      bmFolderList.innerHTML = '<div class="bm-empty">你还没有把任何收藏保存到 dbox。在「从 X 同步收藏」中点击「加入收藏夹」即可。</div>';
      return;
    }
    bmFolderList.innerHTML = '';
    items.forEach((it) => bmFolderList.appendChild(renderBmCard(it, true)));
  }

  $('bm-sync').addEventListener('click', () => {

  $('bm-show-folder').addEventListener('click', () => {

  // 集合下拉切换时按集合过滤
  $('bm-collection').addEventListener('change', () => loadFolder());
  // 新建集合：把输入框内容加入下拉并选中，之后"加入收藏夹"会用当前集合
  $('bm-collection-add').addEventListener('click', () => {
    const inp = $('bm-collection-input');
    const name = (inp.value || '').trim();
    if (!name) return;
    const sel = $('bm-collection');
    // 添加到下拉（若已存在则不重复）
    let exists = false;
    Array.from(sel.options).forEach((o) => { if (o.value === name) exists = true; });
    if (!exists) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    }
    sel.value = name;
    inp.value = '';
    loadFolder();
  });

  /* ---- 浏览（关注流） ---- */
  const brList = $('br-list');
  const brMoreBtn = $('br-more');
  const brLoadmore = $('br-loadmore');
  let brCursor = null;
  let brLoading = false;
  const brSeenIds = new Set();   // 浏览去重：同一 tweet_id 只渲染一次
  const downloadedTweetIds = new Set();  // 避免重复下载
  const favSet = new Set();              // 已收藏 tweet_id（用于浏览卡按钮态）
  const BROWSE_CACHE_KEY = 'xd_browse_cache';  // localStorage：浏览数据跨视图共享
  const BROWSE_FAV_KEY = 'xd_browse_favs';      // localStorage：已收藏 tweet_id 列表
  // 从 localStorage 恢复已收藏集合（小屏全屏共享）
  try { (JSON.parse(localStorage.getItem(BROWSE_FAV_KEY) || '[]') || []).forEach((t) => favSet.add(t)); } catch (_) {}

  // 浏览卡片：缩略图/作者点击直接跳原推文或作者 profile，actions 是 [⭐ 收藏] [⬇ 下载]
  function renderBrowseCard(item) {

    const tweetUrl = item.url || `https://x.com/${a.screen_name || 'unknown'}/status/${tid}`;
    const openDetail = (e) => { e.stopPropagation(); openTweetDetail(tid, item); };
    // 媒体缩略图 → lightbox 预览
    const bmLBItems = medias.filter((m) => m.url || m.cover).map((m) => {

    card.querySelectorAll('.bm-media').forEach((el) => {

    card.querySelectorAll('[data-link]').forEach((el) => {

      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(tweetUrl)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; if (!ok) { downloadedTweetIds.delete(t); b.disabled = false; } })
        .catch(() => { b.textContent = '下载失败'; downloadedTweetIds.delete(t); b.disabled = false; });
    }));
    return card;
  }

  async function downloadTweet(tweetUrl) {
    const libraryId = $('library').value;
    if (!libraryId) { alert('请先选择目标资源库'); return false; }
    try {
      const r = await req(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          library_id: libraryId,
          params: { url: tweetUrl, preview: false, auto: true, hidden: $('hidden').checked },
        }),
      });
      const d = await r.json();
      return !!(d && d.success);
    } catch (_) { return false; }
  }

  // 浏览数据缓存：小屏/全屏共享，避免切换后重新刷新
  // 按发布时间倒序（最新在前）
  function sortItemsByTime(items) {
    return items.slice().sort((a, b) => {
      const ta = a.created_at ? Date.parse(a.created_at) : 0;
      const tb = b.created_at ? Date.parse(b.created_at) : 0;
      return tb - ta;
    });
  }
  function saveBrowseCache(items, append) {
    try {
      if (!append) localStorage.setItem(BROWSE_CACHE_KEY, JSON.stringify({ ts: Date.now(), items, cursor: brCursor }));
      else {
        const old = JSON.parse(localStorage.getItem(BROWSE_CACHE_KEY) || 'null') || {};
        localStorage.setItem(BROWSE_CACHE_KEY, JSON.stringify({ ts: Date.now(), items: (old.items || []).concat(items), cursor: brCursor }));
      }
    } catch (_) {}
  }
  function renderCachedBrowse() {
    try {
      const c = JSON.parse(localStorage.getItem(BROWSE_CACHE_KEY) || 'null');
      // 仅「新鲜」缓存用于秒开：超过 5 分钟必须重新向服务端拉取，避免时间线卡在旧数据
      if (!c || !c.items || !c.items.length) return false;
      if (Date.now() - (c.ts || 0) > 5 * 60 * 1000) return false;
      brList.innerHTML = '';
      brSeenIds.clear();
      sortItemsByTime(c.items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        brList.appendChild(renderBrowseCard(it));
      });
      brCursor = c.cursor || null;
      brLoadmore.style.display = 'none';
      return true;
    } catch (_) { return false; }
  }
  function saveFavSet() {
    try { localStorage.setItem(BROWSE_FAV_KEY, JSON.stringify(Array.from(favSet))); } catch (_) {}
  }

  // ---- 浏览位置记忆：记住上次看到的推文，重进时定位回去，往上滑看更新 ----
  const BROWSE_POS_KEY = 'xd_browse_pos';
  let brAutoRestore = false;   // 仅「自动进入浏览视图」时恢复；用户手动刷新不恢复
  function saveBrowsePos() {
    const cont = viewBrowse;
    if (!cont) return;
    const contRect = cont.getBoundingClientRect();
    const cards = brList.querySelectorAll('.bm-card');
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      // 找视口内（或顶部刚露出）的第一张卡片
      if (r.bottom > contRect.top) {
        const absTop = r.top - contRect.top + cont.scrollTop;
        const tid = c.dataset.tid;
        if (tid) {
          try { localStorage.setItem(BROWSE_POS_KEY, JSON.stringify({ tid, top: absTop })); } catch (_) {}
        }
        break;
      }
    }
  }
  function restoreBrowsePos() {
    if (!brAutoRestore) return;
    let pos = null;
    try { pos = JSON.parse(localStorage.getItem(BROWSE_POS_KEY) || 'null'); } catch (_) {}
    brAutoRestore = false;
    if (!pos || !pos.tid) return;
    const card = Array.from(brList.querySelectorAll('.bm-card')).find((c) => c.dataset.tid === pos.tid);
    if (!card) return;  // 该推文尚未渲染（列表还不够长），降级到顶部
    const contRect = viewBrowse.getBoundingClientRect();
    const r = card.getBoundingClientRect();
    const absTop = r.top - contRect.top + viewBrowse.scrollTop;
    viewBrowse.scrollTop = Math.max(0, absTop - 8);
  }

  async function loadBrowse(reset = true) {
    if (brLoading) return;
    brLoading = true;
    if (reset) {
      brCursor = null; brSeenIds.clear();
      brLoadmore.style.display = 'none';   // 改为自动加载，不再显示手动按钮
      // 瞬时渲染新鲜缓存做秒开；随后仍向服务端拉取最新（见下方 try），不因缓存提前返回
      const preview = renderCachedBrowse();
      if (!preview) brList.innerHTML = '<div class="bm-empty">正在加载关注流…</div>';
    } else {
      if (brMoreBtn) { brMoreBtn.disabled = true; brMoreBtn.innerHTML = '<span class="spinner"></span>加载中…'; }
    }
    try {
      const url = `${API}/timeline?count=20${brCursor ? `&cursor=${encodeURIComponent(brCursor)}` : ''}`;
      const r = await req(url);
      const d = await r.json();
      if (!d.success) {
        if (reset && !brList.querySelector('.bm-card'))
          brList.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '未知错误')}</div>`;
        return;
      }
      const items = d.items || [];
      if (reset) {
        brList.innerHTML = '';
        brSeenIds.clear();
        brCursor = null;
      }
      if (!items.length && reset) brList.innerHTML = '<div class="bm-empty">关注流暂时没有新推文。</div>';
      // 去重：跳过已渲染过的 tweet_id（后端已把转发归一化到原推，同一原推只出现一次）
      let appended = 0;
      sortItemsByTime(items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        brList.appendChild(renderBrowseCard(it));
        appended++;
      });
      brCursor = d.next_cursor || null;
      brLoadmore.style.display = 'none';   // 自动加载，隐藏手动按钮
      // 缓存
      if (reset) saveBrowseCache(items, false);
      else saveBrowseCache(items, true);
    } catch (e) {
      if (reset && !brList.querySelector('.bm-card'))
        brList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    } finally {
      brLoading = false;
      if (brMoreBtn) { brMoreBtn.disabled = false; brMoreBtn.innerHTML = '加载更多'; }
      restoreBrowsePos();
    }
  }

  // 首页快速打开：粘贴链接 → 回车/点按钮 → 打开该推文详情页浏览，
  // 用户看完再在详情页决定是否下载（不直接下载）。
  function quickOpen() {
    const url = $('qdl-url').value.trim();
    if (!url) return;
    const m = url.match(/\/status\/(\d+)/);
    if (!m) { alert('无法识别推文链接'); return; }
    const btn = $('qdl-btn');
    btn.disabled = true; btn.textContent = '加载中…';
    openTweetDetail(m[1], null).finally(() => {
      btn.disabled = false; btn.textContent = '🔍 打开';
    });
  }
  $('qdl-btn').addEventListener('click', quickOpen);
  $('qdl-url').addEventListener('keydown', (e) => { if (e.key === 'Enter') quickOpen(); });

  $('br-refresh').addEventListener('click', () => { brAutoRestore = false; loadBrowse(true); });
  $('br-more').addEventListener('click', () => loadBrowse(false));

  // 自动加载（无限滚动）：滚动到 #view-browse 底部附近时自动拉下一页，不再依赖手动点「加载更多」
  const brScroll = $('view-browse');
  if (brScroll) {
    let brScrollTimer = null;
    brScroll.addEventListener('scroll', () => {
      saveBrowsePos();
      if (brScrollTimer) return;
      brScrollTimer = setTimeout(() => {
        brScrollTimer = null;
        if (brLoading || !brCursor) return;
        const nearBottom = brScroll.scrollTop + brScroll.clientHeight >= brScroll.scrollHeight - 400;
        if (nearBottom) loadBrowse(false);
      }, 250);
    });
  }

  // P2-11 定时刷新关注流：每 3 分钟静默拉一次最新推文，统计未见过的新 ID
  function brRenderNewTweetsBtn(count) {
    let el = $('br-new');
    if (count <= 0) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'br-new';
      el.className = 'bm-newbar';
      el.innerHTML = `<button>🔔 有 <b>${count}</b> 条新推文，点击加载</button>`;
      brList.parentNode.insertBefore(el, brList);
      el.addEventListener('click', () => loadBrowse(true));
    } else {
      el.innerHTML = `<button>🔔 有 <b>${count}</b> 条新推文，点击加载</button>`;
    }
  }
  async function pollNewTweets() {
    if (brLoading) return;
    try {
      const r = await req(`${API}/timeline?count=20`);
      const d = await r.json();
      if (!d.success) return;
      const fresh = (d.items || []).filter((it) => it.tweet_id && !brSeenIds.has(String(it.tweet_id)));
      if (fresh.length) brRenderNewTweetsBtn(fresh.length);
    } catch (_) {}
  }
  setInterval(pollNewTweets, 180000);  // 每 3 分钟
  // 切到浏览 tab 时立即查一次
  tabsEl.addEventListener('click', (e) => {
    if (e.target?.dataset?.view === 'browse') setTimeout(pollNewTweets, 500);
  });

  // P2-8 批量下载：复选框变化时更新按钮
  function updateBatchBtn() {
    const checked = brList.querySelectorAll('.bm-chk:checked');
    const btn = $('br-batch');
    if (!btn) return;
    btn.disabled = checked.length === 0;
    btn.textContent = `⬇ 批量下载选中 (${checked.length})`;
  }
  brList.addEventListener('change', (e) => {
    if (e.target.classList && e.target.classList.contains('bm-chk')) updateBatchBtn();
  });
  $('br-batch').addEventListener('click', async () => {
    const checked = Array.from(brList.querySelectorAll('.bm-chk:checked'));
    if (!checked.length) return;
    const btn = $('br-batch');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>提交中…';
    const lib = $('library').value;
    if (!lib) { alert('请先选择目标资源库'); btn.disabled = false; updateBatchBtn(); return; }
    const hidden = $('hidden').checked;
    let ok = 0, fail = 0;
    for (const c of checked) {
      const tid = c.dataset.tid;
      const card = c.closest('.bm-card');
      const url = card?.querySelector('.open, .dl')?.dataset?.url || '';
      if (!url) continue;
      const r = await req(`${API}/run`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          library_id: lib, params: { url, preview: false, auto: true, hidden },
        }),
      });
      const d = await r.json();
      if (d && d.success) ok++; else fail++;
    }
    btn.textContent = `✅ 完成 ${ok}，失败 ${fail}`;
    // 取消选中
    checked.forEach((c) => { c.checked = false; });
    setTimeout(updateBatchBtn, 2500);
  });

  /* ---- 推文详情页（DBox 内预览推文 + 评论区） ---- */
  const dtEl = $('detail');
  const dtBody = $('dt-body');
  const dtReplies = $('dt-replies');
  const dtScroll = $('dt-scroll');
  const dtMoreBtn = $('dt-more');
  const dtLoadmore = $('dt-loadmore');
  let dtCurTweet = null;   // 当前详情推文
  let dtCursor = null;     // 评论区分页 cursor
  let dtLoading = false;
  let dtFavBtn = null;

  // 渲染推文详情的完整卡片
  function renderTweetDetailCard(t) {
    const a = t.author || {};
    const mediaHtml = (t.media || []).map((m) => {
      if (m.type === 'video') {
        const src = (m.url && !m.url.includes('.m3u8')) ? mediaUrl(m.url, 'video') : '';
        return src ? `<video src="${esc2(src)}" controls preload="metadata" muted></video>` : '';
      }
      return m.url ? `<img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" />` : '';
    }).join('');
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const isFav = favSet.has(t.tweet_id);
    const card = document.createElement('div');
    card.className = 'dt-card';
    card.innerHTML = `
      <div class="dt-head">
        ${a.avatar ? `<img class="dt-avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          <div class="dt-name" data-link="${esc2(profileUrl)}">${esc2(a.name || a.screen_name || '未知用户')}</div>
          <div class="dt-handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="dt-time">${esc2(fmtTime(t.created_at))}</div>
      </div>
      <div class="dt-text">${esc2(t.text || '')}</div>
      ${mediaHtml ? `<div class="dt-media">${mediaHtml}</div>` : ''}
      <div class="dt-counts">
        ${t.reply_count != null ? `<span>💬 <b>${t.reply_count}</b></span>` : ''}
        ${t.retweet_count != null ? `<span>🔁 <b>${t.retweet_count}</b></span>` : ''}
        ${t.favorite_count != null ? `<span>❤️ <b>${t.favorite_count}</b></span>` : ''}
        ${t.quote_count != null ? `<span>💭 <b>${t.quote_count}</b></span>` : ''}
        ${t.view_count != null ? `<span>👁 <b>${t.view_count}</b></span>` : ''}
      </div>
      <div class="dt-actions">
        <button class="fav ${isFav ? 'on' : ''}" data-tid="${esc2(t.tweet_id)}">${isFav ? '★ 已收藏' : '☆ 收藏'}</button>
        <button class="dl" data-url="${esc2(t.url || '')}">⬇ 下载</button>
        <button class="openx" data-url="${esc2(t.url || '')}">打开原文 ↗</button>
      </div>`;
    // 作者名跳 profile
    card.querySelectorAll('[data-link]').forEach((el) => {
      el.addEventListener('click', () => { const u = el.dataset.link; if (u) window.open(u, '_blank', 'noopener'); });
    });
    // 收藏/移出
    card.querySelectorAll('.fav').forEach((b) => b.addEventListener('click', () => {
      const tid = b.dataset.tid;
      if (favSet.has(tid)) {
        b.disabled = true;
        req(`${API}/bookmarks/folder/${encodeURIComponent(tid)}`, { method: 'DELETE' })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.delete(tid); saveFavSet(); b.classList.remove('on'); b.textContent = '☆ 收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      } else {
        b.disabled = true; b.textContent = '收藏中…';
        req(`${API}/bookmarks/folder`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.add(tid); saveFavSet(); b.classList.add('on'); b.textContent = '★ 已收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      }
    }));
    // 下载
    card.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url;
      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(u || t.url)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; b.disabled = !ok; })
        .catch(() => { b.textContent = '下载失败'; b.disabled = false; });
    }));
    // 打开原文（明确点击才跳 X）
    card.querySelectorAll('.openx').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url; if (u) window.open(u, '_blank', 'noopener');
    }));
    return card;
  }

  // 渲染一条回复
  function renderReplyCard(rp) {
    const a = rp.author || {};
    const thumb = (rp.media || []).slice(0, 1).map((m) =>
      m.url ? `<div class="dt-reply-media"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" /></div>` : '').join('');
    const div = document.createElement('div');
    div.className = 'dt-reply';
    div.innerHTML = `
      ${a.avatar ? `<img src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
      <div class="rv">
        <div class="head">
          <span class="rname">${esc2(a.name || a.screen_name || '未知')}</span>
          <span class="rhandle">@${esc2(a.screen_name || 'unknown')}</span>
          <span class="dt-time">${esc2(fmtTime(rp.created_at))}</span>
        </div>
        <div class="rtext">${esc2(rp.text || '')}</div>
        ${thumb}
      </div>`;
    return div;
  }

  async function openTweetDetail(tweetId, seed) {
    // 打开详情层
    dtEl.classList.add('active');
    dtBody.innerHTML = '<div class="bm-empty">加载中…</div>';
    dtReplies.innerHTML = '';
    dtLoadmore.style.display = 'none';
    dtCursor = null;
    if (seed) {
      // 先用列表数据即时渲染，再拉取完整详情+评论区
      dtBody.innerHTML = '';
      dtBody.appendChild(renderTweetDetailCard(seed));
      dtReplies.innerHTML = '<div class="bm-empty">正在加载评论区…</div>';
    }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(tweetId)}`);
      const d = await r.json();
      if (!d.success) {
        dtBody.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '')}</div>`;
        return;
      }
      if (d.tweet) {
        dtCurTweet = d.tweet;
        dtBody.innerHTML = '';
        dtBody.appendChild(renderTweetDetailCard(d.tweet));
        recordHistory(d.tweet);  // P1-7：记录浏览历史（fire-and-forget）
      }
      const replies = d.replies || [];
      dtReplies.innerHTML = replies.length ? '<div class="dt-reply-title">回复</div>' : '<div class="bm-empty">还没有回复。</div>';
      replies.forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
      dtCursor = d.next_cursor || null;
      dtLoadmore.style.display = dtCursor ? '' : 'none';
    } catch (e) {
      if (!seed) dtBody.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  // 评论区加载更多
  async function loadMoreReplies() {
    if (!dtCurTweet || dtLoading || !dtCursor) return;
    dtLoading = true;
    if (dtMoreBtn) { dtMoreBtn.disabled = true; dtMoreBtn.innerHTML = '<span class="spinner"></span>加载中…'; }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(dtCurTweet.tweet_id)}?cursor=${encodeURIComponent(dtCursor)}`);
      const d = await r.json();
      (d.replies || []).forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
      dtCursor = d.next_cursor || null;
      dtLoadmore.style.display = dtCursor ? '' : 'none';
    } catch (_) {} finally {
      dtLoading = false;
      if (dtMoreBtn) { dtMoreBtn.disabled = false; dtMoreBtn.innerHTML = '加载更多回复'; }
    }
  }

  $('dt-back').addEventListener('click', () => { dtEl.classList.remove('active'); });
  $('dt-more').addEventListener('click', loadMoreReplies);

  /* ---- 本地浏览历史（P1-7） ---- */
  const hsList = $('hs-list');

  async function recordHistory(tweet) {
    if (!tweet || !tweet.tweet_id) return;
    try {
      await req(`${API}/history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tweet),
      });
    } catch (_) {}
  }

  async function loadHistory() {
    hsList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const r = await req(`${API}/history?limit=100`);
      const d = await r.json();
      if (!d.success) { hsList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      const items = d.items || [];
      if (!items.length) { hsList.innerHTML = '<div class="bm-empty">浏览过的推文会记录在这里，可回看。</div>'; return; }
      hsList.innerHTML = '';
      // 复用浏览卡渲染（含点开详情/收藏/下载），历史可回看
      items.forEach((it) => hsList.appendChild(renderBrowseCard(it)));
    } catch (e) {
      hsList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('hs-refresh').addEventListener('click', loadHistory);
  $('hs-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部浏览历史？')) return;
    await req(`${API}/history?clear=1`, { method: 'DELETE' });
    loadHistory();
  });

  /* ---- 媒体缓存管理（P2-9） ---- */
  const mcList = $('mc-list');
  const mcStats = $('mc-stats');

  function fmtSize(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  async function loadCache() {
    mcList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const r = await req(`${API}/media/cache`);
      const d = await r.json();
      if (!d.success) { mcList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      const items = d.items || [];
      const total = d.total_bytes || 0;
      mcStats.innerHTML = `共 <b>${items.length}</b> 个文件，占用 <b>${fmtSize(total)}</b>（上限 512MB）`;
      if (!items.length) { mcList.innerHTML = '<div class="bm-empty">点开的图片/视频会缓存到本地，可回看。</div>'; return; }
      mcList.innerHTML = '';
      items.slice(0, 100).forEach((it) => {
        const el = document.createElement('div');
        el.className = 'mc-item';
        el.innerHTML = `<span class="type">${it.type === 'video' ? '🎬' : '🖼'}</span>
          <span class="name">${esc2(it.file)}</span>
          <span class="size">${fmtSize(it.size)}</span>`;
        mcList.appendChild(el);
      });
    } catch (e) {
      mcList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('mc-refresh').addEventListener('click', loadCache);
  $('mc-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部媒体缓存？已缓存图片/视频将需要重新从 X 加载。')) return;
    await req(`${API}/media/cache`, { method: 'DELETE' });
    loadCache();
  });

  /* ---- 初始化：默认 tab 是浏览，打开即自动加载关注流（无需点刷新） ---- */
  (function initAutoBrowse() {
    const waitToken = () => {
      if (!TOKEN) { setTimeout(waitToken, 200); return; }
      // 若默认 tab 为浏览且尚未加载，自动拉取关注流
      const activeTab = tabsEl.querySelector('.tab.active');
      if (activeTab && activeTab.dataset.view === 'browse' &&
          brList && !brList.querySelector('.bm-card')) {
        brAutoRestore = true;
        loadBrowse(true);
      }
    };
    waitToken();
  })();
</script>
</body>
</html>
