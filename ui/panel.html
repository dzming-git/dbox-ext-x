  <!-- Lightbox：点击图片放大 -->
  <div class="lightbox" id="lb">
    <button class="nav prev" id="lb-prev" aria-label="上一张"></button>
    <img id="lb-img" alt="" />
    <button class="nav next" id="lb-next" aria-label="下一张"></button>
    <div class="counter" id="lb-counter"></div>
  </div>

  <!-- 推文详情页（DBox 内预览推文 + 评论区） -->
  <div class="detail" id="detail">
    <div class="detail-box">
      <div class="detail-top">
        <button class="detail-back" id="dt-back">← 返回</button>
        <span class="detail-title">推文详情</span>
      </div>
      <div class="detail-scroll" id="dt-scroll">
        <div id="dt-body"><div class="bm-empty">加载中…</div></div>
        <div class="detail-replies" id="dt-replies"></div>
        <div class="bm-loadmore" id="dt-loadmore" style="display:none"><button id="dt-more">加载更多回复</button></div>
      </div>
    </div>
  </div>

  <!-- 日志/状态区：下载时显示 -->
  <div class="status" id="status">
    <div class="progress" id="prog" style="display:none"><div id="prog-bar"></div></div>
    <div class="status-msg" id="status-msg"></div>
    <div class="log" id="log" style="display:none"></div>
    <div id="pick"></div>
  </div>
</div>
<script>
  let TOKEN = '';
  let librariesLoaded = false;
  let standaloneRoute = '';
  let _lbItems = [];    // lightbox 左右切换的混合序列（图片 + 视频）
  let _lbIdx = 0;
  const API = '/api/ext/x';
  const JOB_KEY = 'xd_job';  // localStorage key for active job
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'DBOX_TOKEN' && e.data.token) {
      TOKEN = e.data.token;
      if (!librariesLoaded) loadLibraries();
      // token 到达后恢复可能存在的旧任务（iframe 重建场景）
      if (!jobId) { const saved = restoreJob(); if (saved) { jobId = saved; startPolling(); } }
    }
    if (e.data.type === 'DBOX_EXT_INFO' && e.data.standalone_route) {
      standaloneRoute = e.data.standalone_route;
    }
  });
  window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), logEl = $('log'), progEl = $('prog'), progBar = $('prog-bar');
  const formEl = $('form'), previewEl = $('pv-wrap'), gridEl = $('pv-grid');
  let jobId = null, poller = null;
  const seenLogs = new Set();

  // ---- 跨 iframe 重建恢复：从 localStorage 恢复活跃任务 ----
  function saveJob(id) {
    if (id) { try { localStorage.setItem(JOB_KEY, id); } catch(_) {} }
    else { try { localStorage.removeItem(JOB_KEY); } catch(_) {} }
  }
  function restoreJob() {
    try { return localStorage.getItem(JOB_KEY) || null; } catch(_) { return null; }
  }
  // 页面加载时检查是否有未完成任务，自动恢复轮询
  window.addEventListener('load', () => {
    const saved = restoreJob();
    if (saved && TOKEN) {
      jobId = saved;
      startPolling();
    }
  });
  // token 到达时也尝试恢复（token 可能比 load 晚）
  const _origTokenHandler = null; // 标记需要在 message 监听里加恢复逻辑

  // 预览开关控制按钮文案
  $('preview').addEventListener('change', () => {
    $('run').textContent = $('preview').checked ? '解析预览' : '开始下载';
  });

  // 全屏入口已统一由框架层（ExtensionHost）面板 header 的「⛶ 全屏」按钮提供，
  // panel 自身不再维护独立全屏按钮。


  const AUTH = () => ({ 'Authorization': 'Bearer ' + TOKEN });

  // 读取当前最可能有效的 token（主站 axios 刷新后会写回 localStorage，iframe 同源可共享）。
  function latestToken() {
    try {
      return localStorage.getItem('token')
        || localStorage.getItem('access_token')
        || sessionStorage.getItem('token')
        || TOKEN;
    } catch (_) { return TOKEN; }
  }

  // 向父窗口重新索要最新 token（父窗口会实时读 localStorage/store）。
  function requestTokenFromParent() {
    return new Promise((resolve) => {
      let resolved = false;
      const done = (e) => {
        if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) {
          resolved = true;
          window.removeEventListener('message', done);
          resolve(e.data.token);
        }
      };
      window.addEventListener('message', done);
      window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');
      setTimeout(() => { window.removeEventListener('message', done); if (!resolved) resolve(null); }, 1500);
    });
  }

  // 用 refresh_token 主动刷新 access_token（不依赖主站是否触发刷新）。
  async function refreshToken() {
    try {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return null;
      const resp = await fetch('/api/v2/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      const data = await resp.json();
      if (data && data.success && data.data && data.data.access_token) {
        const nt = data.data.access_token;
        localStorage.setItem('token', nt);
        localStorage.setItem('access_token', nt);
        if (data.data.refresh_token) localStorage.setItem('refresh_token', data.data.refresh_token);
        return nt;
      }
    } catch (_) {}
    return null;
  }

  // 获取新鲜 token：优先父窗口注入，其次 refresh_token 主动刷新，最后读 localStorage。
  async function requestToken() {
    const fromParent = await requestTokenFromParent();
    if (fromParent && fromParent !== latestToken()) return fromParent;
    const refreshed = await refreshToken();
    if (refreshed) return refreshed;
    return latestToken();
  }

  // 带鉴权 + 401 自动重试的请求：token 过期时重新获取并重试一次。
  async function req(path, opts = {}) {
    const _do = (token) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token } });
    let r = await _do(TOKEN);
    if (r.status === 401) {
      const fresh = await requestToken();
      if (fresh && fresh !== TOKEN) {
        TOKEN = fresh;
        r = await _do(fresh);
      }
    }
    return r;
  }

  // 加载资源库列表
  async function loadLibraries() {
    if (librariesLoaded) return;
    if (!TOKEN) return;
    librariesLoaded = true;
    try {
      const r = await fetch('/api/my-libraries', { headers: AUTH() });
      const d = await r.json();
      const libs = (d.data || d.libraries || []);
      const sel = $('library');
      sel.innerHTML = libs.map(l => `<option value="${l.id}">${l.name}</option>`).join('') || '<option value="">（无可用库）</option>';
    } catch (e) {
      $('library').innerHTML = '<option value="">（加载库失败）</option>';
    }
  }

  /* ---- 视图切换 ---- */
  function showStatus() { statusEl.classList.add('active'); previewEl.classList.remove('active'); }
  function showPreview() { previewEl.classList.add('active'); statusEl.classList.remove('active'); }
  function showIdle() { previewEl.classList.remove('active'); statusEl.classList.remove('active'); }

  /* ---- 缓存：预览数据在关闭后保留，重新打开时直接渲染 ---- */
  let _cachedPreview = null;

  function pushLog(msg, isErr) {
    logEl.style.display = 'block';
    if (seenLogs.has(msg)) return;
    seenLogs.add(msg);
    const line = document.createElement('div');
    line.className = isErr ? 'err' : '';
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(pct, msg) {
    progEl.style.display = 'block';
    progBar.style.width = (pct || 0) + '%';
    if (msg) $('status-msg').textContent = msg;
  }

  function startPolling() {
    if (poller) clearInterval(poller);
    poller = setInterval(async () => {
      if (!jobId) return;
      try {
        const r = await fetch(`${API}/status?job_id=${encodeURIComponent(jobId)}`, { headers: AUTH() });
        const s = await r.json();
        if (!s.success) return;
        setProgress(s.percent, s.message || '');
        (s.logs || []).forEach((l) => pushLog(l));
        if (s.pending_input) {
          // 解析已完成（预览/选择），进度应标满
          setProgress(100, s.message || s.pending_input.title || '解析完成');
          if (s.pending_input.type === 'preview') renderPreview(s.pending_input);
          else renderPick(s.pending_input);
        }
        if (s.done) {
          clearInterval(poller); poller = null;
          pushLog(s.error ? ('失败: ' + s.error) : '任务完成。');
          const btn = document.createElement('button');
          btn.textContent = '← 再来一个';
          btn.style.cssText = 'margin-top:10px;background:#1d9bf0;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;';
          btn.onclick = () => { showIdle(); seenLogs.clear(); $('log').textContent = ''; $('status-msg').textContent = ''; progEl.style.display = 'none'; jobId = null; saveJob(null); };
          statusEl.appendChild(btn);
        }
      } catch (e) {}
    }, 800);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ---- 预览渲染 ---- */
  function renderPreview(input) {
    _cachedPreview = input; // 缓存

    const author = input.author || {};
    let authorHtml = '';
    if (author.screen_name) {
      const name = author.name || author.screen_name;
      authorHtml = `<a href="https://x.com/${esc(author.screen_name)}" target="_blank" rel="noopener">${esc(name)}</a> @${esc(author.screen_name)}`;
    } else if (author.name) {
      authorHtml = esc(author.name);
    }
    $('pv-author').innerHTML = authorHtml;
    $('pv-text').textContent = (input.text || '').trim() || '（该推文无文字内容）';

    const media = input.media || [];
    gridEl.innerHTML = media.map((m, i) => {
      const kindTag = m.type === 'video' ? '<span class="tag">视频</span>'
                    : m.type === 'document' ? '<span class="tag">文档</span>'
                    : '<span class="tag">图片</span>';
      let thumb;
      if (m.type === 'video') {
        const cover = m.cover || '';
        const playable = m.mp4 || (m.url || '').endsWith('.mp4');
        thumb = `<div class="thumb">
          ${cover
            ? `<img src="${esc(cover)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'placeholder\\'>封面加载失败</div>'" />`
            : '<div class="placeholder">视频</div>'}
          <button class="play" data-i="${i}">▶</button>
          <div class="note" hidden>该视频需下载后播放</div>
        </div>`;
        if (!playable) {
          thumb = thumb.replace('<button class="play"', '<button class="play" data-noplay="1"');
        }
      } else if (m.type === 'document') {
        thumb = '<div class="thumb"><div class="placeholder">📄 文档附件</div></div>';
      } else {
        thumb = `<div class="thumb">
          <img src="${esc(m.url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'placeholder\\'>图片加载失败</div>'" />
        </div>`;
      }
      const label = m.label || (m.type === 'video' ? '视频' : m.type === 'document' ? '文档' : '图片');
      return `<div class="media" data-i="${i}">${thumb}
        <label class="meta"><input type="checkbox" data-i="${i}" checked /> ${esc(label)}${kindTag}</label>
      </div>`;
    }).join('');

    // 视频点击播放
    gridEl.querySelectorAll('.media .play').forEach((btn) => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.i);
        const m = media[i];
        const wrap = btn.parentElement;
        if (btn.dataset.noplay) {
          wrap.querySelector('.note').hidden = false;
          btn.hidden = true;
          return;
        }
        const src = m.mp4 || m.url;
        wrap.innerHTML = `<video src="${esc(src)}" controls autoplay playsinline></video>`;
      });
    });

    // 收集 lightbox 可切换序列（图片 + 视频）。视频同时携带 mp4 直链与 m3u8 流，
    // 灯箱优先用 hls.js 播 m3u8（自适应码率 + 全屏最高清），其次直链 mp4。
    _lbItems = [];
    media.forEach((m, i) => {
      if (m.type === 'video') {
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        const mp4 = (m.mp4 && !m.mp4.includes('.m3u8')) ? mediaUrl(m.mp4, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        _lbItems.push({
          type: 'video',
          mi: i,                       // 原始媒体索引，用于单独下载
          src: mp4,                    // 直链 mp4（高清，经 /media 缓存）；空则回退 m3u8
          m3u8: m3u8,                  // HLS 流（经 /media 代理），hls.js 播放
          cover: m.cover || '',
          label: m.label || '视频',
          playable: !!(mp4 || m3u8),
        });
      } else if (m.type !== 'document') {
        if (m.url) _lbItems.push({ type: 'image', src: m.url, label: m.label || '图片' });
      }
    });

    // 缩略图点击放大（lightbox，图片/视频均可）
    gridEl.querySelectorAll('.media .thumb').forEach((thumb) => {
      thumb.addEventListener('click', (e) => {
        if (e.target.closest('.play')) return; // 不拦截视频列表内播放按钮
        const i = Number(thumb.closest('.media').dataset.i);
        // 在 lightbox 序列中按原始媒体索引匹配
        const idx = _lbItems.findIndex((x) => x.mi === i);
        showLightbox(idx >= 0 ? idx : 0);
      });
    });

    // 显示预览，但【不要隐藏状态/日志区】：解析/下载往往还在后台进行
    // （如 GraphQL 阶段已先返回预览数据），隐藏会让人误以为卡死/消失。
    previewEl.classList.add('active');
    // 注意：故意不调用 showPreview()，以免移除 status 的 active 类。
  }

  // 关闭预览 → 回到空闲状态（表单保留），缓存不清除
  $('pv-cancel').onclick = () => { showIdle(); };

  /* ---- Lightbox：点击图片放大查看 + 左右切换（图片/视频） ---- */
  const lbEl = $('lb');
  const lbImg = $('lb-img');
  const lbCounter = $('lb-counter');
  function showLightbox(idx) {
    _lbIdx = idx;
    renderLightbox();
    if (!lbEl.classList.contains('active')) enterDrill('lb');   // 拦截浏览器后退
    lbEl.classList.add('active');
  }
  function renderLightbox() {
    const item = _lbItems[_lbIdx];
    if (!item) return;
    // 清理上一项（停止播放、销毁 hls 实例，避免多个视频同时播放/内存泄漏）
    const oldVid = lbEl.querySelector('video');
    if (oldVid) { try { oldVid._hls && oldVid._hls.destroy(); } catch (e) {} oldVid.pause(); oldVid.remove(); }
    const oldNote = lbEl.querySelector('.lb-note');
    if (oldNote) oldNote.remove();
    lbImg.style.display = 'none';
    lbImg.removeAttribute('src');

    if (item.type === 'video') {
      const m3u8 = item.m3u8 || '';
      const mp4 = item.src || '';
      // 优先 m3u8（hls.js：自适应码率，全屏自动升最高清）；其次直链 mp4；都没有才回退封面 + 下载
      if (m3u8 && window.Hls && window.Hls.isSupported()) {
        const v = document.createElement('video');
        v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false;
        v.preload = 'metadata';
        v.addEventListener('click', (e) => e.stopPropagation());
        lbEl.insertBefore(v, lbCounter);
        const hls = new Hls({ enableWorker: true, lowLatencyMode: false, capLevelToPlayerSize: false });
        hls.loadSource(m3u8);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
        // 全屏强制最高 level 保证清晰度（hls.js 小窗下会选低码率，全屏不升档导致糊）
        const syncLevel = () => {
          if (hls.levels && hls.levels.length) {
            hls.currentLevel = (document.fullscreenElement === v || v.webkitDisplayingFullscreen)
              ? hls.levels.length - 1 : -1; // 全屏最高清，退出恢复 ABR 自动
          }
        };
        v.addEventListener('fullscreenchange', syncLevel);
        v.addEventListener('webkitbeginfullscreen', syncLevel);
        v.addEventListener('webkitendfullscreen', syncLevel);
        v._hls = hls;
      } else if (mp4) {
        const v = document.createElement('video');
        v.src = mp4;
        v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false;
        v.preload = 'metadata';
        v.addEventListener('loadedmetadata', () => v.play().catch(() => {}));
        v.addEventListener('click', (e) => e.stopPropagation());
        lbEl.insertBefore(v, lbCounter);
      } else {
        // 既无 m3u8 也无直链：显示封面 + 下载提示
        lbImg.style.display = '';
        lbImg.src = item.cover || '';
        const note = document.createElement('div');
        note.className = 'lb-note';
        note.innerHTML = `<div class="lb-note-tip">该视频暂无法在线预览，可下载后查看。</div>`
          + (item.mi !== undefined ? `<button class="lb-dl" id="lb-dl-video">⬇ 下载此视频</button>` : '');
        lbEl.appendChild(note);
        if (item.mi !== undefined) {
          $('lb-dl-video').addEventListener('click', (e) => {
            e.stopPropagation();
            showStatus();
            setProgress(0, '开始下载视频…');
            postInput({ action: 'download', items: [item.mi] });
          });
        }
      }
    } else {
      lbImg.style.display = '';
      lbImg.src = item.src;
    }
    const total = _lbItems.length;
    lbCounter.textContent = total > 1 ? `${_lbIdx + 1} / ${total}` : '';
    const hide = total <= 1;
    $('lb-prev').style.display = hide ? 'none' : 'flex';
    $('lb-next').style.display = hide ? 'none' : 'flex';
  }
  function lbStep(dir) {
    if (_lbItems.length <= 1) return;
    _lbIdx = (_lbIdx + dir + _lbItems.length) % _lbItems.length;
    renderLightbox();
  }
  $('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); lbStep(-1); });
  $('lb-next').addEventListener('click', (e) => { e.stopPropagation(); lbStep(1); });
  lbImg.addEventListener('click', (e) => e.stopPropagation());
  lbCounter.addEventListener('click', (e) => e.stopPropagation());

  /* ---- 视频原地点播：点击视频缩略图直接在卡片内播放，不再弹出单独窗口 ---- */
  let _inlineVid = null;
  function stopInlineVideo(rec) {
    if (!rec) return;
    try { rec.hls && rec.hls.destroy(); } catch (e) {}
    try { rec.v.pause(); } catch (e) {}
    if (rec.el && rec.el._thumbHtml !== undefined) {
      rec.el.innerHTML = rec.el._thumbHtml;
      rec.el.classList.remove('playing');
    }
    if (_inlineVid && _inlineVid.el === rec.el) _inlineVid = null;
  }
  function playInlineVideo(mediaEl, mp4, m3u8) {
    if (_inlineVid) stopInlineVideo(_inlineVid);   // 同时只播一个
    if (mediaEl._thumbHtml === undefined) mediaEl._thumbHtml = mediaEl.innerHTML;
    mediaEl.classList.add('playing');
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false; v.preload = 'metadata';
    v.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000;display:block';
    const close = document.createElement('button');
    close.className = 'bm-vclose'; close.textContent = '✕';
    close.addEventListener('click', (e) => { e.stopPropagation(); stopInlineVideo(_inlineVid); });
    mediaEl.innerHTML = '';
    mediaEl.appendChild(v);
    mediaEl.appendChild(close);
    v.play().catch(() => {});   // 在点击激活内启动带声音自动播放
    if (m3u8 && window.Hls && window.Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true, capLevelToPlayerSize: false });
      hls.loadSource(m3u8); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      const sync = () => {  // 全屏强制最高清晰度
        if (hls.levels && hls.levels.length) {
          hls.currentLevel = (document.fullscreenElement === v || v.webkitDisplayingFullscreen)
            ? hls.levels.length - 1 : -1;
        }
      };
      v.addEventListener('fullscreenchange', sync);
      v.addEventListener('webkitbeginfullscreen', sync);
      v.addEventListener('webkitendfullscreen', sync);
      v._hls = hls;
      _inlineVid = { el: mediaEl, v, hls, close };
    } else if (mp4) {
      v.src = mp4;
      v.addEventListener('loadedmetadata', () => v.play().catch(() => {}));
      _inlineVid = { el: mediaEl, v, hls: null, close };
    } else {
      mediaEl.innerHTML = mediaEl._thumbHtml; mediaEl.classList.remove('playing');  // 无可用源：还原缩略图
    }
  }

  /* ---- 拦截浏览器后退：打开灯箱/详情时压入历史，后退即关闭而非离开页面 ---- */
  let _drillStack = [];
  function enterDrill(kind) {
    try { history.pushState({ dboxDrill: kind }, ''); } catch (e) { return; }
    _drillStack.push(kind);
  }
  function closeDrillViaApp(kind) {
    // 直接关闭浮层，确保「返回」按钮始终有效（不再依赖 popstate 时序）
    if (kind === 'lb') lbEl.classList.remove('active');
    else if (kind === 'detail') dtEl.classList.remove('active');
    // 同步历史栈：仅当本浮层是当前最上层（最近压入的 drill）时，回退一次以消费
    // 对应历史项；出栈与再次关闭交由 popstate 统一处理（幂等，重复移除 active 无副作用）
    if (_drillStack.length && _drillStack[_drillStack.length - 1] === kind) {
      try { history.back(); } catch (e) {}
    }
  }
  window.addEventListener('popstate', () => {
    const kind = _drillStack.pop();
    if (kind === 'lb') {
      const v = lbEl.querySelector('video'); if (v) { try { v._hls && v._hls.destroy(); } catch (e) {} v.pause(); }
      lbEl.classList.remove('active');
    } else if (kind === 'detail') {
      dtEl.classList.remove('active');
    }
  });
  // 触摸左右滑动切换（图片/视频）；竖向滑动或点按不触发，避免误关/误触。
  // 关键：在 touchmove 阶段对横向滑动 e.preventDefault()，阻止浏览器将滑动
  // 识别为「系统/浏览器的后退手势」（否则松手前浏览器已发起后退，切图失败）。
  let _lbSwiped = false;
  let _lbSX = 0, _lbSY = 0, _lbSwiping = false, _lbLocked = false;
  function _lbMediaEl() {
    if (lbImg.style.display !== 'none') return lbImg;
    const v = lbEl.querySelector('video');
    return v || lbImg;
  }
  lbEl.addEventListener('touchstart', (e) => {
    if (_lbItems.length <= 1) return;
    const t = e.touches[0];
    _lbSX = t.clientX; _lbSY = t.clientY;
    _lbSwiping = true; _lbLocked = false;
  }, { passive: true });
  lbEl.addEventListener('touchmove', (e) => {
    if (!_lbSwiping || _lbItems.length <= 1) return;
    const t = e.touches[0];
    const dx = t.clientX - _lbSX, dy = t.clientY - _lbSY;
    // 一旦判定为横向滑动，即锁定并吞掉浏览器默认手势（核心防后退手段）
    if (!_lbLocked && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) _lbLocked = true;
    if (_lbLocked) {
      e.preventDefault();
      e.stopPropagation();
      const m = _lbMediaEl();
      m.style.transition = 'none';
      m.style.transform = `translateX(${dx}px)`;   // 实时跟手指，反馈更跟手
    }
  }, { passive: false });
  lbEl.addEventListener('touchend', (e) => {
    if (!_lbSwiping || _lbItems.length <= 1) { _lbSwiping = false; return; }
    _lbSwiping = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - _lbSX, dy = t.clientY - _lbSY;
    const m = _lbMediaEl();
    if (_lbLocked && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      e.preventDefault();          // 阻止随后合成的 click 关闭灯箱
      _lbSwiped = true;
      m.style.transition = ''; m.style.transform = '';
      lbStep(dx < 0 ? 1 : -1);
    } else {
      // 未达阈值：回弹归位
      m.style.transition = 'transform .2s ease';
      m.style.transform = '';
      setTimeout(() => { m.style.transition = ''; }, 220);
    }
  }, { passive: false });
  lbEl.addEventListener('click', () => {
    if (_lbSwiped) { _lbSwiped = false; return; }   // 横向滑动的误触 click 直接吞掉
    closeDrillViaApp('lb');
  });
  // 关闭时停止视频播放
  document.addEventListener('keydown', (e) => {
    if (!lbEl.classList.contains('active')) return;
    if (e.key === 'Escape') {
      closeDrillViaApp('lb');
    }
    else if (e.key === 'ArrowLeft') { lbStep(-1); }
    else if (e.key === 'ArrowRight') { lbStep(1); }
  });
  // 点击背景关闭并停止视频
  // 注：背景点击关闭与停止视频已在上方统一处理，此处不再重复绑定。

  /* ---- 备选选择 ---- */
  function renderPick(input) {
    if ($('pick').dataset.for === jobId + JSON.stringify(input)) return;
    $('pick').dataset.for = jobId + JSON.stringify(input);
    const opts = (input.options || []).map((o) =>
      `<label><input type="${input.multi ? 'checkbox' : 'radio'}" name="pick" value="${esc(o.value)}"> ${esc(o.label)}</label>`).join('');
    $('pick').innerHTML = `<div class="pick"><div>${esc(input.prompt || '请选择')}</div>${opts}
      <button id="pick-ok">确认</button></div>`;
    $('pick-ok').onclick = async () => {
      const vals = Array.from(document.querySelectorAll('input[name=pick]:checked')).map(x => x.value);
      if (!vals.length) { alert('请至少选择一项'); return; }
      await postInput({ action: 'download', items: vals });
      $('pick').innerHTML = '';
    };
  }

  async function postInput(value) {
    await fetch(`${API}/input`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...AUTH() },
      body: JSON.stringify({ job_id: jobId, value }),
    });
  }

  /* ---- 提交任务 ---- */
  $('run').onclick = async () => {
    const url = $('url').value.trim();
    const library_id = $('library').value;
    if (!url) { alert('请填写推文链接'); return; }
    if (!library_id) { alert('请选择目标资源库'); return; }
    if (!TOKEN) { alert('尚未获取到 token'); return; }
    jobId = null; seenLogs.clear();
    $('log').textContent = ''; $('pick').innerHTML = ''; $('status-msg').textContent = ''; progEl.style.display = 'none';
    previewEl.dataset.for = '';
    showStatus();
    setProgress(0, '提交任务…');
    try {
      const r = await fetch(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...AUTH() },
        body: JSON.stringify({
          library_id,
          params: {
            url,
            preview: $('preview').checked,
            auto: true,
            hidden: $('hidden').checked,
          }
        })
      });
      const d = await r.json();
      if (!d.success) { pushLog('提交失败: ' + (d.message || ''), true); return; }
      jobId = d.job_id;
      saveJob(jobId);
      startPolling();
    } catch (e) { pushLog('提交异常: ' + e.message, true); }
  };

  /* ---- 预览区下载 ---- */
  $('pv-download').onclick = async () => {
    const items = Array.from(gridEl.querySelectorAll('input[data-i]:checked')).map(x => Number(x.dataset.i));
    if (!items.length) { alert('请至少勾选一个媒体'); return; }
    showStatus();
    setProgress(0, '开始下载…');
    await postInput({ action: 'download', items });
  };

  /* ---- 首次加载兜底 ---- */
  let loadRetries = 0;
  (function ensureLibraries() {
    if (librariesLoaded) return;
    if (TOKEN) { loadLibraries(); return; }
    if (loadRetries++ < 20) setTimeout(ensureLibraries, 300);
  })();

  /* ---- 标签切换 ---- */
  const tabsEl = $('tabs');
  const viewDownload = $('view-download');
  const viewBrowse = $('view-browse');
  const viewHistory = $('view-history');
  const viewCache = $('view-cache');
  const viewBookmarks = $('view-bookmarks');
  const viewSearch = $('view-search');
  // 进入浏览 tab 时同步 dbox folder 到 favSet（仅一次）
  let brFavSynced = false;
  async function syncFavFromServer() {
    if (brFavSynced) return;
    brFavSynced = true;
    try {
      const r = await req(`${API}/bookmarks/folder`);
      const d = await r.json();
      if (d.success && d.items) {
        let added = 0;
        for (const it of d.items) {
          if (it.tweet_id && !favSet.has(it.tweet_id)) { favSet.add(it.tweet_id); added++; }
        }
        if (added) saveFavSet();
      }
    } catch (_) {}
  }

  // ---- hash 路由（刷新保持视图 / 可深链 / 全屏返回）----
  let activeView = 'browse';
  function switchView(v, { silent = false } = {}) {
    activeView = v;
    // 记忆当前所在视图：迷你窗关闭/重开（iframe 可能被重载或 hash 被框架改写）后，
    // 用 localStorage 而非 URL hash 作为权威来源，保证重开回到上次停留的标签页。
    try { localStorage.setItem('xd_active_view', v); } catch (_) {}
    tabsEl.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.view === v));
    viewDownload.style.display = v === 'download' ? '' : 'none';
    viewBrowse.style.display = v === 'browse' ? '' : 'none';
    viewHistory.style.display = v === 'history' ? '' : 'none';
    viewCache.style.display = v === 'cache' ? '' : 'none';
    viewBookmarks.style.display = v === 'bookmarks' ? '' : 'none';
    viewSearch.style.display = v === 'search' ? '' : 'none';
    if (!silent) location.hash = '#/view/' + v;
    if (v === 'browse') {
      syncFavFromServer();
      openBrowse();   // 渲染缓存+恢复位置+后台静默刷新（不打断查看位置）
    } else if (v === 'history') {
      loadHistory();
    } else if (v === 'cache') {
      loadCache();
    } else if (v === 'bookmarks') {
      if (!bmXList.querySelector('.bm-card') && !bmShowingFolder) loadXBookmarks();
    }
  }

  function parseHash() {
    const m = (location.hash || '').match(/^#\/view\/(\w+)/);
    return m ? m[1] : null;
  }

  // 桌面端刷新按钮：刷新当前列表视图（触摸端用下拉刷新，此按钮仅鼠标设备显示）
  const tbRefresh = $('tb-refresh');
  async function refreshActive() {
    if (!tbRefresh || tbRefresh.classList.contains('spinning')) return;
    tbRefresh.classList.add('spinning');
    try {
      if (activeView === 'browse') { await refreshBrowseKeepPos(); }
      else if (activeView === 'search') { await doSearch(); }
      else if (activeView === 'bookmarks') { loadXBookmarks(); }
    } catch (e) { /* 忽略刷新异常 */ } finally {
      tbRefresh.classList.remove('spinning');
    }
  }
  if (tbRefresh) tbRefresh.addEventListener('click', refreshActive);

  tabsEl.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });

  // 初始视图：优先用 localStorage 记忆的视图（迷你窗重开可靠还原），其次 hash，最后默认 browse。
  // 延迟到脚本末尾再执行，避免 switchView 内引用的 bmXList/bmShowingFolder 等 const 尚未初始化的 TDZ 问题。
  let initialView;
  try { initialView = localStorage.getItem('xd_active_view'); } catch (_) {}
  if (!initialView) initialView = parseHash();
  if (!initialView || !['download', 'browse', 'history', 'cache', 'bookmarks', 'search'].includes(initialView)) initialView = 'browse';
  setTimeout(() => switchView(initialView, { silent: true }), 0);

  window.addEventListener('hashchange', () => {
    const v = parseHash();
    if (v && ['download', 'browse', 'history', 'cache', 'bookmarks', 'search'].includes(v)) switchView(v, { silent: true });
  });

  /* ---- X 收藏 ---- */
  const bmXList = $('bm-x-list');
  const bmFolderList = $('bm-folder-list');
  let bmShowingFolder = false;

  function esc2(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtTime(ts) {
    if (!ts) return '';
    try {
      const d = new Date(ts);
      if (isNaN(d)) return String(ts);
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch { return String(ts); }
  }

  // 把 twimg 媒体 URL 转成本地代理缓存接口：点开即缓存，回看命中本地字节。
  function mediaUrl(url, type) {
    if (!url || !/twimg\.com|pbs\.twimg/.test(url)) return url || '';
    return `${API}/media?u=${encodeURIComponent(url)}&type=${type || 'image'}`;
  }

  function renderBmCard(item, inFolder) {
    const a = item.author || {};
    const medias = (item.media || []).slice(0, 4);
    const mediaHtml = medias.map((m, idx) => {
      if (m.type === 'video') {
        const poster = mediaUrl(m.cover || m.url || '', 'image');
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        const mp4 = (!isM3u8 && m.url) ? mediaUrl(m.url, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        return poster ? `<div class="bm-media" data-idx="${idx}" data-type="video" data-mp4="${esc2(mp4)}" data-m3u8="${esc2(m3u8)}"><video src="" poster="${esc2(poster)}" muted playsinline></video><span class="bm-play">▶</span></div>` : '';
      }
      return m.url ? `<div class="bm-media" data-idx="${idx}" data-type="image"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></div>` : '';
    }).join('');
    const tid = item.tweet_id || '';
    const card = document.createElement('div');
    card.className = 'bm-card';
    card.innerHTML = `
      <div class="head">
        ${a.avatar ? `<img class="avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          <div class="name">${esc2(a.name || a.screen_name || '未知用户')}</div>
          <div class="handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="time">${esc2(fmtTime(item.created_at))}</div>
      </div>
      <div class="text">${esc2(item.text || '')}</div>
      ${mediaHtml ? `<div class="media">${mediaHtml}</div>` : ''}
      <div class="actions">
        ${inFolder
          ? `<button class="open" data-url="${esc2(item.url || '')}">打开原推文</button>
             <button class="del" data-tid="${esc2(tid)}">移出收藏夹</button>`
          : `<button class="open" data-url="${esc2(item.url || '')}">打开原推文</button>
             <button class="add" data-tid="${esc2(tid)}">加入收藏夹</button>`}
      </div>`;
    // 收藏媒体缩略图点击 → lightbox 预览（图片全图 / 视频真实播放）。
    // 灯箱只放图片（视频改为原地点播，不弹窗）；支持左右滑动切换
    const bmLBItems = medias.filter((m) => m.type !== 'video' && (m.url || m.cover)).map((m) => {
      return { type: 'image', src: mediaUrl(m.url || '', 'image'), label: '图片' };
    });
    card.querySelectorAll('.bm-media').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (el.dataset.type === 'video') {
          playInlineVideo(el, el.dataset.mp4, el.dataset.m3u8);   // 视频原地点播，不弹窗
          return;
        }
        const idx = Number(el.dataset.idx || 0);
        if (!bmLBItems.length) return;
        _lbItems = bmLBItems;
        _lbIdx = Math.min(idx, bmLBItems.length - 1);
        showLightbox(_lbIdx);
      });
    });
    card.querySelectorAll('.open').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url; if (u) window.open(u, '_blank', 'noopener');
    }));
    if (inFolder) {
      card.querySelectorAll('.del').forEach((b) => b.addEventListener('click', async () => {
        const tid = b.dataset.tid;
        b.disabled = true; b.textContent = '移除中…';
        try {
          const r = await req(`${API}/bookmarks/folder/${encodeURIComponent(tid)}`, { method: 'DELETE' });
          const d = await r.json();
          if (d.success) renderFolder(d.items);
        } catch (e) { b.disabled = false; b.textContent = '移出收藏夹'; alert('移除失败: ' + e.message); }
      }));
    } else {
      card.querySelectorAll('.add').forEach((b) => b.addEventListener('click', async () => {
        const tid = b.dataset.tid;
        b.disabled = true; b.textContent = '已加入 ✓';
        try {
          // 带入当前选中集合（若有）
          const selEl = document.getElementById('bm-collection');
          const coll = selEl && selEl.value ? selEl.value : null;
          const payload = { ...item };
          if (coll) payload.collection = coll;
          const r = await req(`${API}/bookmarks/folder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const d = await r.json();
          if (!d.success) { b.disabled = false; b.textContent = '加入收藏夹'; alert('加入失败: ' + (d.message || '')); }
        } catch (e) { b.disabled = false; b.textContent = '加入收藏夹'; alert('加入异常: ' + e.message); }
      }));
    }
    return card;
  }

  async function loadXBookmarks() {
    bmXList.innerHTML = '<div class="bm-empty">正在从 X 同步收藏…</div>';
    const all = [];
    let cursor = null;
    let page = 0;
    const MAX_PAGES = 20; // 每页 50 条，最多拉 1000 条，防异常死循环
    try {
      while (page < MAX_PAGES) {
        page++;
        const url = `${API}/bookmarks?count=50${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ''}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (!all.length) { bmXList.innerHTML = `<div class="bm-empty err">同步失败: ${esc2(d.message || '未知错误')}</div>`; return; }
          break; // 中途某页失败，保留已拉到的
        }
        const pageItems = d.items || [];
        pageItems.forEach((it) => all.push(it));
        cursor = d.next_cursor || null;
        // 本页无新增推文或没有下一页了，停止翻页
        if (!cursor || !pageItems.length) break;
      }
      if (!all.length) { bmXList.innerHTML = '<div class="bm-empty">你在 X 上还没有收藏任何推文。</div>'; return; }
      bmXList.innerHTML = '';
      all.forEach((it) => bmXList.appendChild(renderBmCard(it, false)));
    } catch (e) {
      if (!all.length) bmXList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  async function loadCollections() {
    try {
      const r = await req(`${API}/bookmarks/collections`);
      const d = await r.json();
      const sel = $('bm-collection');
      if (!sel) return;
      const cur = sel.value;
      sel.innerHTML = '<option value="">全部收藏</option>';
      (d.items || []).forEach((c) => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = cur || '';
    } catch (_) {}
  }

  async function loadFolder() {
    bmFolderList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const coll = $('bm-collection').value || '';
      const r = await req(`${API}/bookmarks/folder${coll ? `?collection=${encodeURIComponent(coll)}` : ''}`);
      const d = await r.json();
      if (!d.success) { bmFolderList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      renderFolder(d.items || []);
    } catch (e) {
      bmFolderList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  function renderFolder(items) {
    if (!items.length) {
      bmFolderList.innerHTML = '<div class="bm-empty">你还没有把任何收藏保存到 dbox。在「从 X 同步收藏」中点击「加入收藏夹」即可。</div>';
      return;
    }
    bmFolderList.innerHTML = '';
    items.forEach((it) => bmFolderList.appendChild(renderBmCard(it, true)));
  }

  $('bm-sync').addEventListener('click', () => {
    bmShowingFolder = false;
    bmXList.style.display = '';
    bmFolderList.style.display = 'none';
    loadXBookmarks();
  });

  $('bm-show-folder').addEventListener('click', () => {
    bmShowingFolder = true;
    bmXList.style.display = 'none';
    bmFolderList.style.display = '';
    $('bm-folder-bar').style.display = 'flex';
    loadCollections();
    loadFolder();
  });

  // 集合下拉切换时按集合过滤
  $('bm-collection').addEventListener('change', () => loadFolder());
  // 新建集合：把输入框内容加入下拉并选中，之后"加入收藏夹"会用当前集合
  $('bm-collection-add').addEventListener('click', () => {
    const inp = $('bm-collection-input');
    const name = (inp.value || '').trim();
    if (!name) return;
    const sel = $('bm-collection');
    // 添加到下拉（若已存在则不重复）
    let exists = false;
    Array.from(sel.options).forEach((o) => { if (o.value === name) exists = true; });
    if (!exists) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    }
    sel.value = name;
    inp.value = '';
    loadFolder();
  });

  /* ---- 浏览（关注流） ---- */
  const brList = $('br-list');
  const brMoreBtn = $('br-more');
  const brLoadmore = $('br-loadmore');
  let brCursor = null;
  let brLoading = false;
  const brSeenIds = new Set();   // 浏览去重：同一 tweet_id 只渲染一次
  const downloadedTweetIds = new Set();  // 避免重复下载
  const favSet = new Set();              // 已收藏 tweet_id（用于浏览卡按钮态）
  const BROWSE_CACHE_KEY = 'xd_browse_cache';  // localStorage：浏览数据跨视图共享
  const BROWSE_FAV_KEY = 'xd_browse_favs';      // localStorage：已收藏 tweet_id 列表
  // 从 localStorage 恢复已收藏集合（小屏全屏共享）
  try { (JSON.parse(localStorage.getItem(BROWSE_FAV_KEY) || '[]') || []).forEach((t) => favSet.add(t)); } catch (_) {}

  // 用统一的缩略图 HTML 渲染一组媒体（图片/视频），最多 4 个
  function cardMediaInner(mediaList) {
    const medias = (mediaList || []).slice(0, 4);
    const mCls = `m${Math.min(medias.length, 4)}`;
    const html = medias.map((m, idx) => {
      if (m.type === 'video') {
        const poster = mediaUrl(m.cover || m.url || '', 'image');
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        const mp4 = (!isM3u8 && m.url) ? mediaUrl(m.url, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        return poster ? `<div class="bm-media" data-idx="${idx}" data-type="video" data-mp4="${esc2(mp4)}" data-m3u8="${esc2(m3u8)}"><video src="" poster="${esc2(poster)}" muted playsinline></video><span class="bm-play">▶</span></div>` : '';
      }
      return m.url ? `<div class="bm-media" data-idx="${idx}" data-type="image"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></div>` : '';
    }).join('');
    return html ? `<div class="media ${mCls}">${html}</div>` : '';
  }

  // 给某个卡片区块内的媒体缩略图绑定交互：点图进灯箱、点视频原地点播
  function wireMediaBlock(blockEl, mediaList) {
    if (!blockEl) return;
    const lbItems = (mediaList || []).filter((m) => m.type !== 'video' && (m.url || m.cover))
      .map((m) => ({ type: 'image', src: mediaUrl(m.url || '', 'image'), label: '图片' }));
    blockEl.querySelectorAll('.bm-media').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(el.dataset.idx || 0);
        if (el.dataset.type === 'video') {
          playInlineVideo(el, el.dataset.mp4, el.dataset.m3u8);
          return;
        }
        if (!lbItems.length) return;
        _lbItems = lbItems;
        _lbIdx = Math.min(idx, lbItems.length - 1);
        showLightbox(_lbIdx);
      });
    });
  }

  // 引用转发（quote）的嵌套卡片 HTML：含头像/名字/正文/媒体
  function quotedHtml(q) {
    const a = (q && q.author) || {};
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const tid = (q && q.tweet_id) || '';
    const qurl = (q && q.url) || '';
    return `
      <div class="quoted" data-tid="${esc2(tid)}" data-url="${esc2(qurl)}">
        <div class="q-head">
          ${a.avatar ? `<img class="q-avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
          <div>
            <div class="q-name" data-link="${esc2(profileUrl)}">${esc2(a.name || a.screen_name || '未知用户')}</div>
            <div class="q-handle">@${esc2(a.screen_name || 'unknown')}</div>
          </div>
        </div>
        <div class="q-text">${esc2((q && q.text) || '')}</div>
        ${cardMediaInner((q && q.media) || [])}
      </div>`;
  }

  // 浏览卡片：缩略图/作者点击直接跳原推文或作者 profile，actions 是 [⭐ 收藏] [⬇ 下载]
  function renderBrowseCard(item) {
    const a = item.author || {};
    const medias = (item.media || []).slice(0, 4);
    const mediaHtml = cardMediaInner(medias);
    const tid = item.tweet_id || '';
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const card = document.createElement('div');
    card.className = 'bm-card';
    card.dataset.tid = tid;
    card.innerHTML = `
      ${item.retweeted_by ? `<div class="rt-note">↻ 由 @${esc2(item.retweeted_by.screen_name || item.retweeted_by.name || '某人')} 转发</div>` : ''}
      <div class="head">
        ${a.avatar ? `<img class="avatar" data-link="${esc2(profileUrl)}" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          <div class="name" data-link="${esc2(profileUrl)}">${esc2(a.name || a.screen_name || '未知用户')}</div>
          <div class="handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="time">${esc2(fmtTime(item.created_at))}</div>
      </div>
      <div class="text">${esc2(item.text || '')}</div>
      ${mediaHtml}
      ${item.quoted ? quotedHtml(item.quoted) : ''}
      <div class="actions">
        <button class="fav ${favSet.has(tid) ? 'on' : ''}" data-tid="${esc2(tid)}">${favSet.has(tid) ? '★ 已收藏' : '☆ 收藏'}</button>
        <button class="dl" data-tid="${esc2(tid)}">⬇ 下载</button>
      </div>`;
    // 点击图片/视频缩略图 → lightbox 大图/播放视频（不是打开帖子）。
    // 点击正文/标题 → 打开 DBox 内推文详情页。
    // 作者名/头像点击跳作者 profile（仍走外链，因 dbox 暂无用户资料页）。
    const tweetUrl = item.url || `https://x.com/${a.screen_name || 'unknown'}/status/${tid}`;
    const openDetail = (e) => { e.stopPropagation(); openTweetDetail(tid, item); };
    // 主图 + 引用卡片内的图：绑定灯箱/原地点播
    wireMediaBlock(card.querySelector('.media'), medias);
    if (item.quoted) wireMediaBlock(card.querySelector('.quoted'), item.quoted.media || []);
    // 正文（及整卡空白区）→ 打开帖子详情
    card.querySelector('.text').addEventListener('click', openDetail);
    card.addEventListener('click', (e) => {
      if (e.target === card || e.target.classList.contains('text')) openDetail(e);
    });
    card.querySelectorAll('[data-link]').forEach((el) => {
      el.addEventListener('click', (e) => { e.stopPropagation(); const u = el.dataset.link; if (u) window.open(u, '_blank', 'noopener'); });
    });
    // 引用卡片整体 → 打开被引用推文详情
    const qEl = card.querySelector('.quoted');
    if (qEl) {
      qEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-link]') || e.target.closest('.bm-media')) return;  // 链接/媒体自行处理
        e.stopPropagation();
        const qt = qEl.dataset.tid;
        if (qt) openTweetDetail(qt, item.quoted);
      });
    }
    // 收藏 / 移出收藏
    card.querySelectorAll('.fav').forEach((b) => b.addEventListener('click', () => {
      const t = b.dataset.tid;
      if (favSet.has(t)) {
        // 已收藏 → 移出
        b.disabled = true;
        req(`${API}/bookmarks/folder/${encodeURIComponent(t)}`, { method: 'DELETE' })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              favSet.delete(t); saveFavSet();
              b.classList.remove('on');
              b.textContent = '☆ 收藏';
            } else {
              b.textContent = '失败: ' + (d.message || '');
            }
            b.disabled = false;
          })
          .catch(() => { b.textContent = '失败'; b.disabled = false; });
      } else {
        // 加入收藏
        b.disabled = true; b.textContent = '收藏中…';
        req(`${API}/bookmarks/folder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item),
        })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              favSet.add(t); saveFavSet();
              b.classList.add('on');
              b.textContent = '★ 已收藏';
            } else {
              b.textContent = '失败: ' + (d.message || '');
            }
            b.disabled = false;
          })
          .catch(() => { b.textContent = '失败'; b.disabled = false; });
      }
    }));
    // 下载
    card.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => {
      const t = b.dataset.tid;
      if (downloadedTweetIds.has(t)) return;
      downloadedTweetIds.add(t);
      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(tweetUrl)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; if (!ok) { downloadedTweetIds.delete(t); b.disabled = false; } })
        .catch(() => { b.textContent = '下载失败'; downloadedTweetIds.delete(t); b.disabled = false; });
    }));
    return card;
  }

  async function downloadTweet(tweetUrl) {
    const libraryId = $('library').value;
    if (!libraryId) { alert('请先选择目标资源库'); return false; }
    try {
      const r = await req(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          library_id: libraryId,
          params: { url: tweetUrl, preview: false, auto: true, hidden: $('hidden').checked },
        }),
      });
      const d = await r.json();
      return !!(d && d.success);
    } catch (_) { return false; }
  }

  // 浏览数据缓存：小屏/全屏共享，避免切换后重新刷新
  // 按发布时间倒序（最新在前）
  function sortItemsByTime(items) {
    return items.slice().sort((a, b) => {
      const ta = a.created_at ? Date.parse(a.created_at) : 0;
      const tb = b.created_at ? Date.parse(b.created_at) : 0;
      return tb - ta;
    });
  }
  function saveBrowseCache(items, append) {
    try {
      const MAX_CACHE = 400;   // 限制缓存规模，避免每次打开都把最新一页 concat 进去做成无限增长、排序重排后位置记忆错位
      if (!append) localStorage.setItem(BROWSE_CACHE_KEY, JSON.stringify({ ts: Date.now(), items: sortItemsByTime(items).slice(0, MAX_CACHE), cursor: brCursor }));
      else {
        const old = JSON.parse(localStorage.getItem(BROWSE_CACHE_KEY) || 'null') || {};
        const merged = sortItemsByTime((old.items || []).concat(items)).slice(0, MAX_CACHE);
        localStorage.setItem(BROWSE_CACHE_KEY, JSON.stringify({ ts: Date.now(), items: merged, cursor: brCursor }));
      }
    } catch (_) {}
  }
  function renderCachedBrowse() {
    try {
      const c = JSON.parse(localStorage.getItem(BROWSE_CACHE_KEY) || 'null');
      // 打开即秒开：只要有过缓存（无论多久）都先渲染，随后后台静默刷新，避免白屏等"加载中"
      if (!c || !c.items || !c.items.length) return false;
      brList.innerHTML = '';
      brSeenIds.clear();
      sortItemsByTime(c.items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        brList.appendChild(renderBrowseCard(it));
      });
      brCursor = c.cursor || null;
      brLoadmore.style.display = 'none';
      return true;
    } catch (_) { return false; }
  }
  function saveFavSet() {
    try { localStorage.setItem(BROWSE_FAV_KEY, JSON.stringify(Array.from(favSet))); } catch (_) {}
  }

  // ---- 浏览位置记忆：记住上次看到的推文，重进时定位回去，往上滑看更新 ----
  const BROWSE_POS_KEY = 'xd_browse_pos';
  let brOpenMode = false;   // 「打开即秒开」模式：渲染缓存+恢复位置+后台静默刷新，不打断查看位置
  function saveBrowsePos() {
    const cont = viewBrowse;
    if (!cont) return;
    if (activeView !== 'browse') return;   // 仅当浏览视图可见时才记录，避免隐藏容器/其它视图的滚动污染位置记忆
    if (cont.style.display === 'none' || getComputedStyle(cont).display === 'none') return;
    const contRect = cont.getBoundingClientRect();
    const cards = brList.querySelectorAll('.bm-card');
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      // 找视口内（或顶部刚露出）的第一张卡片
      if (r.bottom > contRect.top) {
        const absTop = r.top - contRect.top + cont.scrollTop;
        const tid = c.dataset.tid;
        if (tid) {
          try { localStorage.setItem(BROWSE_POS_KEY, JSON.stringify({ tid, top: absTop })); } catch (_) {}
        }
        break;
      }
    }
  }
  function restoreBrowsePos() {
    if (!brOpenMode) return;
    let pos = null;
    try { pos = JSON.parse(localStorage.getItem(BROWSE_POS_KEY) || 'null'); } catch (_) {}
    brOpenMode = false;
    if (!pos || !pos.tid) { viewBrowse.scrollTop = 0; return; }   // 无记忆 → 回到最新（顶部）
    const card = Array.from(brList.querySelectorAll('.bm-card')).find((c) => c.dataset.tid === pos.tid);
    if (!card) { viewBrowse.scrollTop = 0; return; }   // 该推文已不在当前缓存 → 回到最新，而不是落在别处
    const contRect = viewBrowse.getBoundingClientRect();
    const r = card.getBoundingClientRect();
    const absTop = r.top - contRect.top + viewBrowse.scrollTop;
    viewBrowse.scrollTop = Math.max(0, absTop - 8);
    // 媒体图可能晚于布局加载导致卡片高度变化，下一帧再校正一次，避免「跳到别的帖子」。
    requestAnimationFrame(() => {
      const c2 = brList.querySelector(`.bm-card[data-tid="${CSS.escape(pos.tid)}]`);
      if (!c2) return;
      const rr = c2.getBoundingClientRect();
      const at = rr.top - viewBrowse.getBoundingClientRect().top + viewBrowse.scrollTop;
      viewBrowse.scrollTop = Math.max(0, at - 8);
    });
  }

  // 打开即秒开：先渲染上次缓存、恢复到上次查看位置，随后后台静默拉取最新（见 loadBrowse 的 open 模式）。
  function openBrowse() {
    brOpenMode = true;
    loadBrowse(true);
  }

  // 后台刷新成功后：把新推文静默插到列表顶部（保留当前查看位置），用户上滑即可看到。
  function prependNewTweets(items) {
    const cont = viewBrowse;
    if (!cont) return;
    const atTop = cont.scrollTop <= 4;            // 用户正停在顶部（看最新）→ 插入后仍在顶部
    const prevHeight = brList.scrollHeight;
    const frag = document.createDocumentFragment();
    let inserted = 0;
    sortItemsByTime(items).forEach((it) => {
      const id = it.tweet_id || it.id;
      if (!id || brSeenIds.has(String(id))) return;   // 跳过已缓存/已渲染的，避免重复爬取展示
      brSeenIds.add(String(id));
      frag.appendChild(renderBrowseCard(it));
      inserted++;
    });
    if (!inserted) return;                         // 没有新推文 → 查看位置完全不变
    brList.insertBefore(frag, brList.firstChild);
    if (!atTop) {
      // 用户停在历史位置：新内容插在顶部，把多出的高度补偿回滚动量，原本看到的卡片原地不动
      const delta = brList.scrollHeight - prevHeight;
      if (delta > 0) cont.scrollTop += delta;
    }
    // 新推文已静默插到顶部；不弹「点击查看」横幅——用户向上滑即可看到，下拉刷新亦可主动获取。
  }

  // 下拉刷新 / 桌面刷新按钮：拉取最新一页并「顶部插入、保持查看位置」（不回到顶部），
  // 新内容出现在上方，用户继续向下滑动即可看到；与面板打开时的静默刷新行为一致。
  async function refreshBrowseKeepPos() {
    if (brLoading) return;
    brLoading = true;
    try {
      const r = await req(`${API}/timeline?count=50`);
      const d = await r.json();
      if (!d.success) {
        if (!brList.querySelector('.bm-card'))
          brList.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '未知错误')}</div>`;
        return;
      }
      prependNewTweets(d.items || []);
      brCursor = d.next_cursor || null;
      // 主动刷新＝已「追到最新」：把记忆位置重置为最新（顶部），下次打开/重开直接看到刚刷到的已读帖子，
      // 而不是又跳回之前深翻到的旧帖。
      try {
        const firstCard = brList.querySelector('.bm-card');
        if (firstCard) localStorage.setItem(BROWSE_POS_KEY, JSON.stringify({ tid: firstCard.dataset.tid, top: 0 }));
      } catch (_) {}
    } catch (e) {
      if (!brList.querySelector('.bm-card'))
        brList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    } finally {
      brLoading = false;
    }
  }

  // 顶部「正在后台加载」提示（不打断查看）
  function showBgLoading(on) {
    let el = $('br-bgload');
    if (!el) {
      el = document.createElement('div');
      el.id = 'br-bgload';
      el.className = 'bm-newbar';
      brList.parentNode.insertBefore(el, brList);
    }
    if (on) {
      el.style.display = '';
      el.innerHTML = '<button disabled style="width:100%;padding:9px;border:none;border-radius:9px;font-size:13px;background:#eef5fd;color:#1d9bf0;cursor:default">🔄 正在后台加载最新推文…</button>';
    } else {
      el.style.display = 'none';
      el.innerHTML = '';
    }
  }

  async function loadBrowse(reset = true) {
    if (brLoading) return;
    brLoading = true;
    const openMode = !!(reset && brOpenMode);
    if (reset) {
      brCursor = null;
      brLoadmore.style.display = 'none';   // 改为自动加载，不再显示手动按钮
      if (openMode) {
        // 打开即秒开：先渲染上次缓存（不清除）、恢复到上次查看位置；随后后台静默刷新
        renderCachedBrowse();
        brCursor = null;                   // 后台拉取从最新一页开始，而非缓存游标
        restoreBrowsePos();
        showBgLoading(true);
      } else {
        brSeenIds.clear();
        const preview = renderCachedBrowse();
        if (!preview) brList.innerHTML = '<div class="bm-empty">正在加载关注流…</div>';
      }
    } else {
      if (brMoreBtn) { brMoreBtn.disabled = true; brMoreBtn.innerHTML = '<span class="spinner"></span>加载中…'; }
    }
    try {
      if (reset) {
        const url = `${API}/timeline?count=50${brCursor ? `&cursor=${encodeURIComponent(brCursor)}` : ''}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (reset && !brList.querySelector('.bm-card'))
            brList.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '未知错误')}</div>`;
          return;
        }
        const items = d.items || [];
        if (openMode) {
          prependNewTweets(items);            // 顶部插入新推文，保持查看位置
          saveBrowseCache(items, false);      // 以服务端最新时间线作为下次打开的缓存
        } else {
          brList.innerHTML = '';
          brSeenIds.clear();
          brCursor = null;
          if (!items.length) brList.innerHTML = '<div class="bm-empty">关注流暂时没有新推文。</div>';
          sortItemsByTime(items).forEach((it) => {
            const id = it.tweet_id || it.id;
            if (!id || brSeenIds.has(String(id))) return;
            brSeenIds.add(String(id));
            brList.appendChild(renderBrowseCard(it));
          });
          saveBrowseCache(items, false);
        }
        brCursor = d.next_cursor || null;
        brLoadmore.style.display = 'none';   // 自动加载，隐藏手动按钮
      } else {
        // 上拉加载更旧：X 关注流游标会返回大量重叠内容，单次只多出 2-3 条。
        // 一次上拉连续翻多页，攒够一批真正新的推文再结束，做到「等一次、看很多」。
        await loadOlderBatch();
      }
    } catch (e) {
      if (reset && !brList.querySelector('.bm-card'))
        brList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    } finally {
      if (openMode) showBgLoading(false);
      brLoading = false;
      if (brMoreBtn) { brMoreBtn.disabled = false; brMoreBtn.innerHTML = '加载更多'; }
      // 无脑上滑：内容不足一屏（还无法触发滚动）时自动续加载，直到填满或没有更多
      setTimeout(brAutoFill, 200);
    }
  }

  // 上拉加载更旧（批量）：X 关注流 GraphQL 的 Bottom 游标往往返回大量与已加载内容
  // 重叠的推文，单次请求去重后只剩 2-3 条新的，导致「看两条、又要等几秒」。
  // 这里一次上拉连续翻多页（每页 50 条，最多 MAX_PAGES 页），直到攒够 BATCH_TARGET
  // 条真正新的推文，或者没有更多页为止——让用户等一次、看一大段，等待远小于浏览时间。
  async function loadOlderBatch() {
    const BATCH_TARGET = 40;   // 一次预加载至少攒够这么多条新推文
    const MAX_PAGES = 6;       // 最多翻几页，避免单次等待过久
    let appendedTotal = 0, pages = 0, allItems = [];
    while (brCursor && pages < MAX_PAGES) {
      pages++;
      const url = `${API}/timeline?count=50${brCursor ? `&cursor=${encodeURIComponent(brCursor)}` : ''}`;
      const r = await req(url);
      const d = await r.json();
      if (!d.success) break;
      const items = d.items || [];
      if (!items.length) { brCursor = null; break; }
      allItems = allItems.concat(items);
      let appended = 0;
      sortItemsByTime(items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        const card = renderBrowseCard(it);
        card.classList.add('card-enter');
        card.style.animationDelay = Math.min(appendedTotal * 18, 600) + 'ms';
        brList.appendChild(card);
        appended++; appendedTotal++;
      });
      brCursor = d.next_cursor || null;
      if (appended === 0) {
        // 整页都是已见过的（X 游标重叠），继续翻下一页；若已无下一页则停止
        if (!brCursor) break;
        continue;
      }
      if (appendedTotal >= BATCH_TARGET) break;
    }
    brLoadmore.style.display = 'none';
    if (appendedTotal && allItems.length) saveBrowseCache(allItems, true);
  }

  // 无脑上滑：若关注流尚未填满可视区（scrollHeight<=clientHeight 无法滚动触发
  // 无限滚动），则自动继续加载下一页，保证用户只要一直上滑就有新推文，无需点按钮。
  function brAutoFill() {
    if (brLoading || !brCursor) return;
    const cont = viewBrowse;
    if (!cont) return;
    if (cont.scrollHeight <= cont.clientHeight + 8) {
      loadBrowse(false);
    }
  }

  /* ---- 搜索 ---- */
  const srchList = $('srch-list');
  const srchLoadmore = $('srch-loadmore');
  const srchMoreBtn = $('srch-more');
  const srchInput = $('srch-input');
  let srchLoading = false;
  let srchCursor = null;
  let srchSeenIds = new Set();
  let srchQuery = '';
  let srchProduct = 'Top';  // 'Top' 热门 / 'Latest' 最新

  function setSrchProduct(p) {
    if (srchProduct === p) return;
    srchProduct = p;
    const topBtn = $('srch-prod-top');
    const latestBtn = $('srch-prod-latest');
    if (topBtn) topBtn.className = 'sm' + (p === 'Top' ? ' primary' : '');
    if (latestBtn) latestBtn.className = 'sm' + (p === 'Latest' ? ' primary' : '');
    if (srchQuery) loadSearch(true);  // 已有搜索时切模式重新搜
  }

  async function loadSearch(reset = true) {
    const q = (srchInput ? srchInput.value : '').trim();
    if (!q) { srchList.innerHTML = '<div class="bm-empty">输入关键词后回车或点「搜索」。</div>'; return; }
    if (srchLoading) return;
    srchLoading = true;
    if (!reset && q !== srchQuery) reset = true; // 关键词变了，视为全新搜索
    if (reset) { srchCursor = null; srchSeenIds.clear(); srchQuery = q; }
    if (reset) {
      srchLoadmore.style.display = 'none';
      srchList.innerHTML = '<div class="bm-empty">正在搜索…</div>';
    } else if (srchMoreBtn) {
      srchMoreBtn.disabled = true;
      srchMoreBtn.innerHTML = '<span class="spinner"></span>加载中…';
    }
    try {
      if (reset) {
        let url = `${API}/search?q=${encodeURIComponent(q)}&count=50&product=${encodeURIComponent(srchProduct)}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (reset && !srchList.querySelector('.bm-card'))
            srchList.innerHTML = `<div class="bm-empty err">搜索失败: ${esc2(d.message || '未知错误')}</div>`;
          return;
        }
        const items = d.items || [];
        srchList.innerHTML = '';
        srchSeenIds.clear();
        srchCursor = null;
        if (!items.length) srchList.innerHTML = '<div class="bm-empty">没有搜到相关推文。</div>';
        let i = 0;
        sortItemsByTime(items).forEach((it) => {
          const id = it.tweet_id || it.id;
          if (!id || srchSeenIds.has(String(id))) return;
          srchSeenIds.add(String(id));
          const card = renderBrowseCard(it);
          card.classList.add('card-enter');
          card.style.animationDelay = Math.min(i * 18, 600) + 'ms';
          srchList.appendChild(card);
          i++;
        });
        srchCursor = d.next_cursor || null;
        srchLoadmore.style.display = srchCursor ? '' : 'none';
      } else {
        await loadSearchOlderBatch();
      }
    } catch (e) {
      if (reset && !srchList.querySelector('.bm-card'))
        srchList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    } finally {
      srchLoading = false;
      if (srchMoreBtn) { srchMoreBtn.disabled = false; srchMoreBtn.innerHTML = '加载更多'; }
    }
  }

  // 搜索上拉加载更旧结果（批量）：与 loadOlderBatch 同理，一次上拉翻多页攒够一批，
  // 避免 X 游标重叠导致每次只多出 2-3 条、频繁等待。
  async function loadSearchOlderBatch() {
    const BATCH_TARGET = 40;
    const MAX_PAGES = 6;
    let appendedTotal = 0, pages = 0, allItems = [];
    while (srchCursor && pages < MAX_PAGES) {
      pages++;
      const url = `${API}/search?q=${encodeURIComponent(srchQuery)}&count=50&product=${encodeURIComponent(srchProduct)}&cursor=${encodeURIComponent(srchCursor)}`;
      const r = await req(url);
      const d = await r.json();
      if (!d.success) break;
      const items = d.items || [];
      if (!items.length) { srchCursor = null; break; }
      allItems = allItems.concat(items);
      let appended = 0;
      sortItemsByTime(items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || srchSeenIds.has(String(id))) return;
        srchSeenIds.add(String(id));
        const card = renderBrowseCard(it);
        card.classList.add('card-enter');
        card.style.animationDelay = Math.min(appendedTotal * 18, 600) + 'ms';
        srchList.appendChild(card);
        appended++; appendedTotal++;
      });
      srchCursor = d.next_cursor || null;
      if (appended === 0) {
        if (!srchCursor) break;
        continue;
      }
      if (appendedTotal >= BATCH_TARGET) break;
    }
    srchLoadmore.style.display = srchCursor ? '' : 'none';
  }

  function doSearch() {
    const q = (srchInput ? srchInput.value : '').trim();
    if (!q) return;
    loadSearch(true);
  }
  $('srch-btn').addEventListener('click', doSearch);
  srchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  srchMoreBtn.addEventListener('click', () => loadSearch(false));
  $('srch-prod-top').addEventListener('click', () => setSrchProduct('Top'));
  $('srch-prod-latest').addEventListener('click', () => setSrchProduct('Latest'));

  // 自动加载（无限滚动）
  const srchScroll = viewSearch;
  if (srchScroll) {
    let srchScrollTimer = null;
    srchScroll.addEventListener('scroll', () => {
      if (srchScrollTimer) return;
      srchScrollTimer = setTimeout(() => {
        srchScrollTimer = null;
        if (srchLoading || !srchCursor) return;
        const nearBottom = srchScroll.scrollTop + srchScroll.clientHeight >= srchScroll.scrollHeight - 400;
        if (nearBottom) loadSearch(false);
      }, 250);
    });
  }

  // 首页快速打开：粘贴链接 → 回车/点按钮 → 打开该推文详情页浏览，
  // 用户看完再在详情页决定是否下载（不直接下载）。
  function quickOpen() {
    const url = $('qdl-url').value.trim();
    if (!url) return;
    const m = url.match(/\/status\/(\d+)/);
    if (!m) { alert('无法识别推文链接'); return; }
    const btn = $('qdl-btn');
    btn.disabled = true; btn.textContent = '加载中…';
    openTweetDetail(m[1], null).finally(() => {
      btn.disabled = false; btn.textContent = '🔍 打开';
    });
  }
  $('qdl-btn').addEventListener('click', quickOpen);
  $('qdl-url').addEventListener('keydown', (e) => { if (e.key === 'Enter') quickOpen(); });

  $('br-more').addEventListener('click', () => loadBrowse(false));

  // 自动加载（无限滚动）：滚动到 #view-browse 底部附近时自动拉下一页，不再依赖手动点「加载更多」
  const brScroll = $('view-browse');
  if (brScroll) {
    let brScrollTimer = null;
    brScroll.addEventListener('scroll', () => {
      saveBrowsePos();
      if (brScrollTimer) return;
      brScrollTimer = setTimeout(() => {
        brScrollTimer = null;
        if (brLoading || !brCursor) return;
        const nearBottom = brScroll.scrollTop + brScroll.clientHeight >= brScroll.scrollHeight - 400;
        if (nearBottom) loadBrowse(false);
      }, 250);
    });
  }

  // 通用下拉刷新：在滚动容器顶部下拉（触摸）触发 onRefresh。
  // 下拉时资源整体向下平移，指示器在露出的空隙里同步出现（与资源一起往下走）；
  // 松手超过阈值即刷新，刷新中显示「刷新中…」。仅当 scrollTop<=0 且向下拉时生效。
  function attachPullToRefresh(scrollEl, onRefresh, opts) {
    opts = opts || {};
    const threshold = opts.threshold || 56;
    const maxPull = opts.maxPull || 84;
    const ind = document.createElement('div');
    ind.className = 'ptr-indicator';
    ind.innerHTML = '<span class="ptr-icon">↓</span><span class="ptr-text">下拉刷新</span>';
    ind.style.top = getComputedStyle(scrollEl).paddingTop || '0';
    scrollEl.appendChild(ind);
    const txtEl = ind.querySelector('.ptr-text');
    const iconEl = ind.querySelector('.ptr-icon');
    let active = false, pulling = false, refreshing = false, startY = 0, dist = 0, kids = [];

    function contentTransform(y) { for (const c of kids) c.style.transform = `translateY(${y}px)`; }
    function setInd(d) {
      const e = Math.max(0, Math.min(d, maxPull));
      ind.style.transform = `translateY(${-ind.offsetHeight + Math.min(e, ind.offsetHeight)}px)`;
      ind.style.opacity = Math.min(1, e / threshold);
      if (refreshing) { txtEl.textContent = '刷新中…'; return; }
      if (e >= threshold) { txtEl.textContent = '释放刷新'; iconEl.textContent = '↑'; }
      else { txtEl.textContent = '下拉刷新'; iconEl.textContent = '↓'; }
    }
    function resetAll() {
      ind.style.transition = 'transform .3s, opacity .3s';
      contentTransform(0);
      ind.style.transform = `translateY(${-ind.offsetHeight}px)`;
      ind.style.opacity = 0;
      setTimeout(() => { ind.style.transition = ''; }, 300);
    }
    function startRefresh() {
      refreshing = true;
      ind.style.transition = 'transform .2s, opacity .2s';
      contentTransform(threshold);
      ind.style.transform = 'translateY(0)';
      ind.style.opacity = 1;
      txtEl.textContent = '刷新中…';
      iconEl.innerHTML = '<span class="spinner" style="width:15px;height:15px;border-width:2px;display:inline-block;vertical-align:middle"></span>';
      Promise.resolve().then(() => onRefresh()).then(finishRefresh).catch(finishRefresh);
    }
    function finishRefresh() { refreshing = false; resetAll(); }

    scrollEl.addEventListener('touchstart', (e) => {
      if (refreshing || scrollEl.scrollTop > 0) { active = false; return; }
      active = true; pulling = false; dist = 0; startY = e.touches[0].clientY;
      kids = Array.from(scrollEl.children).filter(c => !c.classList || !c.classList.contains('ptr-indicator'));
    }, { passive: true });
    scrollEl.addEventListener('touchmove', (e) => {
      if (!active || refreshing) return;
      const delta = e.touches[0].clientY - startY;
      if (!pulling) {
        if (delta > 0 && scrollEl.scrollTop <= 0) pulling = true;
        else if (delta <= 0) { active = false; return; }
        else return;
      }
      if (delta > 0 && scrollEl.scrollTop <= 0) {
        if (e.cancelable) e.preventDefault();
        dist = Math.min(delta * 0.5, maxPull);
        contentTransform(dist);
        setInd(dist);
      }
    }, { passive: false });
    scrollEl.addEventListener('touchend', () => {
      if (!active || refreshing) { active = false; return; }
      active = false;
      if (pulling && dist >= threshold) startRefresh();
      else resetAll();
      pulling = false; dist = 0;
    });
  }

  // 首页（关注流）下拉刷新：拉取最新并「顶部插入、保持当前查看位置」，新内容在上方，不跳顶
  if (brScroll) attachPullToRefresh(brScroll, async () => { await refreshBrowseKeepPos(); });
  // 搜索视图同样支持下拉刷新
  if (srchScroll) attachPullToRefresh(srchScroll, async () => { await doSearch(); });

  // 上拉加载已移除：更旧的推文改为「滚动触底（或距底 400px）自动加载/预加载」，
  // 由上方 #view-browse / #view-search 的无限滚动监听器负责，无需独立手势，也避免无动画的突兀感。


  // P2-11 定时刷新关注流：每 3 分钟静默拉一次最新推文，插入到顶部并保持当前查看位置，
  // 不弹任何提示横幅，直接复用 prependNewTweets（新推文已置顶，用户上滑即见）。
  async function pollNewTweets() {
    if (brLoading) return;
    try {
      const r = await req(`${API}/timeline?count=20`);
      const d = await r.json();
      if (!d.success) return;
      prependNewTweets(d.items || []);
    } catch (_) {}
  }
  setInterval(pollNewTweets, 180000);  // 每 3 分钟
  // 切到浏览 tab 时立即查一次
  tabsEl.addEventListener('click', (e) => {
    if (e.target?.dataset?.view === 'browse') setTimeout(pollNewTweets, 500);
  });

  /* ---- 推文详情页（DBox 内预览推文 + 评论区） ---- */
  const dtEl = $('detail');
  const dtBody = $('dt-body');
  const dtReplies = $('dt-replies');
  const dtScroll = $('dt-scroll');
  const dtMoreBtn = $('dt-more');
  const dtLoadmore = $('dt-loadmore');
  let dtCurTweet = null;   // 当前详情推文
  let dtCursor = null;     // 评论区分页 cursor
  let dtLoading = false;
  let dtFavBtn = null;

  // 渲染推文详情的完整卡片
  function renderTweetDetailCard(t) {
    const a = t.author || {};
    const mediaHtml = (t.media || []).map((m) => {
      if (m.type === 'video') {
        const src = (m.url && !m.url.includes('.m3u8')) ? mediaUrl(m.url, 'video') : '';
        return src ? `<video src="${esc2(src)}" controls preload="metadata" muted="false"></video>` : '';
      }
      return m.url ? `<img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" />` : '';
    }).join('');
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const isFav = favSet.has(t.tweet_id);
    const card = document.createElement('div');
    card.className = 'dt-card';
    card.innerHTML = `
      ${t.retweeted_by ? `<div class="rt-note">↻ 由 @${esc2(t.retweeted_by.screen_name || t.retweeted_by.name || '某人')} 转发</div>` : ''}
      <div class="dt-head">
        ${a.avatar ? `<img class="dt-avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          <div class="dt-name" data-link="${esc2(profileUrl)}">${esc2(a.name || a.screen_name || '未知用户')}</div>
          <div class="dt-handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="dt-time">${esc2(fmtTime(t.created_at))}</div>
      </div>
      <div class="dt-text">${esc2(t.text || '')}</div>
      ${mediaHtml ? `<div class="dt-media">${mediaHtml}</div>` : ''}
      <div class="dt-counts">
        ${t.reply_count != null ? `<span>💬 <b>${t.reply_count}</b></span>` : ''}
        ${t.retweet_count != null ? `<span>🔁 <b>${t.retweet_count}</b></span>` : ''}
        ${t.favorite_count != null ? `<span>❤️ <b>${t.favorite_count}</b></span>` : ''}
        ${t.quote_count != null ? `<span>💭 <b>${t.quote_count}</b></span>` : ''}
        ${t.view_count != null ? `<span>👁 <b>${t.view_count}</b></span>` : ''}
      </div>
      <div class="dt-actions">
        <button class="fav ${isFav ? 'on' : ''}" data-tid="${esc2(t.tweet_id)}">${isFav ? '★ 已收藏' : '☆ 收藏'}</button>
        <button class="dl" data-url="${esc2(t.url || '')}">⬇ 下载</button>
        <button class="openx" data-url="${esc2(t.url || '')}">打开原文 ↗</button>
      </div>`;
    // 作者名跳 profile
    card.querySelectorAll('[data-link]').forEach((el) => {
      el.addEventListener('click', () => { const u = el.dataset.link; if (u) window.open(u, '_blank', 'noopener'); });
    });
    // 收藏/移出
    card.querySelectorAll('.fav').forEach((b) => b.addEventListener('click', () => {
      const tid = b.dataset.tid;
      if (favSet.has(tid)) {
        b.disabled = true;
        req(`${API}/bookmarks/folder/${encodeURIComponent(tid)}`, { method: 'DELETE' })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.delete(tid); saveFavSet(); b.classList.remove('on'); b.textContent = '☆ 收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      } else {
        b.disabled = true; b.textContent = '收藏中…';
        req(`${API}/bookmarks/folder`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.add(tid); saveFavSet(); b.classList.add('on'); b.textContent = '★ 已收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      }
    }));
    // 下载
    card.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url;
      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(u || t.url)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; b.disabled = !ok; })
        .catch(() => { b.textContent = '下载失败'; b.disabled = false; });
    }));
    // 打开原文（明确点击才跳 X）
    card.querySelectorAll('.openx').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url; if (u) window.open(u, '_blank', 'noopener');
    }));
    return card;
  }

  // 渲染一条回复
  function renderReplyCard(rp) {
    const a = rp.author || {};
    const thumb = (rp.media || []).slice(0, 1).map((m) =>
      m.url ? `<div class="dt-reply-media"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" /></div>` : '').join('');
    const div = document.createElement('div');
    div.className = 'dt-reply';
    div.innerHTML = `
      ${a.avatar ? `<img src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
      <div class="rv">
        <div class="head">
          <span class="rname">${esc2(a.name || a.screen_name || '未知')}</span>
          <span class="rhandle">@${esc2(a.screen_name || 'unknown')}</span>
          <span class="dt-time">${esc2(fmtTime(rp.created_at))}</span>
        </div>
        <div class="rtext">${esc2(rp.text || '')}</div>
        ${thumb}
      </div>`;
    return div;
  }

  async function openTweetDetail(tweetId, seed) {
    // 打开详情层（压入历史以拦截浏览器后退）
    if (!dtEl.classList.contains('active')) enterDrill('detail');
    dtEl.classList.add('active');
    dtBody.innerHTML = '<div class="bm-empty">加载中…</div>';
    dtReplies.innerHTML = '';
    dtLoadmore.style.display = 'none';
    dtCursor = null;
    if (seed) {
      // 先用列表数据即时渲染，再拉取完整详情+评论区
      dtBody.innerHTML = '';
      dtBody.appendChild(renderTweetDetailCard(seed));
      dtReplies.innerHTML = '<div class="bm-empty">正在加载评论区…</div>';
    }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(tweetId)}`);
      const d = await r.json();
      if (!d.success) {
        dtBody.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '')}</div>`;
        return;
      }
      if (d.tweet) {
        dtCurTweet = d.tweet;
        dtBody.innerHTML = '';
        dtBody.appendChild(renderTweetDetailCard(d.tweet));
        recordHistory(d.tweet);  // P1-7：记录浏览历史（fire-and-forget）
      }
      const replies = d.replies || [];
      dtReplies.innerHTML = replies.length ? '<div class="dt-reply-title">回复</div>' : '<div class="bm-empty">还没有回复。</div>';
      replies.forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
      dtCursor = d.next_cursor || null;
      dtLoadmore.style.display = dtCursor ? '' : 'none';
    } catch (e) {
      if (!seed) dtBody.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  // 评论区加载更多
  async function loadMoreReplies() {
    if (!dtCurTweet || dtLoading || !dtCursor) return;
    dtLoading = true;
    if (dtMoreBtn) { dtMoreBtn.disabled = true; dtMoreBtn.innerHTML = '<span class="spinner"></span>加载中…'; }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(dtCurTweet.tweet_id)}?cursor=${encodeURIComponent(dtCursor)}`);
      const d = await r.json();
      (d.replies || []).forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
      dtCursor = d.next_cursor || null;
      dtLoadmore.style.display = dtCursor ? '' : 'none';
    } catch (_) {} finally {
      dtLoading = false;
      if (dtMoreBtn) { dtMoreBtn.disabled = false; dtMoreBtn.innerHTML = '加载更多回复'; }
    }
  }

  $('dt-back').addEventListener('click', () => { closeDrillViaApp('detail'); });
  $('dt-more').addEventListener('click', loadMoreReplies);

  /* ---- 本地浏览历史（P1-7） ---- */
  const hsList = $('hs-list');

  async function recordHistory(tweet) {
    if (!tweet || !tweet.tweet_id) return;
    try {
      await req(`${API}/history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tweet),
      });
    } catch (_) {}
  }

  async function loadHistory() {
    hsList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const r = await req(`${API}/history?limit=100`);
      const d = await r.json();
      if (!d.success) { hsList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      const items = d.items || [];
      if (!items.length) { hsList.innerHTML = '<div class="bm-empty">浏览过的推文会记录在这里，可回看。</div>'; return; }
      hsList.innerHTML = '';
      // 复用浏览卡渲染（含点开详情/收藏/下载），历史可回看
      items.forEach((it) => hsList.appendChild(renderBrowseCard(it)));
    } catch (e) {
      hsList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('hs-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部浏览历史？')) return;
    await req(`${API}/history?clear=1`, { method: 'DELETE' });
    loadHistory();
  });

  /* ---- 媒体缓存管理（P2-9） ---- */
  const mcList = $('mc-list');
  const mcStats = $('mc-stats');

  function fmtSize(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  async function loadCache() {
    mcList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const r = await req(`${API}/media/cache`);
      const d = await r.json();
      if (!d.success) { mcList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      const items = d.items || [];
      const total = d.total_bytes || 0;
      mcStats.innerHTML = `共 <b>${items.length}</b> 个文件，占用 <b>${fmtSize(total)}</b>（上限 512MB）`;
      if (!items.length) { mcList.innerHTML = '<div class="bm-empty">点开的图片/视频会缓存到本地，可回看。</div>'; return; }
      mcList.innerHTML = '';
      items.slice(0, 100).forEach((it) => {
        const el = document.createElement('div');
        el.className = 'mc-item';
        el.innerHTML = `<span class="type">${it.type === 'video' ? '🎬' : '🖼'}</span>
          <span class="name">${esc2(it.file)}</span>
          <span class="size">${fmtSize(it.size)}</span>`;
        mcList.appendChild(el);
      });
    } catch (e) {
      mcList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('mc-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部媒体缓存？已缓存图片/视频将需要重新从 X 加载。')) return;
    await req(`${API}/media/cache`, { method: 'DELETE' });
    loadCache();
  });

  /* ---- 初始化：默认 tab 是浏览，打开即自动加载关注流（无需点刷新） ---- */
  (function initAutoBrowse() {
    const waitToken = () => {
      if (!TOKEN) { setTimeout(waitToken, 200); return; }
      // 若默认 tab 为浏览且尚未加载，自动拉取关注流
      const activeTab = tabsEl.querySelector('.tab.active');
      if (activeTab && activeTab.dataset.view === 'browse' &&
          brList && !brList.querySelector('.bm-card')) {
        loadBrowse(true);
      }
    };
    waitToken();
  })();
</script>
</body>
</html>
