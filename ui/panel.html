      brCursor = null;
      // 注意：这里绝不能再 scrollTop=0。强制回顶部会触发 scroll 事件把 brUserScrolled
      // 置真、并 scheduleSavePos 把"顶部"当主控锚点写回服务端，既跳走用户当前阅读位置、
      // 又污染服务端真实进度。位置交由下方 reanchor / restoreBrowseScroll 按服务端锚点恢复。
      if (openMode) showBgLoading(true);
      else if (!preview) brList.innerHTML = '<div class="bm-empty">正在加载关注流…</div>';
    } else {
      setBrBottom('loading');   // 自动加载也常驻显示转圈动画
    }
    try {
      if (reset) {
        const url = `${API}/timeline?count=50${brCursor ? `&cursor=${encodeURIComponent(brCursor)}` : ''}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (reset && !brList.querySelector('.bm-card'))
            brList.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '未知错误')}</div>`;
          else if (reset) showBrowseStatus('加载失败: ' + (d.message || '未知错误'), 'err');
          return;
        }
        // 过总库：与搜索/收藏/历史里的同一条推文合成一条记录
        const items = mergeTweets(d.items || []);
        // 定位前先等对账落地：锚点必须取服务端真相。否则本机旧锚点会被当成"当前位置"，
        // 而本设备刚抢占为主控，随后一滚动就把陈旧位置推回服务端、覆盖真正进度。
        if (syncP) { try { await syncP; } catch (_) {} }
        const anchorTid = getBrowseAnchor();
        if (openMode || preview) {
          // 列表里已有内容（打开即秒开的缓存，或已有列表）：顶部并入最新推文，
          // 但恢复上次查看位置（框架 feed 锚点，按 id 定位），不跳到顶部——
          // 新推文在上方，用户停在原来的位置，上滑即见更新。
          prependNewTweets(items, { toTop: false, anchorTid });
          saveBrowseCache(items, true);
        } else {
          // 首次加载且无本地缓存：能恢复服务端锚点则定位回去，绝不无条件回顶部
          // （回顶部会触发 scroll 事件把"顶部"当主控锚点写回服务端，污染真实位置）
          saveBrowseCache(items, true);
          if (anchorTid) {
            prependNewTweets(items, { toTop: false, anchorTid });
          } else if (!brUserScrolled) {
            // 无锚点才回顶部；用户已经自己滚过就绝不动他的位置
            holdBrRestoring(200);
            viewBrowse.scrollTop = 0;
          }
        }
        restoreBrowseScroll();   // 锚点已跨设备同步；卡片延后渲染时由重试兜底定位
        brCursor = d.next_cursor || null;
      } else {
        // 上拉加载更旧：X 关注流游标会返回大量重叠内容，单次只多出 2-3 条。
        // 一次上拉连续翻多页，攒够一批真正新的推文再结束，做到「等一次、看很多」。
        await loadOlderBatch();
      }
    } catch (e) {
      if (reset && !brList.querySelector('.bm-card'))
        brList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
      else if (isOlder) olderErr = true;   // 加载失败：底部显示「点击重试」
    } finally {
      if (openMode) showBgLoading(false);
      brLoading = false;
      // 底部状态：失败重试 / 到底 / 仍有更多则隐藏（由滚动或下方自动续拉接管）
      if (olderErr) setBrBottom('error');
      else if (brList.querySelector('.bm-empty.err')) setBrBottom('hidden');
      else if (!brCursor) setBrBottom('end');
      else setBrBottom('hidden');
      // 加载完成后若仍在底部（或内容不足一屏），继续拉下一页，
      // 与滚动监听形成双保险，避免「加载中触发的那次被防抖吃掉」导致停住不加载。
      setTimeout(brAutoFill, 200);
    }
  }

  // 上拉加载更旧（批量）：X 关注流 GraphQL 的 Bottom 游标往往返回大量与已加载内容
  // 重叠的推文，单次请求去重后只剩 2-3 条新的，导致「看两条、又要等几秒」。
  // 这里一次上拉连续翻多页（每页 50 条，最多 MAX_PAGES 页），直到攒够 BATCH_TARGET
  // 条真正新的推文，或者没有更多页为止——让用户等一次、看一大段，等待远小于浏览时间。
  async function loadOlderBatch() {
    const BATCH_TARGET = 40;   // 一次预加载至少攒够这么多条新推文
    const MAX_PAGES = 6;       // 最多翻几页，避免单次等待过久
    let appendedTotal = 0, pages = 0, allItems = [];
    while (brCursor && pages < MAX_PAGES) {
      pages++;
      const url = `${API}/timeline?count=50${brCursor ? `&cursor=${encodeURIComponent(brCursor)}` : ''}`;
      const r = await req(url);
      const d = await r.json();
      if (!d.success) break;
      const items = mergeTweets(d.items || []);
      if (!items.length) { brCursor = null; break; }
      allItems = allItems.concat(items);
      tweetCachePut(items);
      let appended = 0;
      sortItemsByTime(items).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        const card = renderBrowseCard(tweetCacheGet(id) || it);
        card.classList.add('card-enter');
        card.style.animationDelay = Math.min(appendedTotal * 18, 600) + 'ms';
        brList.appendChild(card);
        appended++; appendedTotal++;
      });
      brCursor = d.next_cursor || null;
      if (appended === 0) {
        // 整页都是已见过的（X 游标重叠），继续翻下一页；若已无下一页则停止
        if (!brCursor) break;
        continue;
      }
      if (appendedTotal >= BATCH_TARGET) break;
    }
    if (appendedTotal && allItems.length) saveBrowseCache(allItems, true);
  }

  // 无脑上滑：若关注流尚未填满可视区（scrollHeight<=clientHeight 无法滚动触发
  // 自动续拉：加载完成后兜底检查——内容不足一屏，或仍贴着底部附近，
  // 就继续加载下一页。与滚动监听形成双保险，避免「加载中触发的那次被防抖吃掉」而停住。
  function brAutoFill() {
    if (brLoading || !brCursor) return;
    const cont = viewBrowse;
    if (!cont) return;
    const nearBottom = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 400;
    if (nearBottom || cont.scrollHeight <= cont.clientHeight + 8) {
      loadBrowse(false);
    }
  }

  /* ---- 搜索 ---- */
  const srchList = $('srch-list');
  const srchLoadmore = $('srch-loadmore');
  const srchMoreBtn = $('srch-more');
  const srchInput = $('srch-input');
  let srchLoading = false;
  let srchOlderErr = false;
  let srchCursor = null;
  let srchSeenIds = new Set();
  let srchQuery = '';
  let srchProduct = 'Top';  // 'Top' 热门 / 'Latest' 最新
  // 热门 + 最新 两套结果各存一份：一次搜索同时爬取并缓存，切模式不重新抓取
  let srchTopItems = [];
  let srchLatestItems = [];
  let srchCursorTop = null;
  let srchCursorLatest = null;
  let srchAllItems = [];   // 当前展示的那一份（= 上面某一产品的引用副本）

  function setSrchProduct(p, opts) {
    opts = opts || {};
    if (srchProduct === p) return;
    srchProduct = p;
    const topBtn = $('srch-prod-top');
    const latestBtn = $('srch-prod-latest');
    if (topBtn) topBtn.className = 'sm' + (p === 'Top' ? ' primary' : '');
    if (latestBtn) latestBtn.className = 'sm' + (p === 'Latest' ? ' primary' : '');
    // 排序（热门/最新）属于搜索参数的一部分，同步进 URL；用 replace，
    // 避免连续切来切去把历史栈刷满。silent：仅改状态不重渲染（由调用方统一渲染）
    if (!opts.silent) {
      navigate({ name: 'search', params: searchRouteParams() }, { replace: true, silent: true });
    }
    // 已有搜索时切模式只展示已缓存的另一份（不同内容集→位置回顶部）。
    // 但【搜索进行中不要渲染】：此时 srchTopItems / srchLatestItems 仍是上一次
    // 搜索的旧数据（本次结果要等 Promise.all 返回才写入），此刻渲染会把
    // 「正在搜索…」直接顶成旧缓存，用户便以为「切换模式打断了搜索」。
    // 只切按钮状态与 URL 即可——Top/Latest 是并行爬取的两份，loadSearch 收尾时
    // 会按新的 product 渲染本次结果，切到哪边都有正确数据，无需重新搜索。
    if (srchQuery && !opts.silent && !srchLoading) {
      renderSrchProduct();
      resetSearchPos();
    }
  }

  async function fetchSearch(q, product, cursor) {
    let url = `${API}/search?q=${encodeURIComponent(q)}&count=50&product=${encodeURIComponent(product)}`;
    if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;
    const r = await req(url);
    const d = await r.json();
    if (!d.success) throw new Error(d.message || '搜索失败');
    return { items: d.items || [], next_cursor: d.next_cursor || null };
  }

  // 渲染当前 product 的那一份缓存（热门/最新），不触发网络
  function renderSrchProduct() {
    const arr = srchProduct === 'Top' ? srchTopItems : srchLatestItems;
    srchAllItems = arr.slice();
    srchSeenIds = new Set();   // 去重集合在渲染过程中逐个加入，不要预先塞满（否则全部被跳过）
    srchCursor = srchProduct === 'Top' ? srchCursorTop : srchCursorLatest;
    srchList.innerHTML = '';
    if (!arr.length) srchList.innerHTML = '<div class="bm-empty">该模式暂无缓存，点「搜索」重新获取。</div>';
    let i = 0;
    sortItemsByTime(arr).forEach((it) => {
      const id = it.tweet_id || it.id;
      if (!id || srchSeenIds.has(String(id))) return;
      srchSeenIds.add(String(id));
      // 内容回查全局单缓存 XTWEETS（一处内容，所有视图共享）
      const full = tweetCacheGet(id) || it;
      const card = renderBrowseCard(full);
      card.classList.add('card-enter');
      card.style.animationDelay = Math.min(i * 18, 600) + 'ms';
      srchList.appendChild(card);
      i++;
    });
    srchLoadmore.style.display = 'none';
  }

  // 底部状态条（搜索）：与首页 setBrBottom 同款，常驻可见避免「以为卡住」。
  function setSrchBottom(state) {
    if (state === 'hidden') { srchLoadmore.style.display = 'none'; return; }
    srchLoadmore.style.display = '';
    if (state === 'loading') {
      srchMoreBtn.disabled = true;
      srchMoreBtn.innerHTML = '<span class="spinner"></span>加载中…';
    } else if (state === 'end') {
      srchMoreBtn.disabled = true;
      srchMoreBtn.innerHTML = '没有更多了';
    } else if (state === 'error') {
      srchMoreBtn.disabled = false;
      srchMoreBtn.innerHTML = '加载失败，点击重试';
    }
  }

  async function loadSearch(reset = true) {
    const q = (srchInput ? srchInput.value : '').trim();
    if (!q) { srchList.innerHTML = '<div class="bm-empty">输入关键词后回车或点「搜索」。</div>'; return; }
    if (srchLoading) return;
    srchLoading = true;
    if (!reset && q !== srchQuery) reset = true; // 关键词变了，视为全新搜索
    if (reset) { srchCursor = null; srchSeenIds.clear(); srchQuery = q; }
    if (reset) {
      setSrchBottom('hidden');
      srchList.innerHTML = '<div class="bm-empty">正在搜索…</div>';
    } else {
      setSrchBottom('loading');
    }
    try {
      if (reset) {
        // 热门 + 最新 并行爬取，一次性缓存两份；之后切模式不再打扰 X
        const [topD, latestD] = await Promise.all([
          fetchSearch(q, 'Top', null).catch((e) => ({ items: [], next_cursor: null, err: e.message })),
          fetchSearch(q, 'Latest', null).catch((e) => ({ items: [], next_cursor: null, err: e.message }))
        ]);
        // 内容只登记进全局单缓存 XTWEETS；本视图只保留成员 id + 排序（不重复存内容）
        tweetCachePut((topD && topD.items) || []);
        tweetCachePut((latestD && latestD.items) || []);
        srchTopItems = toMembership((topD && topD.items) || []);
        srchLatestItems = toMembership((latestD && latestD.items) || []);
        srchCursorTop = (topD && topD.next_cursor) || null;
        srchCursorLatest = (latestD && latestD.next_cursor) || null;
        if (!srchTopItems.length && !srchLatestItems.length) {
          const msg = (topD && topD.err) || (latestD && latestD.err) || '未知错误';
          srchList.innerHTML = `<div class="bm-empty err">搜索失败: ${esc2(msg)}</div>`;
          return;
        }
        renderSrchProduct();
        cacheSearch();   // 落本地缓存并同步其它设备，刷新/换设备都看到这一份
        resetSearchPos(); // 新搜索=内容整体替换，浏览位置回到顶部（避免旧位置指向新内容）
      } else {
        await loadSearchOlderBatch();
      }
    } catch (e) {
      if (reset && !srchList.querySelector('.bm-card'))
        srchList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
      else if (!reset) srchOlderErr = true;   // 加载更旧失败：底部显示「点击重试」
    } finally {
      srchLoading = false;
      if (srchOlderErr) setSrchBottom('error');
      else if (srchList.querySelector('.bm-empty.err')) setSrchBottom('hidden');
      else if (!srchCursor) setSrchBottom('end');
      else setSrchBottom('hidden');
      setTimeout(srchAutoFill, 200);
    }
  }

  // 搜索上拉加载更旧结果（批量）：按当前 product 翻页，追加到对应那份缓存
  async function loadSearchOlderBatch() {
    const BATCH_TARGET = 40;
    const MAX_PAGES = 6;
    // 固定本次批量所用的模式：翻页途中用户可能切换热门/最新，若循环内继续读
    // srchProduct，会用新模式发请求、结果却 push 进旧模式的 targetArr，游标也会
    // 存错位置（串味）。固定住，让本次批次完整跑完。
    const product = srchProduct;
    const targetArr = product === 'Top' ? srchTopItems : srchLatestItems;
    let appendedTotal = 0, pages = 0;
    while (srchCursor && pages < MAX_PAGES) {
      pages++;
      try {
        const d = await fetchSearch(srchQuery, product, srchCursor);
        const items = mergeTweets(d.items || []);
        if (!items.length) { srchCursor = null; break; }
        tweetCachePut(items);
        let appended = 0;
        sortItemsByTime(items).forEach((it) => {
          const id = it.tweet_id || it.id;
          if (!id || srchSeenIds.has(String(id))) return;
          srchSeenIds.add(String(id));
          targetArr.push({ tweet_id: id, created_at: it.created_at });
          const card = renderBrowseCard(tweetCacheGet(id) || it);
          card.classList.add('card-enter');
          card.style.animationDelay = Math.min(appendedTotal * 18, 600) + 'ms';
          srchList.appendChild(card);
          appended++; appendedTotal++;
        });
        srchCursor = d.next_cursor || null;
        if (product === 'Top') srchCursorTop = srchCursor; else srchCursorLatest = srchCursor;
        cacheSearch();
        if (appended === 0) { if (!srchCursor) break; continue; }
        if (appendedTotal >= BATCH_TARGET) break;
      } catch (e) { break; }
    }
  }

  // 搜索自动续拉：与 brAutoFill 同逻辑，加载完若仍贴底或内容不足一屏则继续。
  function srchAutoFill() {
    if (srchLoading || !srchCursor) return;
    const cont = viewSearch;
    if (!cont) return;
    const nearBottom = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 400;
    if (nearBottom || cont.scrollHeight <= cont.clientHeight + 8) {
      loadSearch(false);
    }
  }

  // 搜索结果本地缓存 + 多设备同步：热门/最新两份一起存；store 用框架 XSTATE（lww）。
  // 任一设备搜索后所有设备共用这份缓存，直到有人发起下一次搜索。
  function cacheSearch() {
    if (!XSTATE || !srchQuery) return;
    try {
      XSTATE.set('search:last', {
        q: srchQuery,
        top: srchTopItems.slice(0, 200),
        latest: srchLatestItems.slice(0, 200),
        cursorTop: srchCursorTop,
        cursorLatest: srchCursorLatest,
        ts: Date.now()
      }, { strategy: 'lww' });
    } catch (_) {}
  }

  // 搜索位置记忆：与首页一致，交给框架 feed()（feed:search:anchor，跨设备同步）。
  let srchUserScrolled = false;
  let srchPosSaveTimer = null;
  function saveSearchPos() {
    if (!XSEARCHFEED || activeView !== 'search') return;
    const cont = viewSearch;
    if (!cont || getComputedStyle(cont).display === 'none') return;
    XSEARCHFEED.saveAnchor();
  }
  function scheduleSaveSearchPos() {
    if (srchPosSaveTimer) return;
    srchPosSaveTimer = setTimeout(() => { srchPosSaveTimer = null; saveSearchPos(); }, 200);
  }
  // 内容缓存更新（新搜索/刷新/切模式）→ 浏览位置回到顶部并清空锚点，避免旧位置指向新内容
  function resetSearchPos() {
    const cont = viewSearch;
    if (cont) cont.scrollTop = 0;
    if (XSEARCHFEED) XSEARCHFEED.clearAnchor();
    srchUserScrolled = false;
  }
  // 恢复到上次搜索位置：交给框架 feed()（按 id 定位 + 卡内偏移，带补偿重定位）；
  // 用户一旦自己滚动立即让位，绝不把正在看的用户拽回去。
  let _srchRestoreIv = null;
  function restoreSearchScroll() {
    if (!XSEARCHFEED || srchUserScrolled) return;
    if (XSEARCHFEED.restore()) return;
    if (_srchRestoreIv) clearInterval(_srchRestoreIv);
    let tries = 0;
    _srchRestoreIv = setInterval(() => {
      if (srchUserScrolled) { clearInterval(_srchRestoreIv); _srchRestoreIv = null; return; }
      if ((XSEARCHFEED && XSEARCHFEED.restore()) || ++tries > 16) { clearInterval(_srchRestoreIv); _srchRestoreIv = null; }
    }, 320);
  }

  // 打开搜索视图：先与服务端对账，拿到「任一设备最近一次搜索」这份共享缓存再渲染；
  // 这是多设备同步的关键一步——必须 pull，否则只会读本地旧缓存（换设备看到的是别人早先的数据）。
  // opts.q / opts.tab 来自 URL：URL 指定的关键词若与共享缓存不同，**只对齐输入框、
  // 绝不自动发请求**（搜索缓存只在用户点「搜索」时才刷新）。
  async function restoreSearch(opts) {
    opts = opts || {};
    if (!XSTATE) return;
    try { await XSTATE.pull(); } catch (_) {}
    let snap;
    try { snap = XSTATE.get('search:last'); } catch (_) { return; }
    const wantQ = (opts.q || '').trim();
    const wantTab = String(opts.tab || '').toLowerCase() === 'latest' ? 'Latest'
      : (opts.tab ? 'Top' : null);
    if (!snap || !snap.q) {
      if (wantQ && srchInput) srchInput.value = wantQ;
      if (wantTab && wantTab !== srchProduct) setSrchProduct(wantTab, { silent: true });
      srchList.innerHTML = '<div class="bm-empty">输入关键词搜索 X 推文。</div>';
      return;
    }
    if (wantQ && wantQ !== snap.q) {
      // URL 与缓存内容不符：不拿旧关键词的结果冒充，避免「地址栏与页面内容不一致」
      if (srchInput) srchInput.value = wantQ;
      srchQuery = '';
      srchTopItems = []; srchLatestItems = [];
      srchCursorTop = null; srchCursorLatest = null;
      srchList.innerHTML = `<div class="bm-empty">点「搜索」获取「${esc2(wantQ)}」的结果。</div>`;
      return;
    }
    srchInput.value = snap.q;
    srchQuery = snap.q;
    srchTopItems = (snap.top || []).slice();
    srchLatestItems = (snap.latest || []).slice();
    tweetCachePut(srchTopItems.concat(srchLatestItems));   // 兼容旧版全量缓存；新缓存只有 id，无害
    srchCursorTop = snap.cursorTop || null;
    srchCursorLatest = snap.cursorLatest || null;
    if (wantTab && wantTab !== srchProduct) setSrchProduct(wantTab, { silent: true });
    renderSrchProduct();
    srchUserScrolled = false;   // 打开即尝试恢复上次搜索位置（与首页续读一致）
    restoreSearchScroll();
  }

  function doSearch() {
    const q = (srchInput ? srchInput.value : '').trim();
    if (!q) return;
    // 只有点「搜索」按钮/回车才真正请求 X 刷新缓存；URL 进来不会走到这里。
    Promise.resolve(loadSearch(true)).then(() => {
      navigate({ name: 'search', params: { q: srchQuery || q, tab: srchProduct } }, { silent: true });
    });
  }
  $('srch-btn').addEventListener('click', doSearch);
  srchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  srchMoreBtn.addEventListener('click', () => loadSearch(false));
  $('srch-prod-top').addEventListener('click', () => setSrchProduct('Top'));
  $('srch-prod-latest').addEventListener('click', () => setSrchProduct('Latest'));

  // 自动加载（无限滚动）
  const srchScroll = viewSearch;
  if (srchScroll) {
    let srchScrollTimer = null;
    srchScroll.addEventListener('scroll', () => {
      srchUserScrolled = true;
      scheduleSaveSearchPos();
      if (srchScrollTimer) return;
      srchScrollTimer = setTimeout(() => {
        srchScrollTimer = null;
        if (srchLoading || !srchCursor) return;
        const nearBottom = srchScroll.scrollTop + srchScroll.clientHeight >= srchScroll.scrollHeight - 400;
        if (nearBottom) loadSearch(false);
      }, 250);
    });
  }

  // 首页快速打开功能已合并进「链接」页（粘贴链接 → 预览 → 下载），
  // 首页不再单独保留 URL 直接打开框，故相关 DOM 与监听器已移除。

  $('br-more').addEventListener('click', () => loadBrowse(false));

  // 自动加载（无限滚动）：滚动到 #view-browse 底部附近时自动拉下一页，不再依赖手动点「加载更多」
  const brScroll = $('view-browse');
  if (brScroll) {
    let brScrollTimer = null;
    brScroll.addEventListener('scroll', () => {
      if (brRestoring) return;          // 重定位（恢复锚点）引发的程序化滚动：不当作用户操作、不保存
      markUserScrolled();
      scheduleSavePos();
      if (brScrollTimer) return;
      brScrollTimer = setTimeout(() => {
        brScrollTimer = null;
        if (brLoading || !brCursor) return;
        const nearBottom = brScroll.scrollTop + brScroll.clientHeight >= brScroll.scrollHeight - 400;
        if (nearBottom) loadBrowse(false);
      }, 250);
    });
    // 真实用户输入通道：滚轮 / 触摸 / 键盘翻页。
    // 只靠 scroll 事件不够——程序化重定位期间 brRestoring 为真（reanchor 可把它拉长
    // 到 1.3s 以上，且被 ResizeObserver 与图片 load 不断续期），scroll 会被整段吞掉，
    // 用户怎么滚都不算数。于是「刷新后立刻滑动」时 brUserScrolled 始终为假，
    // pull 回调 / onStale / acquireMaster / loadBrowse 等 5 处恢复调用点便会
    // 反复把人拽回锚点。真实输入不受抑制窗口影响，直接让位。
    const SCROLL_KEYS = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End',
                         ' ', 'Spacebar'];
    const onUserInput = () => markUserScrolled();
    ['wheel', 'touchstart', 'touchmove'].forEach((t) => {
      brScroll.addEventListener(t, onUserInput, { passive: true });
    });
    // 键盘翻页绑 document：滚动容器本身未必持有焦点
    document.addEventListener('keydown', (e) => {
      if (activeView !== 'browse') return;
      if (SCROLL_KEYS.indexOf(e.key) < 0) return;
      markUserScrolled();
    }, { passive: true });
  }

  // 通用下拉刷新：在滚动容器顶部下拉（触摸）触发 onRefresh。
  // 下拉时资源整体向下平移，指示器在露出的空隙里同步出现（与资源一起往下走）；
  // 松手超过阈值即刷新，刷新中显示「刷新中…」。仅当 scrollTop<=0 且向下拉时生效。
  function attachPullToRefresh(scrollEl, onRefresh, opts) {
    opts = opts || {};
    const threshold = opts.threshold || 56;
    const maxPull = opts.maxPull || 84;
    const ind = document.createElement('div');
    ind.className = 'ptr-indicator';
    ind.innerHTML = '<span class="ptr-icon">↓</span><span class="ptr-text">下拉刷新</span>';
    ind.style.top = getComputedStyle(scrollEl).paddingTop || '0';
    scrollEl.appendChild(ind);
    const txtEl = ind.querySelector('.ptr-text');
    const iconEl = ind.querySelector('.ptr-icon');
    let active = false, pulling = false, refreshing = false, startY = 0, dist = 0, kids = [];

    // 下拉时若列表中有「正在播放」的视频，不要对内容做任何 transform：
    // WebView 里给正在播放的 <video> 祖先加/改 transform 会导致视频从片头重新播放
    // （「瞬移到初始位置」）。除 _inlineVid 外，直接查 DOM 中正在播放的 <video>，
    // 避免 _inlineVid 状态与真实播放不同步时漏判（视频仍在播、变量却已清空）。
    function contentHasPlayingVideo() {
      if (_inlineVid && _inlineVid.v && !_inlineVid.v.paused && !_inlineVid.v.ended) return true;
      const v = scrollEl.querySelector('video');
      return !!(v && !v.paused && !v.ended);
    }
    function contentTransform(y) {
      if (y && contentHasPlayingVideo()) y = 0;
      for (const c of kids) c.style.transform = y ? `translateY(${y}px)` : '';
    }
    function setInd(d) {
      const e = Math.max(0, Math.min(d, maxPull));
      ind.style.transform = `translateY(${-ind.offsetHeight + Math.min(e, ind.offsetHeight)}px)`;
      ind.style.opacity = Math.min(1, e / threshold);
      if (refreshing) { txtEl.textContent = '刷新中…'; return; }
      if (e >= threshold) { txtEl.textContent = '释放刷新'; iconEl.textContent = '↑'; }
      else { txtEl.textContent = '下拉刷新'; iconEl.textContent = '↓'; }
    }
    function resetAll() {
      ind.style.transition = 'transform .3s, opacity .3s';
      contentTransform(0);
      ind.style.transform = `translateY(${-ind.offsetHeight}px)`;
      ind.style.opacity = 0;
      setTimeout(() => { ind.style.transition = ''; }, 300);
    }
    function startRefresh() {
      refreshing = true;
      ind.style.transition = 'transform .2s, opacity .2s';
      contentTransform(threshold);
      ind.style.transform = 'translateY(0)';
      ind.style.opacity = 1;
      txtEl.textContent = '刷新中…';
      iconEl.innerHTML = '<span class="spinner" style="width:15px;height:15px;border-width:2px;display:inline-block;vertical-align:middle"></span>';
      Promise.resolve().then(() => onRefresh()).then(finishRefresh).catch(finishRefresh);
    }
    function finishRefresh() { refreshing = false; resetAll(); }

    scrollEl.addEventListener('touchstart', (e) => {
      if (refreshing || scrollEl.scrollTop > 0) { active = false; return; }
      active = true; pulling = false; dist = 0; startY = e.touches[0].clientY;
      kids = Array.from(scrollEl.children).filter(c => !c.classList || !c.classList.contains('ptr-indicator'));
    }, { passive: true });
    scrollEl.addEventListener('touchmove', (e) => {
      if (!active || refreshing) return;
      const delta = e.touches[0].clientY - startY;
      if (!pulling) {
        if (delta > 0 && scrollEl.scrollTop <= 0) pulling = true;
        else if (delta <= 0) { active = false; return; }
        else return;
      }
      if (delta > 0 && scrollEl.scrollTop <= 0) {
        if (e.cancelable) e.preventDefault();
        dist = Math.min(delta * 0.5, maxPull);
        contentTransform(dist);
        setInd(dist);
      }
    }, { passive: false });
    scrollEl.addEventListener('touchend', () => {
      if (!active || refreshing) { active = false; return; }
      active = false;
      if (pulling && dist >= threshold) startRefresh();
      else resetAll();
      pulling = false; dist = 0;
    });
  }

  // 首页（关注流）下拉刷新：拉取最新并「顶部插入、保持当前查看位置」，新内容在上方，不跳顶
  if (brScroll) attachPullToRefresh(brScroll, async () => { await refreshBrowseKeepPos(); });
  // 搜索视图同样支持下拉刷新
  if (srchScroll) attachPullToRefresh(srchScroll, async () => { await doSearch(); });

  // 上拉加载已移除：更旧的推文改为「滚动触底（或距底 400px）自动加载/预加载」，
  // 由上方 #view-browse / #view-search 的无限滚动监听器负责，无需独立手势，也避免无动画的突兀感。


  // P2-11 定时刷新关注流：每 3 分钟静默拉一次最新推文，插入到顶部并保持当前查看位置，
  // 不弹任何提示横幅，直接复用 prependNewTweets（新推文已置顶，用户上滑即见）。
  async function pollNewTweets() {
    // 告警条可见时顺带复检：网络/代理恢复后让它自己消失（仅此时才发 /check 请求）
    recheckSessionIfAlerted();
    if (brLoading) return;
    try {
      const r = await req(`${API}/timeline?count=20`);
      const d = await r.json();
      if (!d.success) return;
      prependNewTweets(d.items || []);
    } catch (_) {}
  }
  setInterval(pollNewTweets, 180000);  // 每 3 分钟
  // 切到浏览 tab 时立即查一次
  tabsEl.addEventListener('click', (e) => {
    if (e.target?.dataset?.view === 'browse') setTimeout(pollNewTweets, 500);
  });

  /* ---- 推文详情页（DBox 内预览推文 + 评论区） ---- */
  const dtEl = $('detail');
  const dtBody = $('dt-body');
  const dtReplies = $('dt-replies');
  const dtScroll = $('dt-scroll');
  const dtMoreBtn = $('dt-more');
  const dtLoadmore = $('dt-loadmore');
  let dtCurTweet = null;   // 当前详情推文
  let dtCursor = null;     // 评论区分页 cursor
  let dtLoading = false;
  let dtFavBtn = null;

  // 详情页缓存：直接复用全局单缓存 XTWEETS（见上方 feed('tweets')），不再另起
  // 一份 localStorage 缓存。同一条推文的「完整内容 + 评论分页 + 游标」只存在于一处，
  // 详情与所有视图（首页/搜索/收藏/历史）天然一致。刷新页面、从任意入口再打开同一条
  // 推文都命中 XTWEETS 秒开、零请求；只有首次打开或点「↻ 重新获取」才走网络。
  function dtCacheGet(id) {
    const t = tweetCacheGet(id);
    if (!t) return null;
    return { tweet: t, replies: (t.replies || []).slice(), cursor: t.cursor || null };
  }
  function dtCachePut(tweet, replies, cursor) {
    tweetCachePutDetail(tweet, replies, cursor);
  }

  // 详情缓存已统一到全局单缓存 XTWEETS（见上方 feed('tweets')），不再有独立的
  // localStorage 详情缓存，故删除原 DT_CACHE / dtPersist / dtRestore 等本地持久化逻辑。


  // 把详情主体 + 评论区一次性画出来（缓存命中与网络取回共用同一条渲染路径）
  function paintDetail(tweet, replies, cursor) {
    dtBody.innerHTML = '';
    dtBody.appendChild(renderTweetDetailCard(tweet));
    dtReplies.innerHTML = (replies && replies.length)
      ? '<div class="dt-reply-title">回复</div>' : '<div class="bm-empty">还没有回复。</div>';
    (replies || []).forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
    dtCursor = cursor || null;
    dtLoadmore.style.display = dtCursor ? '' : 'none';
  }

  // 渲染推文详情的完整卡片
  function renderTweetDetailCard(t) {
    const a = t.author || {};
    const mediaHtml = (t.media || []).map((m) => {
      if (m.type === 'video') {
        // 媒体对象有两个生产者，字段并不统一，两种都要认：
        //   时间线 GraphQL：url = m3u8，mp4 = 直链
        //   详情 _normalize_media：url = mp4，且没有 mp4 键
        // 优先 m3u8（hls.js 分片小、可边下边播），否则退回直链 mp4。
        // 此前只认「非 m3u8 的 url」：m3u8 媒体被渲染成空，直链 mp4 又要等代理
        // 把整个文件下完才出第一个字节，首次播放表现为一直转圈。
        const isM3u8 = !!(m.url && String(m.url).includes('.m3u8'));
        const mp4 = (m.mp4 && !String(m.mp4).includes('.m3u8'))
          ? mediaUrl(m.mp4, 'video')
          : ((!isM3u8 && m.url) ? mediaUrl(m.url, 'video') : '');
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        if (!mp4 && !m3u8) return '';
        const poster = mediaUrl(m.cover || '', 'image');
        // 同卡片缩略图：用 <img> 承载封面以获得真实比例，避免 <video> 固有的
        // 300×150 小框（无 src 时 poster 不改变元素尺寸）
        // 同样带上封面真实宽高以预留空间（消除加载过程中的布局跳动）
        // 缺失时兜底 320x180（≈16:9），同卡片缩略图
        const dim = (m.w && m.h) ? ` width="${m.w}" height="${m.h}"` : ' width="320" height="180"';
        return `<div class="bm-media dt-video" data-type="video" data-mp4="${esc2(mp4)}" data-m3u8="${esc2(m3u8)}">`
          + (poster ? `<img src="${esc2(poster)}" alt=""${dim} loading="lazy" onerror="_onVideoCoverErr(this)"/>` : '')
          + `<span class="bm-play">▶</span></div>`;
      }
      return m.url ? `<img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="_onImgErr(this)" />` : '';
    }).join('');
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const isFav = favSet.has(t.tweet_id);
    const card = document.createElement('div');
    card.className = 'dt-card';
    card.innerHTML = `
      ${t.retweeted_by ? rtNoteHtml(t.retweeted_by) : ''}
      ${t.in_reply_to ? replyContextHtml(t.in_reply_to) : ''}
      <div class="dt-head">
        ${a.avatar ? `<img class="dt-avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          ${(a.name && a.name !== a.screen_name) ? `<div class="dt-name" data-link="${esc2(profileUrl)}">${esc2(a.name)}</div>` : ''}
          <div class="dt-handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="dt-time">${esc2(fmtTime(t.created_at))}</div>
      </div>
      <div class="dt-text">${linkifyMentions(t.text)}</div>
      ${mediaHtml ? `<div class="dt-media">${mediaHtml}</div>` : ''}
      ${t.quoted ? quotedHtml(t.quoted) : ''}
      <div class="dt-counts">
        ${t.reply_count != null ? `<span>💬 <b>${t.reply_count}</b></span>` : ''}
        ${t.retweet_count != null ? `<span>🔁 <b>${t.retweet_count}</b></span>` : ''}
        ${t.favorite_count != null ? `<span>❤️ <b>${t.favorite_count}</b></span>` : ''}
        ${t.quote_count != null ? `<span>💭 <b>${t.quote_count}</b></span>` : ''}
        ${t.view_count != null ? `<span>👁 <b>${t.view_count}</b></span>` : ''}
      </div>
      <div class="dt-actions">
        <button class="fav ${isFav ? 'on' : ''}" data-tid="${esc2(t.tweet_id)}">${isFav ? '★ 已收藏' : '☆ 收藏'}</button>
        <button class="refetch" data-tid="${esc2(t.tweet_id)}">↻ 重新获取</button>
        <button class="dl" data-url="${esc2(t.url || '')}">⬇ 下载</button>
        <button class="openx" data-url="${esc2(t.url || '')}">打开原文 ↗</button>
      </div>`;
    // 视频：点按原地点播，复用浏览卡片那套 hls.js 播放逻辑（封面 + ▶）
    card.querySelectorAll('.dt-video').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        playInlineVideo(el, el.dataset.mp4, el.dataset.m3u8);
      });
    });
    // 「查看完整帖子」：本条是评论（回复）时，跳到被回复的原贴详情。
    // 搜索常直接搜到评论本身，用户点开后需要回到上下文里的完整帖子；
    // openTweetDetail 会压入历史，看完可后退返回这条评论。
    const gotoParent = card.querySelector('.dt-goto-parent');
    if (gotoParent && t.in_reply_to && t.in_reply_to.tweet_id) {
      gotoParent.addEventListener('click', (e) => {
        e.stopPropagation();
        openTweetDetail(t.in_reply_to.tweet_id, null, false, (t.author || {}).screen_name);
      });
    }
    // 引用转发：原贴也以嵌套卡片呈现（头像/@id/正文/媒体），点卡片打开原贴详情
    if (t.quoted) {
      wireMediaBlock(card.querySelector('.quoted'), t.quoted.media || []);
      const qEl = card.querySelector('.quoted');
      if (qEl) {
        qEl.addEventListener('click', (e) => {
          if (e.target.closest('[data-link]') || e.target.closest('.bm-media')) return;
          e.stopPropagation();
          if (qEl.dataset.tid) openTweetDetail(qEl.dataset.tid, t.quoted, false, (t.quoted.author || {}).screen_name);
        });
      }
    }
    // 作者名跳 profile
    card.querySelectorAll('[data-link]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const u = el.dataset.link; if (!u) return;
        // 作者资料链接 → 在 DBox 内自行解析用户详情，不打开 x.com
        const m = /^https?:\/\/(?:x|twitter)\.com\/([^\/\?\#]+)\/?$/.exec(u);
        if (m) openUser(m[1]); else window.open(u, '_blank', 'noopener');
      });
    });
    // 收藏/移出
    card.querySelectorAll('.fav').forEach((b) => b.addEventListener('click', () => {
      const tid = b.dataset.tid;
      if (favSet.has(tid)) {
        b.disabled = true;
        req(`${API}/bookmarks/folder/${encodeURIComponent(tid)}`, { method: 'DELETE' })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.delete(tid); saveFavSet(); b.classList.remove('on'); b.textContent = '☆ 收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      } else {
        b.disabled = true; b.textContent = '收藏中…';
        req(`${API}/bookmarks/folder`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(t) })
          .then((r) => r.json()).then((d) => {
            if (d.success) { favSet.add(tid); saveFavSet(); b.classList.add('on'); b.textContent = '★ 已收藏'; }
            else b.textContent = '失败';
            b.disabled = false;
          });
      }
    }));
    // 下载
    card.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url;
      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(u || t.url)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; b.disabled = !ok; })
        .catch(() => { b.textContent = '下载失败'; b.disabled = false; });
    }));
    // 打开原文（明确点击才跳 X）
    card.querySelectorAll('.openx').forEach((b) => b.addEventListener('click', () => {
      const u = b.dataset.url; if (u) window.open(u, '_blank', 'noopener');
    }));
    // 重新获取：以推文为单位强制刷新该卡所有媒体（绕过坏缓存），并重新拉取这条
    // 推文的内容——详情页默认走详情缓存（秒开、不发请求），这里是强制更新的出口。
    // 注意：不再 dtCacheDrop 删除缓存——删缓存的 lww 推送会在服务端先把这条顶掉，
    // 若随后很快刷新、补回的推送还压在防抖里没发出，pull 会拿服务端缺这条的快照覆盖
    // 本地，推文就"消失"。改为 force 强拉网络并覆盖写回（upsert），服务端始终含这条。
    card.querySelectorAll('.refetch').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      reloadCardMedia(card);
      b.textContent = '获取中…';
      const tid = t.tweet_id || b.dataset.tid;
      if (tid) {
        openTweetDetail(String(tid), null, true, (t.author || {}).screen_name).catch(() => {});
        return;
      }
      setTimeout(() => { b.textContent = '↻ 重新获取'; }, 1500);
    }));
    return card;
  }

  // 渲染一条回复
  function renderReplyCard(rp) {
    const a = rp.author || {};
    const thumb = (rp.media || []).slice(0, 1).map((m) =>
      m.url ? `<div class="dt-reply-media"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" /></div>` : '').join('');
    const div = document.createElement('div');
    div.className = 'dt-reply';
    div.innerHTML = `
      ${a.avatar ? `<img src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
      <div class="rv">
        <div class="head">
          ${(a.name && a.name !== a.screen_name) ? `<span class="rname">${esc2(a.name)}</span>` : ''}
          <span class="rhandle">@${esc2(a.screen_name || 'unknown')}</span>
          <span class="dt-time">${esc2(fmtTime(rp.created_at))}</span>
        </div>
        <div class="rtext">${linkifyMentions(rp.text)}</div>
        ${thumb}
      </div>`;
    // 回复本身也是一条推文：点开可看它自己的详情（若它也是评论，就能继续
    // 通过「查看完整帖子」追溯到被回复的原帖）。此前未绑事件＝点不动。
    if (rp.tweet_id) {
      div.dataset.tid = rp.tweet_id;
      div.style.cursor = 'pointer';
      div.addEventListener('click', (e) => {
        e.stopPropagation();
        openTweetDetail(rp.tweet_id, rp, false, (rp.author || {}).screen_name);
      });
    }
    return div;
  }

  /* ---- 用户详情页：点击头像/名字/@id 进入，DBox 内自行解析其推文（不打开 x.com） ---- */
  let userEl = null, userBodyEl, userListEl, userLoadmoreEl, userMoreEl;
  let userCursor = null, userLoading = false, userCurName = null;
  let userCachedShown = false;   // 本次打开是否用跨设备缓存预渲染（避免网络返回前闪「加载中」）

  function fmtN(n) {
    if (n == null) return '0';
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  async function openUser(screenName) {
    screenName = (screenName || '').replace(/^@/, '');
    if (!screenName) return;
    // 已是当前用户浮层且无强制刷新 → 直接返回，避免 navigate 触发 hashchange 后重复进入
    if (userEl && userEl.classList.contains('active') && userCurName === screenName) return;
    if (_inlineVid) stopInlineVideo(_inlineVid);
    // URL 对齐：用户页即 #/<seg>/<screen_name>，可复制 / 刷新 / 分享
    navigate({ name: 'user', screen_name: screenName }, { silent: true });
    if (!userEl) {
      userEl = $('user');
      userBodyEl = $('user-body');
      userListEl = $('user-list');
      userLoadmoreEl = $('user-loadmore');
      userMoreEl = $('user-more');
      $('user-back').addEventListener('click', () => closeDrillViaApp('user'));
      userMoreEl.addEventListener('click', () => loadUserTweets(false));
    }
    userCurName = screenName;
    userCursor = null;
    userEl.classList.add('active');
    enterDrill('user', true);
    userLoadmoreEl.style.display = 'none';
    // 跨设备缓存预渲染：先 pull 对账，再尝试用本地/服务端缓存（user_id_of 别名 →
    // feed:user:<id> 成员列表 → XTWEETS 内容）即时渲染；网络返回后再刷新为最新。
    // 改名(screen_name 变化)会让别名失效 → 退化为「加载中」重新拉取，自然自愈。
    userCachedShown = false;
    if (XSTATE) {
      try { await XSTATE.pull(); } catch (_) {}
      userCachedShown = renderUserCache(screenName);
    }
    if (!userCachedShown) {
      userBodyEl.innerHTML = '<div class="bm-empty">加载中…</div>';
      userListEl.innerHTML = '';
    }
    await loadUserTweets(true);
  }

  async function loadUserTweets(reset) {
    if (userLoading || !userEl) return;
    userLoading = true;
    if (reset && !userCachedShown) {
      userBodyEl.innerHTML = '<div class="bm-empty">加载中…</div>';
      userListEl.innerHTML = '';
      userCursor = null;
    } else if (reset) {
      userListEl.innerHTML = '';   // 已有缓存预渲染，清掉等最新覆盖，不闪「加载中」
      userCursor = null;
    }
    try {
      const url = `${API}/user_tweets?user=${encodeURIComponent(userCurName)}&count=20` +
        (userCursor ? `&cursor=${encodeURIComponent(userCursor)}` : '');
      const r = await req(url);
      const d = await r.json();
      if (!d.success) {
        if (reset) userBodyEl.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '')}</div>`;
        userLoading = false;
        return;
      }
      renderUserProfile(d.user);
      const items = d.items || [];
      for (const it of items) {
        const card = renderBmCard(it, false);
        // 用户自己的时间线里再点作者名/头像会重新进入同一用户，站内解析即可，无需重绑
        userListEl.appendChild(card);
      }
      tweetCachePut(items);   // 内容进全局单缓存（一处内容，跨设备共享）
      try {
        const _uid = (d.user && (d.user.rest_id || d.user.id)) ? String(d.user.rest_id || d.user.id) : '';
        if (_uid) XSTATE.set('user_id_of:' + userCurName, _uid, { strategy: 'lww' });
      } catch (_) {}
      userCursor = d.next_cursor || null;
      userLoadmoreEl.style.display = userCursor ? '' : 'none';
    } catch (e) {
      if (reset) userBodyEl.innerHTML = `<div class="bm-empty err">加载异常: ${esc2(e.message || e)}</div>`;
    } finally {
      userLoading = false;
    }
  }

  // 跨设备缓存预渲染：screen_name → user_id 别名 → feed:user:<id> 成员列表 → XTWEETS 内容。
  // 与 restoreBookmarks/restoreSearch 同套路（pull 后对账再渲染）。改名会让别名失效 → 返回 false。
  function renderUserCache(screenName) {
    if (!XSTATE) return false;
    let uid = null;
    try { uid = XSTATE.get('user_id_of:' + screenName); } catch (_) {}
    if (!uid) return false;
    let mem = null;
    try { mem = XSTATE.get('feed:user:' + uid); } catch (_) {}
    if (!mem || !mem.length) return false;
    let shown = 0;
    userListEl.innerHTML = '';
    for (const m of mem) {
      const it = tweetCacheGet(m.tweet_id || m.id);
      if (!it) continue;
      userListEl.appendChild(renderBmCard(it, false));
      shown++;
    }
    if (!shown) return false;
    // 资料头：优先后端跨设备缓存的 users:<uid>
    let prof = null;
    try { prof = XSTATE.get('users:' + uid); } catch (_) {}
    if (prof && prof.screen_name) renderUserProfile(prof);
    return true;
  }

  function renderUserProfile(p) {
    if (!p) { userBodyEl.innerHTML = ''; return; }
    const handle = p.screen_name ? '@' + p.screen_name : '';
    const stats = [];
    if (p.statuses_count != null) stats.push(`<span><b>${fmtN(p.statuses_count)}</b> 推文</span>`);
    if (p.following_count != null) stats.push(`<span><b>${fmtN(p.following_count)}</b> 正在关注</span>`);
    if (p.followers_count != null) stats.push(`<span><b>${fmtN(p.followers_count)}</b> 关注者</span>`);
    userBodyEl.innerHTML = `
      <div class="uprof">
        <div class="uprof-head">
          ${p.avatar ? `<img class="uprof-avatar" src="${esc2(p.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : '<div class="uprof-avatar"></div>'}
          <div class="uprof-id">
            <div class="uprof-name">${esc2(p.name || '')}${p.verified ? ' ✔' : ''}</div>
            <div class="uprof-handle">${esc2(handle)}</div>
          </div>
        </div>
        ${p.bio ? `<div class="uprof-bio">${esc2(p.bio)}</div>` : ''}
        <div class="uprof-stats">${stats.join('')}</div>
      </div>`;
  }

  async function openTweetDetail(tweetId, seed, force, screenName) {
    // 列表里若有正在原地点播的视频，进详情前必须先停掉并销毁 hls 实例：
    // 详情层会盖住整个面板，视频虽被遮住但解码与声音仍在继续（被遮挡不会自动
    // 暂停），表现为「推文都点开了，视频还在响」。
    if (_inlineVid) stopInlineVideo(_inlineVid);
    // 推文页 URL 中立（#/tweet/<id>）：不论从首页 / 搜索 / 收藏 / 历史 / 粘贴链接
    // 进来，同一条推文都是同一个 URL，且不带任何来源参数。
    const wasActive = dtEl.classList.contains('active');
    if (!wasActive) enterDrill('detail', false);   // 历史项由下面的 navigate 压入
    dtEl.classList.add('active');
    // 尽量带上作者 screen_name，使 URL 与 x.com 真实结构对齐
    // （#/<seg>/<screen_name>/status/<id>）；拿不到时回退到中立的 #/tweet/<id>
    let sn = screenName || null;
    if (!sn) { const c = dtCacheGet(tweetId); if (c && c.tweet && c.tweet.author) sn = c.tweet.author.screen_name || null; }
    const wantHash = buildHash(sn ? { name: 'tweet', id: tweetId, screen_name: sn }
                                 : { name: 'tweet', id: tweetId });
    // 详情内跳到另一条推文（如点引用的原推）用 replace：详情始终只占一条历史
    if (location.hash !== wantHash) {
      navigate(sn ? { name: 'tweet', id: tweetId, screen_name: sn }
                  : { name: 'tweet', id: tweetId }, { silent: true, replace: wasActive });
    }
    // 命中详情缓存 → 直接秒开，零请求（刷新页面或从别的入口再打开同一条推文
    // 都走这条路；这种情况下内容已经在本地，再拉一遍 X 没有意义）
    // force=true 用于「重新获取」：不删缓存、只强制重拉网络并覆盖写回，
    // 避免删缓存的 lww 推送在服务端先把这条顶掉、刷新时又被 pull 覆盖回来导致消失。
    // 额外防御：即使命中缓存，若条目残缺（服务端 dtCacheDrop 遗留的脏数据），也降级
    // 为强制重拉——网络拿回完整数据后 persistTweetToFeed+dtCachePut 会覆盖写回服务端，
    // 逐步清洗掉已落盘的脏数据。
    const hit = dtCacheGet(tweetId);
    if (hit && !force) {
      const ha = (hit.tweet && hit.tweet.author) || {};
      if (!ha.screen_name) {
        // 缓存命中但 author 残缺（@unknown）→ 降级为 force 重拉
      } else {
        dtCurTweet = hit.tweet;
        paintDetail(hit.tweet, hit.replies, hit.cursor);
        if (dtScroll) dtScroll.scrollTop = 0;
        return;
      }
    }
    dtBody.innerHTML = '<div class="bm-empty">加载中…</div>';
    dtReplies.innerHTML = '';
    dtLoadmore.style.display = 'none';
    dtCursor = null;
    if (seed) {
      // 先用列表数据即时渲染，再拉取完整详情+评论区
      dtBody.innerHTML = '';
      dtBody.appendChild(renderTweetDetailCard(mergeTweet(seed)));
      dtReplies.innerHTML = '<div class="bm-empty">正在加载评论区…</div>';
    }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(tweetId)}`);
      const d = await r.json();
      if (!d.success) {
        dtBody.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '')}</div>`;
        return;
      }
      const replies = d.replies || [];
      if (d.tweet) {
        // 详情是最完整的那一份：并入总库，顺带把列表里的同一条推文补全
        dtCurTweet = mergeTweet(d.tweet);
        persistTweetToFeed(d.tweet);   // 回流到唯一持久化缓存：返回首页/刷新/换设备都见全文
        paintDetail(dtCurTweet, replies, d.next_cursor);
        dtCachePut(dtCurTweet, replies, d.next_cursor);   // 下次再打开直接命中
        recordHistory(dtCurTweet);  // P1-7：记录浏览历史（fire-and-forget）
      } else {
        dtReplies.innerHTML = replies.length ? '<div class="dt-reply-title">回复</div>' : '<div class="bm-empty">还没有回复。</div>';
        replies.forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
        dtCursor = d.next_cursor || null;
        dtLoadmore.style.display = dtCursor ? '' : 'none';
      }
    } catch (e) {
      if (!seed) dtBody.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  // 评论区加载更多
  async function loadMoreReplies() {
    if (!dtCurTweet || dtLoading || !dtCursor) return;
    dtLoading = true;
    if (dtMoreBtn) { dtMoreBtn.disabled = true; dtMoreBtn.innerHTML = '<span class="spinner"></span>加载中…'; }
    try {
      const r = await req(`${API}/tweet/${encodeURIComponent(dtCurTweet.tweet_id)}?cursor=${encodeURIComponent(dtCursor)}`);
      const d = await r.json();
      const added = d.replies || [];
      added.forEach((rp) => dtReplies.appendChild(renderReplyCard(rp)));
      dtCursor = d.next_cursor || null;
      dtLoadmore.style.display = dtCursor ? '' : 'none';
      // 追加进详情缓存：下次打开这条推文，已取回的评论也一起直接呈现
      const hit = dtCacheGet(dtCurTweet.tweet_id);
      if (hit) dtCachePut(dtCurTweet, hit.replies.concat(added), dtCursor);
    } catch (_) {} finally {
      dtLoading = false;
      if (dtMoreBtn) { dtMoreBtn.disabled = false; dtMoreBtn.innerHTML = '加载更多回复'; }
    }
  }

  $('dt-back').addEventListener('click', () => { closeDrillViaApp('detail'); });
  $('dt-more').addEventListener('click', loadMoreReplies);

  /* ---- 本地浏览历史（P1-7） ---- */
  const hsList = $('hs-list');

  async function recordHistory(tweet) {
    if (!tweet || !tweet.tweet_id) return;
    // 跨设备共享：浏览记录写入 UserState（与首页/搜索/收藏同一套 ns='x' 状态层），
    // 任意设备打开历史视图都能直接看到，不依赖本机 SQLite。
    if (XSTATE) {
      try {
        const rec = {
          tweet_id: tweet.tweet_id, id: tweet.tweet_id,
          text: tweet.text, created_at: tweet.created_at,
          media: tweet.media || [], url: tweet.url, author: tweet.author || {},
          viewed_at: new Date().toISOString(),
        };
        let list = [];
        try { list = (XSTATE.get('history:list') || []).slice(); } catch (_) {}
        const seen = new Set(list.map((x) => String(x.tweet_id)));
        if (!seen.has(String(rec.tweet_id))) {
          list.unshift(rec);
          if (list.length > 300) list = list.slice(0, 300);
          XSTATE.set('history:list', list, { strategy: 'lww' });
        }
      } catch (_) {}
    }
    try {
      await req(`${API}/history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tweet),
      });
    } catch (_) {}
  }

  async function loadHistory() {
    hsList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      let items = null;
      // 优先读跨设备缓存（history:list），无则回退本机 SQLite（/history）
      if (XSTATE) {
        try { await XSTATE.pull(); } catch (_) {}
        try { items = XSTATE.get('history:list'); } catch (_) {}
      }
      if (!items || !items.length) {
        const r = await req(`${API}/history?limit=100`);
        const d = await r.json();
        if (!d.success) { hsList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
        items = d.items || [];
      }
      if (!items.length) { hsList.innerHTML = '<div class="bm-empty">浏览过的推文会记录在这里，可回看。</div>'; return; }
      tweetCachePut(items);   // 内容进全局单缓存（一处内容，详情也读这份）
      hsList.innerHTML = '';
      // 复用浏览卡渲染（含点开详情/收藏/下载），历史可回看
      items.forEach((it) => hsList.appendChild(renderBrowseCard(it)));
    } catch (e) {
      hsList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('hs-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部浏览历史？')) return;
    if (XSTATE) { try { XSTATE.set('history:list', [], { strategy: 'lww' }); } catch (_) {} }
    await req(`${API}/history?clear=1`, { method: 'DELETE' });
    loadHistory();
  });

  /* ---- 媒体缓存管理（P2-9） ---- */
  const mcList = $('mc-list');
  const mcStats = $('mc-stats');

  function fmtSize(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  async function loadCache() {
    mcList.innerHTML = '<div class="bm-empty">加载中…</div>';
    try {
      const r = await req(`${API}/media/cache`);
      const d = await r.json();
      if (!d.success) { mcList.innerHTML = `<div class="bm-empty err">${esc2(d.message || '加载失败')}</div>`; return; }
      const items = d.items || [];
      const total = d.total_bytes || 0;
      mcStats.innerHTML = `共 <b>${items.length}</b> 个文件，占用 <b>${fmtSize(total)}</b>（上限 512MB）`;
      if (!items.length) { mcList.innerHTML = '<div class="bm-empty">点开的图片/视频会缓存到本地，可回看。</div>'; return; }
      mcList.innerHTML = '';
      items.slice(0, 100).forEach((it) => {
        const el = document.createElement('div');
        el.className = 'mc-item';
        el.innerHTML = `<span class="type">${it.type === 'video' ? '🎬' : '🖼'}</span>
          <span class="name">${esc2(it.file)}</span>
          <span class="size">${fmtSize(it.size)}</span>`;
        mcList.appendChild(el);
      });
    } catch (e) {
      mcList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  $('mc-clear').addEventListener('click', async () => {
    if (!confirm('确定清空全部媒体缓存？已缓存图片/视频将需要重新从 X 加载。')) return;
    await req(`${API}/media/cache`, { method: 'DELETE' });
    loadCache();
  });

  /* ---- 初始化：首屏加载由启动路由（bootRoute）统一触发 ----
     视图加载与 URL 落地是同一件事：bootRoute 依据深链/本地记忆决定初始页，
     再由 switchView 拉起对应数据（首页即自动加载关注流，无需点刷新）。
     这里不再单独触发一次加载，否则「深链到首页」会重复请求一次时间线。
  */
  // 详情缓存已统一到全局单缓存 XTWEETS：刷新后重开同一 #/tweet/<id> 直接命中 XTWEETS，
  // 无需单独读回一份本地详情缓存（XTWEETS 本身跨刷新/跨设备持久）。
</script>
</body>
</html>
