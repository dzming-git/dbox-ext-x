      // replaceState 不触发 hashchange，需手动应用；且用于「同一层的视图切换」
      // （切 tab、切热门/最新），避免历史栈被无意义地刷屏。
      try { history.replaceState(null, '', hash); } catch (_) { location.hash = hash; }
      if (!opts.silent) applyRoute(route, opts);
      return;
    }
    if (location.hash === hash) { if (!opts.silent) applyRoute(route, opts); return; }
    location.hash = hash;   // 触发 hashchange → applyRoute
  }

  // URL 上的搜索参数落到界面（只填框/切排序，**不发请求**）
  function applySearchParams(params, opts) {
    const inp = $('srch-input');
    if (inp && typeof params.q === 'string' && params.q) inp.value = params.q;
    if (params.tab) {
      const tab = String(params.tab).toLowerCase() === 'latest' ? 'Latest' : 'Top';
      if (tab !== srchProduct) setSrchProduct(tab, { silent: true });
    }
  }

  function applyRoute(route, opts) {
    opts = opts || {};
    if (!route) return;
    if (route.name === 'tweet') {
      // 推文页中立：不切换底层列表视图，只在其上开详情层；
      // 记住来源路由，关闭详情（含浏览器后退）时回到它。
      if (!lastListRoute) lastListRoute = currentListRoute();
      openTweetDetail(route.id, null, false, route.screen_name);
      return;
    }
    if (route.name === 'user') {
      // 用户页（X 原生 URL 对齐）：开用户浮层，URL 即 #/<seg>/<screen_name>；
      // 关闭时回到来源列表页（与推文详情一致）。
      if (!lastListRoute) lastListRoute = currentListRoute();
      openUser(route.screen_name);
      return;
    }
    if (route.name === 'search') applySearchParams(route.params || {}, opts);
    // URL 已经不是推文页 → 收起详情层（覆盖「用户在浏览器里后退/改地址栏」的情况，
    // 此时历史由浏览器消费，面板不能再 back 一次）
    if (route.name !== 'tweet') hideDetailLayer();
    // 视图未变（如从推文详情后退回列表）时不再重载，保留列表现场与滚动位置
    if (!routeInited || route.name !== activeView) {
      switchView(route.name, {
        silent: !!opts.silent, url: false, fromUrl: !!opts.fromUrl,
        params: route.params || {},
      });
    }
    lastListRoute = { name: route.name, params: route.params || {} };
  }

  let activeView = 'browse';
  let lastListRoute = null;   // 最近一次所处的列表路由（推文详情页的「返回」目标）
  function switchView(v, opts) {
    opts = opts || {};
    const silent = !!opts.silent;
    const fromUrl = !!opts.fromUrl;
    if (!silent) userSwitchedView = true;
    activeView = v;
    // 记忆当前所在视图：迷你窗关闭/重开（iframe 可能被重载或 hash 被框架改写）后，
    // 用 localStorage 而非 URL hash 作为权威来源，保证重开回到上次停留的标签页。
    try { localStorage.setItem('xd_active_view', v); } catch (_) {}
    xSet('active_view', v, { strategy: 'lww' });   // 跨设备同步当前标签页
    tabsEl.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.view === v));
    viewDownload.style.display = v === 'download' ? '' : 'none';
    viewBrowse.style.display = v === 'browse' ? '' : 'none';
    viewHistory.style.display = v === 'history' ? '' : 'none';
    viewCache.style.display = v === 'cache' ? '' : 'none';
    viewBookmarks.style.display = v === 'bookmarks' ? '' : 'none';
    viewSearch.style.display = v === 'search' ? '' : 'none';
    // 一级 URL：每个视图一个（silent=true：URL 与视图都由本次调用决定，不回环再应用一次）
    if (opts.url !== false) {
      navigate({ name: v, params: (v === 'search' ? (opts.params || searchRouteParams()) : {}) },
               { silent: true });
    }
    if (v === 'browse') {
      syncFavFromServer();
      openBrowse();   // 渲染缓存+恢复位置+后台静默刷新（不打断查看位置）
      checkXSession(); // 每次进入首页都自检一次 X 登录态
    } else if (v === 'history') {
      loadHistory();
    } else if (v === 'cache') {
      loadCache();
    } else if (v === 'search') {
      // 打开即拉取共享缓存并渲染（多设备同步关键：先 pull 再显示）。
      // 传入 URL 上的搜索参数：URL 指定的关键词若与缓存不同，只对齐输入框、
      // 不发请求（点「搜索」按钮才刷新缓存）。
      restoreSearch(opts.params || {});
    } else if (v === 'bookmarks') {
      // 打开即拉取共享缓存并渲染（多设备同步：先 pull 再显示）
      restoreBookmarks();
    }
  }

  function parseHash() {
    const r = parseRoute(location.hash);
    return r && r.name !== 'tweet' ? r.name : null;
  }

  // 桌面端刷新按钮：刷新当前列表视图（触摸端用下拉刷新，此按钮仅鼠标设备显示）
  const tbRefresh = $('tb-refresh');
  async function refreshActive() {
    if (!tbRefresh || tbRefresh.classList.contains('spinning')) return;
    tbRefresh.classList.add('spinning');
    try {
      if (activeView === 'browse') { await refreshBrowseKeepPos(); }
      else if (activeView === 'search') { await doSearch(); }
      else if (activeView === 'bookmarks') { loadXBookmarks(); }
    } catch (e) { /* 忽略刷新异常 */ } finally {
      tbRefresh.classList.remove('spinning');
    }
  }
  if (tbRefresh) tbRefresh.addEventListener('click', refreshActive);

  tabsEl.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });

  // 初始路由：宿主深链（/ext/x#/search?q=.. ）优先，其次面板自身 hash，
  // 再次本地记忆的视图，最后默认首页。
  // 延迟到脚本末尾再执行，避免 switchView 内引用的 bmXList/bmShowingFolder 等 const 尚未初始化的 TDZ 问题。
  // 略微延后（60ms）等宿主把顶层 hash 推过来，避免先渲染首页再跳到深链目标的闪烁。
  // 面板与宿主同源（srcdoc + allow-same-origin），可直读顶层 URL。深链（如
  // /ext/x#/tweet/123）因此不必等 postMessage 往返，避免「先落到本地记忆的视图、
  // 再被纠正」的抖动。小窗形态下顶层是 dbox 自己的页面，其 hash 与面板无关。
  function hostDeepLink() {
    try {
      const pl = window.parent && window.parent.location;
      if (!pl || pl === window.location) return null;
      const path = String(pl.pathname || '');
      if (path !== '/ext/x' && !(standaloneRoute && path === standaloneRoute)) return null;
      return parseRoute(pl.hash);
    } catch (_) { return null; }
  }

  function initialRoute() {
    const fromTop = hostDeepLink();
    if (fromTop) return fromTop;
    const fromHost = parseRoute(hostHash);
    if (fromHost) return fromHost;
    const self = parseRoute(location.hash);
    if (self) return self;
    let v = null;
    try { v = localStorage.getItem('xd_active_view'); } catch (_) {}
    // 本地优先：先用本地快照瞬时渲染（不等网络），再由后台对账补齐服务端状态
    if (XSTATE) v = XSTATE.get('active_view', v) || v;
    if (!v || VIEW_ROUTES.indexOf(v) < 0) v = 'browse';
    return { name: v, params: {} };
  }
  // 启动落地：宿主深链若在 60ms 内到达就立即执行（不等超时），否则按本地记忆的视图落地。
  // 它是视图加载的唯一入口，初始视图的首次拉取也由它触发（不再另起一份加载，避免重复请求）。
  let _bootTimer = null;
  function bootRoute() {
    if (routeInited) return;
    if (_bootTimer) { clearTimeout(_bootTimer); _bootTimer = null; }
    const r0 = initialRoute();
    applyRoute(r0, { fromUrl: true, silent: true });   // routeInited 仍为 false → 必定加载
    routeInited = true;
    // 落地后把 URL 对齐到当前路由：即使是「本地记忆的视图」也要反映到地址栏，
    // 让用户随时能复制/刷新当前页。推文页的 URL 已由 openTweetDetail 写好，不覆盖。
    if (r0.name !== 'tweet') navigate(r0, { replace: true, silent: true });
  }
  _bootTimer = setTimeout(bootRoute, 60);

  // 后台与服务端对账：把其它设备拉到的缓存并进本地（新设备秒开），
  // 但用户一旦自己动过视图就绝不再改（避免"被拉走"）。
  if (XSTATE) {
    XSTATE.pull().then(() => {
      try {
        // 【关键】主动清洗服务端残留的脏数据：旧 dtCacheDrop 的 lww 推送已在
        // user_state 表留下大量残缺推文条目（有 tweet_id 但 author.screen_name 缺失）。
        // SDK.pull() 以服务端为权威整体替换本地 → 脏数据持续回染为 @unknown。
        // 这里在渲染前先检测并清洗，用 lww 整组覆盖写回服务端（一次性根治）。
        scrubTweetsCache().then((n) => {
          if (n > 0) console.log(`[X] 已清洗 ${n} 条服务端脏数据（@unknown 壳条目）`);
        });
        // 服务端为唯一真相源：用服务端快照「整体替换」本地缓存后再渲染。
        // 此前只做增量合并（仅补本地没有的），导致各设备保留自己的旧条目、
        // 永远收敛不到同一份——手机与电脑显示不一致的根因。

        // 服务端数据又回推一次（它本就来自服务端）。
        // 内容缓存与游标已由框架 feed() 统一管理（feed:main:items / :cursor），
        // pull() 后 XFEED.items() 即为服务端快照，直接重渲染，不再另存一份本地缓存。
        if (activeView === 'browse' && XFEED && XFEED.items().length) {
          renderCachedBrowse();
          restoreBrowseScroll();
        }
        updateMasterLight();   // 对账后刷新主控状态灯（可能已被其它设备接管）
        startMasterPoll();     // 此后持续对账，主控被抢能及时反映到指示灯
        const v = XSTATE.get('active_view');
        const VALID = ['download', 'browse', 'history', 'cache', 'bookmarks', 'search'];

        }
      } catch (_) {}
    });

    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // 跳转由 .x-mention + 下方 document 捕获点击代理统一处理。
  function linkifyMentions(text) {
    const safe = esc2(text || '');
    return safe.replace(/(^|[^A-Za-z0-9_.@])@([A-Za-z0-9_]{1,15})/g,

  // 失败的空 body 被浏览器当成有效图片缓存了 1 天，导致刷新也永远是空白。
  // 换个 URL 即可让浏览器重新请求（服务端已改为流式 no-cache）。
  // 若将来再出现同类缓存污染，把这里的数字 +1 即可。
  const MEDIA_CACHE_BUST = '2';

  function mediaUrl(url, type, opts) {
    if (!url || !/twimg\.com|pbs\.twimg/.test(url)) return url || '';

    // force：绕过服务端坏缓存、强制重新从上游取图（以推文为单位重新获取时用）。
    if (opts && opts.force) s += `&force=1&_=${Date.now()}`;
    return s;

  async function loadXBookmarks() {
    bmXList.innerHTML = '<div class="bm-empty">正在从 X 同步收藏…</div>';
    const all = [];
    let cursor = null;
    let page = 0;
    const MAX_PAGES = 20; // 每页 50 条，最多拉 1000 条，防异常死循环
    try {
      while (page < MAX_PAGES) {
        page++;
        const url = `${API}/bookmarks?count=50${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ''}`;
        const r = await req(url);
        const d = await r.json();
        if (!d.success) {
          if (!all.length) { bmXList.innerHTML = `<div class="bm-empty err">同步失败: ${esc2(d.message || '未知错误')}</div>`; return; }
          break; // 中途某页失败，保留已拉到的
        }
        const pageItems = d.items || [];
        pageItems.forEach((it) => all.push(it));
        cursor = d.next_cursor || null;
        // 本页无新增推文或没有下一页了，停止翻页
        if (!cursor || !pageItems.length) break;
      }
      if (!all.length) { bmXList.innerHTML = '<div class="bm-empty">你在 X 上还没有收藏任何推文。</div>'; return; }
      // 过总库：与首页/搜索/历史里的同一条推文共用一份记录，不另存一份
      const merged = mergeTweets(all);
      tweetCachePut(merged);   // 内容进全局单缓存（一处内容，所有视图共享）
      bmXList.innerHTML = '';
      merged.forEach((it) => bmXList.appendChild(renderBmCard(it, false)));
      // 只存成员 id（不重复存内容）；完整内容在 XTWEETS
      if (XSTATE) try { XSTATE.set('bm:list', toMembership(merged).slice(0, 600), { strategy: 'lww' }); } catch (_) {}
    } catch (e) {
      if (!all.length) bmXList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
    }
  }

  // 图片加载失败：显示重试按钮（替代原来静默 visibility:hidden）
  function _onImgErr(img) {
    const wrap = img.parentElement;
    if (!wrap || wrap.classList.contains('img-err')) return;
    wrap.classList.add('img-err');
    const btn = document.createElement('button');
    btn.className = 'img-retry';
    btn.innerHTML = '<span>↻</span>重新加载';
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      wrap.classList.remove('img-err');

      const sep = img.src.includes('?') ? '&' : '?';

  function _onVideoCoverErr(img) {
    img.style.visibility = 'hidden';
    const wrap = img.parentElement;

  function _forceReloadSrc(src) {
    if (!src) return src;
    const sep = src.includes('?') ? '&' : '?';
    return src + sep + 'force=1&_=' + Date.now();
  }
  function reloadCardMedia(cardEl) {
    if (!cardEl) return;
    // .bm-media 包裹的媒体（浏览/收藏/搜索/详情视频）
    cardEl.querySelectorAll('.bm-media').forEach((el) => {

      if (v) {
        const poster = v.getAttribute('poster');
        if (poster) v.setAttribute('poster', _forceReloadSrc(poster));

  async function fetchTweetAndUpdateCard(tid, card) {

      if (card.parentNode) card.replaceWith(renderBrowseCard(item));
    } catch (_) {}
  }

  // 用统一的缩略图 HTML 渲染一组媒体（图片/视频），最多 4 个
  function cardMediaInner(mediaList) {
    const medias = (mediaList || []).slice(0, 4);
    const mCls = `m${Math.min(medias.length, 4)}`;
    const html = medias.map((m, idx) => {
      if (m.type === 'video') {
        const poster = mediaUrl(m.cover || m.url || '', 'image');
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        const mp4 = (!isM3u8 && m.url) ? mediaUrl(m.url, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        // 缩略图用 <img> 承载封面，不再用 <video src="" poster>：无 src 的 <video>
        // 内在尺寸恒为 300×150（HTML 规范默认值），poster 只绘制在元素上、不改变
        // 元素尺寸，竖屏封面会被塞进这个小横框（「框很小」）；而 <img> 有自然尺寸，
        // 容器能按封面真实比例撑开。
        // 带上封面真实宽高：浏览器据此推导 aspect-ratio，在封面（lazy）尚未加载
        // 时就能预留正确空间，避免滚动与点播时容器塌陷抖动（消除 CLS 的标准做法）。
        // 缺失时兜底 320x180（≈16:9）：X 部分推文视频不返回 aspect_ratio，无尺寸 + lazy
        // 会导致容器高度塌成 ≈0（只剩 ▶ 一行高）。
        const dim = (m.w && m.h) ? ` width="${m.w}" height="${m.h}"` : ' width="320" height="180"';
        return poster ? `<div class="bm-media" data-idx="${idx}" data-type="video" data-mp4="${esc2(mp4)}" data-m3u8="${esc2(m3u8)}"><img src="${esc2(poster)}" alt=""${dim} loading="lazy" onerror="_onVideoCoverErr(this)"/><span class="bm-play">▶</span></div>` : '';
      }
      return m.url ? `<div class="bm-media" data-idx="${idx}" data-type="image"><img src="${esc2(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="_onImgErr(this)"/></div>` : '';
    }).join('');
    return html ? `<div class="media ${mCls}">${html}</div>` : '';
  }

  // 给某个卡片区块内的媒体缩略图绑定交互：点图进灯箱、点视频原地点播
  function wireMediaBlock(blockEl, mediaList) {
    if (!blockEl) return;
    const lbItems = (mediaList || []).filter((m) => m.type !== 'video' && (m.url || m.cover))
      .map((m) => ({ type: 'image', src: mediaUrl(m.url || '', 'image'), label: '图片' }));
    blockEl.querySelectorAll('.bm-media').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(el.dataset.idx || 0);
        if (el.dataset.type === 'video') {
          playInlineVideo(el, el.dataset.mp4, el.dataset.m3u8);
          return;
        }
        if (!lbItems.length) return;
        _lbItems = lbItems;
        _lbIdx = Math.min(idx, lbItems.length - 1);
        showLightbox(_lbIdx);
      });
    });
  }

  // 纯转推提示：转发人的头像 + @id 一并显示；
  // 卡片主头像/名字仍是「被转发的原推作者」，这样转发人与被转发人都看得见。
  function rtNoteHtml(u) {
    const handle = (u && u.screen_name) || '';
    // 昵称优先（转发人的真实显示名）；昵称缺失或与 id 相同时只显示 @id，避免重复两遍。
    const name = (u && u.name && u.name !== handle) ? u.name : '';
    const av = (u && u.avatar)
      ? `<img class="rt-avatar" src="${esc2(u.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : '';
    const who = name ? `<b>${esc2(name)}</b>` : (handle ? '' : '<b>某人</b>');
    const at = handle ? `<span class="rt-handle">@${esc2(handle)}</span>` : '';
    return `<div class="rt-note"><span class="rt-icon">↻</span>${av}${who}${at} 转发</div>`;
  }

  // 评论（回复）的上下文提示：搜索经常直接搜到评论本身，点开后用户需要回到
  // 被回复的完整帖子。这里给出「↩ 回复 @xxx」说明 + 「查看完整帖子」入口。
  function replyContextHtml(irt) {
    const handle = (irt && irt.screen_name) || '';
    const who = handle ? `@${esc2(handle)}` : '某条帖子';
    return `<div class="dt-reply-ctx">`
      + `<span class="dt-reply-ctx-label">↩ 回复 ${who}</span>`
      + `<button class="dt-goto-parent" type="button">查看完整帖子</button>`
      + `</div>`;
  }

  // 引用转发（quote）的嵌套卡片 HTML：含头像/名字/正文/媒体
  function quotedHtml(q) {
    const a = (q && q.author) || {};
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const tid = (q && q.tweet_id) || '';
    const qurl = (q && q.url) || '';
    return `
      <div class="quoted" data-tid="${esc2(tid)}" data-url="${esc2(qurl)}">
        <div class="q-head">
          ${a.avatar ? `<img class="q-avatar" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
          <div>
            ${(a.name && a.name !== a.screen_name) ? `<div class="q-name" data-link="${esc2(profileUrl)}">${esc2(a.name)}</div>` : ''}
            <div class="q-handle">@${esc2(a.screen_name || 'unknown')}</div>
          </div>
        </div>
        <div class="q-text">${linkifyMentions(q && q.text)}</div>
        ${cardMediaInner((q && q.media) || [])}
      </div>`;
  }

  // 浏览卡片：缩略图/作者点击直接跳原推文或作者 profile，actions 是 [⭐ 收藏] [⬇ 下载]
  function renderBrowseCard(item) {
    const a = item.author || {};
    const medias = (item.media || []).slice(0, 4);
    const mediaHtml = cardMediaInner(medias);
    const tid = item.tweet_id || '';
    const profileUrl = a.screen_name ? `https://x.com/${a.screen_name}` : '';
    const card = document.createElement('div');
    card.className = 'bm-card';
    card.dataset.tid = tid;
    card.innerHTML = `
      ${item.retweeted_by ? rtNoteHtml(item.retweeted_by) : ''}
      <div class="head">
        ${a.avatar ? `<img class="avatar" data-link="${esc2(profileUrl)}" src="${esc2(a.avatar)}" alt="" onerror="this.style.visibility='hidden'" />` : ''}
        <div>
          ${(a.name && a.name !== a.screen_name) ? `<div class="name" data-link="${esc2(profileUrl)}">${esc2(a.name)}</div>` : ''}
          <div class="handle">@${esc2(a.screen_name || 'unknown')}</div>
        </div>
        <div class="time">${esc2(fmtTime(item.created_at))}</div>
      </div>
      <div class="text">${linkifyMentions(item.text)}</div>
      ${mediaHtml}
      ${item.quoted ? quotedHtml(item.quoted) : ''}
      <div class="actions">
        <button class="fav ${favSet.has(tid) ? 'on' : ''}" data-tid="${esc2(tid)}">${favSet.has(tid) ? '★ 已收藏' : '☆ 收藏'}</button>
        <button class="refetch" data-tid="${esc2(tid)}">↻ 重新获取</button>
        <button class="dl" data-tid="${esc2(tid)}">⬇ 下载</button>
      </div>`;
    // 点击图片/视频缩略图 → lightbox 大图/播放视频（不是打开帖子）。
    // 点击正文/标题 → 打开 DBox 内推文详情页。
    // 作者名/头像点击跳作者 profile（仍走外链，因 dbox 暂无用户资料页）。
    const tweetUrl = item.url || `https://x.com/${a.screen_name || 'unknown'}/status/${tid}`;
    const openDetail = (e) => { e.stopPropagation(); openTweetDetail(tid, item, false, (item.author || {}).screen_name); };
    // 主图 + 引用卡片内的图：绑定灯箱/原地点播
    wireMediaBlock(card.querySelector('.media'), medias);
    if (item.quoted) wireMediaBlock(card.querySelector('.quoted'), item.quoted.media || []);
    // 正文（及整卡空白区）→ 打开帖子详情
    card.querySelector('.text').addEventListener('click', openDetail);
    card.addEventListener('click', (e) => {
      if (e.target === card || e.target.classList.contains('text')) openDetail(e);
    });
    card.querySelectorAll('[data-link]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const u = el.dataset.link; if (!u) return;
        // 作者资料链接 → 在 DBox 内自行解析用户详情，不打开 x.com
        const m = /^https?:\/\/(?:x|twitter)\.com\/([^\/\?\#]+)\/?$/.exec(u);
        if (m) openUser(m[1]); else window.open(u, '_blank', 'noopener');
      });
    });
    // 引用卡片整体 → 打开被引用推文详情
    const qEl = card.querySelector('.quoted');
    if (qEl) {
      qEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-link]') || e.target.closest('.bm-media')) return;  // 链接/媒体自行处理
        e.stopPropagation();
        const qt = qEl.dataset.tid;
        if (qt) openTweetDetail(qt, item.quoted, false, (item.quoted.author || {}).screen_name);
      });
    }
    // 收藏 / 移出收藏
    card.querySelectorAll('.fav').forEach((b) => b.addEventListener('click', () => {
      const t = b.dataset.tid;
      if (favSet.has(t)) {
        // 已收藏 → 移出
        b.disabled = true;
        req(`${API}/bookmarks/folder/${encodeURIComponent(t)}`, { method: 'DELETE' })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              favSet.delete(t); saveFavSet();
              b.classList.remove('on');
              b.textContent = '☆ 收藏';
            } else {
              b.textContent = '失败: ' + (d.message || '');
            }
            b.disabled = false;
          })
          .catch(() => { b.textContent = '失败'; b.disabled = false; });
      } else {
        // 加入收藏
        b.disabled = true; b.textContent = '收藏中…';
        req(`${API}/bookmarks/folder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item),
        })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              favSet.add(t); saveFavSet();
              b.classList.add('on');
              b.textContent = '★ 已收藏';
            } else {
              b.textContent = '失败: ' + (d.message || '');
            }
            b.disabled = false;
          })
          .catch(() => { b.textContent = '失败'; b.disabled = false; });
      }
    }));
    // 下载
    card.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => {
      const t = b.dataset.tid;
      if (downloadedTweetIds.has(t)) return;
      downloadedTweetIds.add(t);
      b.disabled = true; b.textContent = '下载中…';
      downloadTweet(tweetUrl)
        .then((ok) => { b.textContent = ok ? '已下载 ✓' : '下载失败'; if (!ok) { downloadedTweetIds.delete(t); b.disabled = false; } })
        .catch(() => { b.textContent = '下载失败'; downloadedTweetIds.delete(t); b.disabled = false; });
    }));
    // 重新获取：以推文为单位重新拉取完整内容（正文+媒体），确保列表里旧的
    // 截断/缺图内容能被详情页补全过的全文覆盖，而不是只刷新媒体。
    card.querySelectorAll('.refetch').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = b.dataset.tid;
      b.textContent = '获取中…';
      b.disabled = true;
      fetchTweetAndUpdateCard(tid, card).finally(() => {
        b.disabled = false;
        setTimeout(() => { b.textContent = '↻ 重新获取'; }, 1200);
      });
    }));
    return card;
  }

  async function downloadTweet(tweetUrl) {
    const res = await chooseLibrary();
    if (!res) return false;   // 用户取消选择资源库
    const { library_id: libraryId, hidden } = res;
    try {
      const r = await req(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          library_id: libraryId,
          params: { url: tweetUrl, preview: false, auto: true, hidden },
        }),
      });
      const d = await r.json();
      return !!(d && d.success);
    } catch (_) { return false; }
  }

  /* ---- 推文总库：全面板唯一的推文身份与内容登记表 ----
     同一条推文（同一 tweet_id）无论从首页 / 搜索 / 收藏 / 历史 / 详情哪条路径进来，
     都只登记一条记录、复用同一个对象：
       · 首页缓存过、搜索又搜到 → 不会再存第二份，只会补全字段；
       · 别人转发了这条推文 → 后端已把身份归一到原推 id（见 run.py 的
         _canonical_tweet_id），转发条目命中同一条记录，不会判成全新推文。
     于是各列表存的是「同一批对象的引用」，收藏/已下载等状态天然一致。
  */
  const TWEET_STORE = new Map();
  const TWEET_STORE_CAP = 3000;
  function mergeTweet(t) {
    if (!t || typeof t !== 'object') return t;
    const id = String(t.tweet_id != null ? t.tweet_id : (t.id || ''));
    if (!id) return t;
    const prev = TWEET_STORE.get(id);
    if (!prev) {
      // 简单 LRU：超出上限时淘汰最早登记的一批，防止长时间使用无限增长
      if (TWEET_STORE.size >= TWEET_STORE_CAP) {
        let n = Math.floor(TWEET_STORE_CAP / 10);
        for (const k of TWEET_STORE.keys()) {
          TWEET_STORE.delete(k);
          if (--n <= 0) break;
        }
      }
      const rec = Object.assign({}, t, { tweet_id: id });
      TWEET_STORE.set(id, rec);
      return rec;
    }
    // 已有记录：补全缺失字段，并以「更完整」为准覆盖——正文取更长的一份
    // （列表精简/截断版不能把详情拉到的全文冲掉，反之详情全文也不能被更早
    // 进来的截断版钉死），媒体等多取到的那一份也覆盖；其余字段维持先到为准，
    // 避免无关字段互相覆盖。这样才能让详情页补全过的内容回流到列表缓存。
    for (const k of Object.keys(t)) {
      const nv = t[k], ov = prev[k];
      if (nv == null || nv === '') continue;
      if (ov == null || ov === '' || (Array.isArray(ov) && !ov.length)) {
        prev[k] = nv;
      } else if (k === 'text' && typeof nv === 'string' && typeof ov === 'string' && nv.length > ov.length) {
        prev[k] = nv;   // 正文以更长（更完整）为准
      } else if (Array.isArray(nv) && Array.isArray(ov) && nv.length > ov.length) {
        prev[k] = nv;   // 媒体等多取到的那一份更完整
      }
    }
    return prev;
  }
  // 一批推文过总库：既去重（同 id 合成一个对象）又归一（返回登记表里的规范对象）
  function mergeTweets(list) {
    const out = [];
    const seen = new Set();
    (list || []).forEach((it) => {
      const rec = mergeTweet(it);
      if (!rec) return;
      const id = String(rec.tweet_id || '');
      if (id) { if (seen.has(id)) return; seen.add(id); }
      out.push(rec);
    });
    return out;
  }

  // 浏览数据缓存：小屏/全屏共享，避免切换后重新刷新
  // 按发布时间倒序（最新在前）
  function sortItemsByTime(items) {
    return items.slice().sort((a, b) => {
      const ta = a.created_at ? Date.parse(a.created_at) : 0;
      const tb = b.created_at ? Date.parse(b.created_at) : 0;
      return tb - ta;
    });
  }

  // 信息流续读改用框架原语 DBoxState.feed()：内容缓存(union_by_id) / 视口锚点(lww) /
  // 已读边界(max) / 分页游标(max) 全部交给框架，插件不再自写一套，避免与框架分叉。
  // 键位 feed:main:items / :anchor / :cursor（read_at 已停用）——后端 /timeline 写入同一组键，
  // 与前端共用同一份服务端真相。
  const XFEED = XSTATE ? XSTATE.feed('main', {
    container: viewBrowse,
    itemSelector: '.bm-card',
    idAttr: 'data-tid',
    idKeys: ['tweet_id', 'id'],
    orderKey: 'created_at',
    cap: 400,
    throttle: 200,
    anchorScope: 'user',   // 跨设备续读：换设备打开直接接着看
    lease: true,           // 锚点写入受主控租约门控，并由服务端硬栅栏校验
    autoBind: false,       // 滚动由本面板统一处理（还要兼顾自动加载）
    // 不传 timeOf/timeAttr：框架 feed() 便不会写入已读边界 read_at。
    // 已读置灰已下线（时间线可双向滚动、max 边界会把几乎整列判成已读，价值低且干扰阅读），
    // 位置续读由 anchor（条目 id + 卡内偏移）负责，无需已读边界参与。
    onStale: () => { if (XLEDGER) XLEDGER.refresh().then(updateMasterLight); followServerAnchorWhenNotMaster(); }
  }) : null;

  // 搜索位置续读：与首页（feed:main）一致，用框架 feed() 记「条目 id + 卡内偏移」锚点，跨设备同步。
  // 内容缓存仍走 search:last（lww，按关键词整体替换），位置单独用 feed:search:anchor 管理；
  // 仅在「内容缓存更新（新搜索/刷新/切模式）」时重置，避免旧位置指向新内容。
  const XSEARCHFEED = XSTATE ? XSTATE.feed('search', {
    container: viewSearch,
    itemSelector: '.bm-card',
    idAttr: 'data-tid',
    anchorScope: 'user',   // 跨设备续读：换设备打开直接接着看
    throttle: 200,
    autoBind: false,       // 滚动由本面板统一处理（还要兼顾自动加载）
  }) : null;

  // ===== 全局单缓存：所有视图与详情页共享的唯一推文内容权威副本 =====
  // 此前首页(XFEED)、搜索(search:last)、收藏(bm:list)各自存一份完整推文对象，详情又有一份
  // DT_CACHE(localStorage)——同一条推文散在多处以致互相分叉（正是此前的 bug 根因）。
  // 现在全推文内容只登记在 XTWEETS 这一处（框架 feed()，union_by_id、服务端权威、跨设备），
  // 各视图只保留「成员 tweet_id + 位置锚点」，渲染时回查这份单缓存；详情页也只读写这一份。
  const XTWEETS = XSTATE ? XSTATE.feed('tweets', {
    idAttr: 'data-tid', idKeys: ['tweet_id', 'id'], orderKey: 'created_at',
    cap: 1500, throttle: 200, autoBind: false,
  }) : null;

  // 入参一批推文 → 合并进全局单缓存（union_by_id：同 id 以 created_at 较新者为准）
  function tweetCachePut(list) {
    if (!XTWEETS) return;
    try { XTWEETS.merge(mergeTweets(list || [])); } catch (_) {}
  }
  // ---- 服务端脏数据清洗 ----
  // 旧代码 dtCacheDrop 的 lww 推送已在服务端 user_state 表留下大量残缺推文条目
  // （有 tweet_id 但 author.screen_name 缺失 → 渲染为 @unknown）。
  // SDK.pull() 每次以服务端为权威整体替换本地缓存 → 脏数据持续回染。
  //
  // 本函数在 pull 完成后调用：遍历 XTWEETS.items() 检测残缺条目，过滤后用 lww 整组
  // 覆盖写回服务端（一次性根治）。清洗是幂等的：干净数据不会触发写入。
  let _scrubPending = false;
  function scrubTweetsCache() {
    if (!XTWEETS) return Promise.resolve(0);
    const items = (XTWEETS.items() || []).slice();
    if (!items.length) return Promise.resolve(0);
    let dirty = 0;
    const clean = items.filter((it) => {
      const a = (it && it.author) || {};
      // 残缺判定：screen_name 缺失就是脏数据（渲染为 @unknown）。
      // 旧 dtCacheDrop 删写竞态产物特征：有 tweet_id 但 author 被清空或残缺。
      // 即使有 text，没有 author 的推文也无法正常展示（@unknown + 点击异常）。
      if (!a.screen_name) { dirty++; return false; }
      return true;
    });
    if (!dirty) return Promise.resolve(0);
    // 用 lww 整组覆盖写回服务端：union_by_id 只能追加/按 id 取新，
    // 无法删除已有条目；必须 lww 整替才能把脏数据从服务端彻底清除。
    try {
      XSTATE.set(XTWEETS.keys.items, clean, { strategy: 'lww' });
    } catch (_) {}
    // 同步本地内存：XTWEETS 是 feed() 实例，其内部缓存已被 SDK.set 更新；
    // 但 feed().items() 可能返回旧快照，这里显式 merge 确保一致性。
    try { XTWEETS.merge(clean); } catch (_) {}
    // 同步清理 feed:main 成员列表里的孤儿 id（指向已被清掉内容的 id）。
    // 只清内容不清成员的话，这些 id 会一直占着位置，随后 prependNewTweets 又会
    // 用残缺对象兜底把它们渲染成 @unknown 空壳，脏数据永远去不干净。
    try {
      if (XFEED) {
        const alive = new Set(clean.map((x) => String(x.tweet_id || x.id)));
        const mem = (XFEED.items() || []).filter((m) => alive.has(String(m.tweet_id || m.id)));
        if (mem.length !== (XFEED.items() || []).length) {
          XSTATE.set(XFEED.keys.items, mem, { strategy: 'lww' });
          XFEED.merge(mem);
        }
      }
    } catch (_) {}
    return Promise.resolve(dirty);
  }

  // 按 tweet_id 从全局单缓存取一条完整推文（并入会话总库 TWEET_STORE，内存里也只有一份）
  // 防御服务端脏数据：旧代码 dtCacheDrop 的 lww 推送已在服务端留下残缺条目（缺 author.screen_name），
  // pull 拉回后若不拦截会渲染为 @unknown 且点击后触发异常链。这里对关键字段做校验，
  // 残缺条目返回 null 让调用方自行处理（列表过滤掉 / 详情走网络重拉）。
  function tweetCacheGet(id) {
    if (!XTWEETS || id == null) return null;
    const sid = String(id);
    const it = (XTWEETS.items() || []).find((x) => String(x.tweet_id || x.id) === sid);
    if (!it) return null;
    const a = it.author || {};
    // 服务端残留的脏数据特征：有 tweet_id 但 author.screen_name 缺失 → 渲染 @unknown
    if (!a.screen_name) return null;
    return mergeTweet(it);
  }
  // 详情页补全后回写：直接覆盖该推文的内容（正文/媒体）+ 评论分页 + 游标，确保
  // 「详情拉到的全文」压过列表里的截断版——union_by_id 按 created_at 同序时不会覆盖，
  // 故这里整数组 lww 落盘，只替换/追加这一条，其余条目原样保留。
  function tweetCachePutDetail(tweet, replies, cursor) {
    if (!XTWEETS || !tweet) return;
    const id = String(tweet.tweet_id || tweet.id || '');
    if (!id) return;
    const items = (XTWEETS.items() || []).slice();
    const idx = items.findIndex((x) => String(x.tweet_id || x.id) === id);
    const base = idx >= 0 ? items[idx] : mergeTweet(tweet);
    const merged = mergeTweet(Object.assign({}, base, tweet, { replies: (replies || []).slice(), cursor: cursor || null }));
    if (idx >= 0) items[idx] = merged; else items.push(merged);
    try { XSTATE.set(XTWEETS.keys.items, items, { strategy: 'lww' }); } catch (_) {}
  }
  // 把推文数组收敛成「成员 id + 排序」的轻量列表（各视图只存这个，不重复存内容）
  function toMembership(list) {
    return (list || []).map((it) => ({ tweet_id: it.tweet_id || it.id, created_at: it.created_at }));
  }

  function saveBrowseCache(items, append) {
    try {
      // 内容只登记进全局单缓存 XTWEETS；本 feed 只保留成员 id + 位置（不重复存内容）
      tweetCachePut(items);
      if (XFEED) {
        XFEED.merge(toMembership(items || []), !!append);
        if (brCursor) XFEED.setCursor(brCursor);
      }
    } catch (_) {}
  }
  // 把补全后的推文回流到全局单缓存 XTWEETS（所有视图与详情共享同一份，写回即全员一致）。
  function persistTweetToFeed(t) {
    if (!t) return;
    tweetCachePut([t]);
  }
  function renderCachedBrowse() {
    try {
      // 本 feed 只存成员 id；内容回查全局单缓存 XTWEETS（一处内容，所有视图共享）
      const ids = XFEED ? XFEED.items() : [];
      if (!ids.length) return false;
      const list = ids.map((it) => tweetCacheGet(it.tweet_id || it.id)).filter(Boolean);
      if (!list.length) return false;
      brList.innerHTML = '';
      brSeenIds.clear();
      sortItemsByTime(list).forEach((it) => {
        const id = it.tweet_id || it.id;
        if (!id || brSeenIds.has(String(id))) return;
        brSeenIds.add(String(id));
        brList.appendChild(renderBrowseCard(it));
      });
      brCursor = (XFEED && XFEED.cursor()) || null;
      brLoadmore.style.display = 'none';
      return true;
    } catch (_) { return false; }
  }
  function saveFavSet() {
    try { localStorage.setItem(BROWSE_FAV_KEY, JSON.stringify(Array.from(favSet))); } catch (_) {}
  }

  // ---- 浏览位置记忆：交给框架 feed()，记住上次看到的推文，重进时定位回去 ----
  let brOpenMode = false;   // 「打开即秒开」模式：渲染缓存+恢复位置+后台静默刷新，不打断查看位置
  let posSaveTimer = null;
  // 交给框架 feed()：捕获「条目 id + 卡内偏移」而非 scrollTop（不同设备屏宽/卡片高度
  // 不同，像素偏移跨设备无意义）；锚点写入受主控租约门控并携带租约版本由服务端硬栅栏
  // 校验；已读边界同步推进（max，只前进，另一台设备往回看也不会拉低）。
  function saveBrowsePos() {
    if (!XFEED || activeView !== 'browse') return;
    const cont = viewBrowse;
    if (!cont || getComputedStyle(cont).display === 'none') return;
    XFEED.saveAnchor();
  }
  function scheduleSavePos() {
    if (posSaveTimer) return;
    posSaveTimer = setTimeout(() => { posSaveTimer = null; saveBrowsePos(); }, 200);
  }
  function scrollCardToTop(tid, offset) {
    const cont = viewBrowse;
    if (!cont || !tid) return false;
    const card = brList.querySelector(`.bm-card[data-tid="${CSS.escape(String(tid))}"]`);
    if (!card) return false;
    // 用布局 offsetTop（CSS transform 不影响它）求卡片在滚动内容中的位置。
    // 若用 getBoundingClientRect，下拉刷新期间 brList 正被 translateY 平移，
    // 算出的 scrollTop 会多一个位移量，松手后内容整体多滚、正在看的卡/视频被顶飞。
    let top = 0, el = card;
    while (el && el !== cont) { top += el.offsetTop; el = el.offsetParent; }
    cont.scrollTop = Math.max(0, top - (offset || 0));
    return true;
  }

  // 浏览位置锚点（跨设备同步，由框架 feed() 管理）
  function getBrowseAnchor() {
    const a = XFEED && XFEED.anchor();
    return a && a.id ? String(a.id) : null;
  }
  // 恢复到上次浏览位置：交给框架 feed()（按 id 定位 + 卡内偏移，并带补偿重定位）。
  // 锚点卡片若尚未渲染（位置较深 / 跨设备刚同步、列表还在加载更旧推文）则短暂重试，
  // 约 5s 后放弃；用户一旦自己滚动立即让位，绝不把正在看的用户拽回去。
  let _restoreIv = null;
  let brUserScrolled = false;
  let brRestoring = false;   // 程序化定位（恢复锚点）期间抑制「滚动事件＝用户操作」误判，
                             // 避免重定位把 scrollTop 改到顶部后误把"顶部"当成用户位置写回服务端
  let _brRestoreToken = 0;   // 抑制窗口令牌：reanchor 会被 ResizeObserver / 图片 load 反复
                             // 调用，每次都起一个解除定时器，先到期的会提前解除保护（或
                             // 反过来把窗口越拉越长）。用令牌保证只有「最后设置」的才有效。
  // 统一的抑制窗口设置，替代散落各处的 `brRestoring=true + setTimeout`
  function holdBrRestoring(ms) {
    const t = ++_brRestoreToken;
    brRestoring = true;
    setTimeout(() => { if (t === _brRestoreToken) brRestoring = false; }, ms);
  }
  // 正常收尾：延迟解除抑制，覆盖 restore() 之后异步到达的 scroll 事件
  function finishAutoRestore() {
    if (_restoreIv) { clearInterval(_restoreIv); _restoreIv = null; }
    holdBrRestoring(200);
  }
  // 用户接管：立即中断自动重定位（含重试 interval 与抑制窗口）
  function cancelAutoRestore() {
    if (_restoreIv) { clearInterval(_restoreIv); _restoreIv = null; }
    _brRestoreToken++;      // 作废已排队的解除定时器
    brRestoring = false;
    // 级联取消框架 feed() 内部排队的补偿定位（restore 会排 60/200/500/1000ms 四次）。
    // 框架自身的 wheel/touch 监听通常已先让位，这里再兜一层。
    try { if (XFEED && XFEED.cancelRestore) XFEED.cancelRestore(); } catch (e) {}
  }
  // 标记「用户已自己滚动」。必须独立于 scroll 事件调用：scroll 在 brRestoring 窗口内
  // 会被整段吞掉，而 reanchor 会把该窗口拉长到 1.3s 以上（期间 ResizeObserver 与图片
  // load 还会不断续期），于是用户怎么滚都不算数、brUserScrolled 始终为假，
  // 后续 pull 回调 / onStale / acquireMaster / loadBrowse 等 5 处恢复调用点
  // 便反复把人拽回锚点（表现为「刷新后滑动，位置被连续自动拖回去好几次」）。
  function markUserScrolled() {
    if (brUserScrolled) return;
    brUserScrolled = true;
    cancelAutoRestore();
  }
  function restoreBrowseScroll() {
    if (!XFEED || brUserScrolled) return;
    if (_restoreIv) return;        // 已有重试在跑，别再叠一个 interval 反复定位
    holdBrRestoring(200);
    if (XFEED.restore()) return;
    let tries = 0;
    _restoreIv = setInterval(() => {
      if (brUserScrolled) { cancelAutoRestore(); return; }
      if ((XFEED && XFEED.restore()) || ++tries > 16) { finishAutoRestore(); return; }
      holdBrRestoring(360);        // 下一轮重试前继续保持抑制
    }, 320);
  }

  // 打开即秒开：先渲染上次缓存、恢复到上次查看位置，随后后台静默拉取最新（见 loadBrowse 的 open 模式）。
  function openBrowse() {
    brOpenMode = true;
    loadBrowse(true);
  }

  // 后台刷新成功后：把新推文静默插到列表顶部（保留当前查看位置），用户上滑即可看到。
  // opts.toTop=true 时直接滚到最新（首次加载无缓存时）；否则保持当前阅读卡片不动。
  // opts.anchorTid 指定重锚定目标（如重进时恢复的上次查看卡片 tid），优先于自动探测的 beforeTopTid，
  // 避免打开面板时跳到顶部——新推文在上方，用户停在原来的位置，上滑即见更新。
  function prependNewTweets(items, opts) {
    opts = opts || {};
    const cont = viewBrowse;
    if (!cont) return;
    const beforeTopTid = (() => {
      const cr = cont.getBoundingClientRect();
      for (const c of brList.querySelectorAll('.bm-card')) {
        const r = c.getBoundingClientRect();
        if (r.bottom > cr.top + 4) return c.dataset.tid || null;
      }
      return null;
    })();
    const em = brList.querySelector('.bm-empty');
    if (em) em.remove();
    tweetCachePut(items);
    const frag = document.createDocumentFragment();
    let inserted = 0;
    sortItemsByTime(mergeTweets(items)).forEach((it) => {
      const id = it.tweet_id || it.id;
      if (!id) return;
      const full = tweetCacheGet(id) || it;   // 内容回查全局单缓存
      // 内容残缺（连作者都没有）坚决不渲染：此前 tweetCacheGet 返回 null 时会回退到
      // it（可能只是个带 id 的空壳/脏条目），直接渲染出 @unknown 空卡片。跳过它们，
      // 后续刷新即可重新拉到完整内容，而不是把残壳一直摆在列表里。
      const _fa = (full && full.author) || {};
      if (!_fa.screen_name) return;
      if (brSeenIds.has(String(id))) {
        // 已渲染过的卡片：若本次拉到的正文/媒体更完整（如详情页补全、或修复后
        // 后端返回全文），原地更新该卡，避免「缓存不归一、列表还是旧的」。
        const old = brList.querySelector(`.bm-card[data-tid="${CSS.escape(String(id))}"]`);
        if (old) {
          const oldText = (old.querySelector('.text') || {}).textContent || '';
          const newText = full.text || '';
          const oldMedia = old.querySelectorAll('.media img, .media video').length;
          const newMedia = (full.media || []).length;
          if (newText.length > oldText.length || newMedia > oldMedia) {
            old.replaceWith(renderBrowseCard(full));
          }
        }
        return;
      }
      brSeenIds.add(String(id));
      frag.appendChild(renderBrowseCard(full));
      inserted++;
    });
    if (!inserted) return 0;
    brList.insertBefore(frag, brList.firstChild);
    const reanchor = () => {
      // 用户已自己滚动就彻底停止程序化定位——本函数会被立即调用 + rAF + ResizeObserver
      // (4s 内) + 每张图片 load 反复触发，若不检查就会在用户滚动后一次次把人拽回锚点。
      if (brUserScrolled) return;
      // 抑制本次程序化定位引发的 scroll 事件（不当用户操作/不保存），窗口闭合后再放开。
      // 用 holdBrRestoring 统一设置：散落的 setTimeout 会互相提前解除或把窗口越拉越长。
      if (opts.toTop) {
        holdBrRestoring(200);
        cont.scrollTop = 0;
        return;
      }
      // anchorTid（如恢复的上次位置）优先；否则用插入前视口顶部的卡片稳住当前位置
      const anchor = opts.anchorTid || beforeTopTid;
      if (!anchor) return;         // 无锚点就别平白开一个抑制窗口
      holdBrRestoring(1300);
      // 交给框架 feed()：按 id 定位并保留卡内偏移（跨设备一致）
      if (XFEED) XFEED.restore({ id: String(anchor), offset: 0 });
      else scrollCardToTop(anchor);
    };
    reanchor();
    requestAnimationFrame(reanchor);
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(reanchor);
      ro.observe(brList);
      setTimeout(() => ro.disconnect(), 4000);
    }
    frag.querySelectorAll('img').forEach((img) => {
      if (!img.complete) img.addEventListener('load', reanchor, { once: true });
    });
    return inserted;
  }
  function fmtCdTime(iso) {
    try { return new Date(iso).toLocaleString(); } catch (_) { return ''; }
  }
  // 刷新/打开后的状态条：让"后端到底给了什么"可见，避免静默保留旧缓存让人误以为卡死
  function showBrowseStatus(msg, kind) {
    let el = $('br-status');
    if (!el) {
      el = document.createElement('div');
      el.id = 'br-status';
      el.className = 'bm-newbar';
      brList.parentNode.insertBefore(el, brList);
    }
    el.style.display = '';
    el.innerHTML = `<button disabled style="width:100%;padding:8px;border:none;border-radius:9px;font-size:12.5px;cursor:default;${kind === 'err' ? 'background:#fdecec;color:#c0392b' : 'background:#eef5fd;color:#1d9bf0'}">${esc2(msg)}</button>`;
    clearTimeout(el._t);
    if (kind !== 'err') el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
  function newestTimeOf(items) {
    let t = 0;
    (items || []).forEach((it) => { const v = it.created_at ? Date.parse(it.created_at) : 0; if (v > t) t = v; });
    return t ? fmtCdTime(new Date(t).toISOString()) : '';
  }

  // X 登录态 / 连通性自检：进入首页时调一次 /check，异常则置顶告警，正常则隐藏。
  // 要点1：两类失败必须分开呈现。Cookie 缺失/残缺/过期才该引导去凭证库；网络或代理
  // 抖动（如 WinError 10061 连接被拒）与登录态无关，一律说成「登录态失效」会误导
  // 用户反复重注册 Cookie（后端已用 reason 区分，前端此前完全没用）。
  // 要点2：告警要能自愈。面板是常驻 iframe，重开面板只切 CSS 不会重跑启动自检，
  // 网络恢复后旧告警会一直挂着，故在定时轮询与面板重新显示时复检（仅告警可见时才发请求）。
  let _sessionChecking = false;
  async function checkXSession() {
    const el = $('xd-session-alert');
    if (!el || _sessionChecking) return;
    _sessionChecking = true;
    try {
      const r = await req(`${API}/check`);
      const d = await r.json();
      if (d && d.ok) { el.style.display = 'none'; el.innerHTML = ''; return; }
      const reason = (d && d.reason) || '';
      const msg = (d && d.message) || 'X 状态异常';
      // 只有 Cookie 相关问题才让用户去凭证库；其余（网络/服务异常）引导重试
      const cookieIssue = (reason === 'no_cookie' || reason === 'incomplete' || reason === 'expired');
      const title = cookieIssue ? '⚠️ X 登录态失效' : '⚠️ 暂时连不上 X';
      const sub = cookieIssue
        ? '请到「凭证库」中重新注册有效的 x.com Cookie（需含 auth_token 与 ct0），再刷新本面板。'
        : '这通常是网络或代理问题，与 Cookie 无关；网络恢复后本提示会自动消失，无需重新注册 Cookie。';
      el.style.display = '';
      el.innerHTML = `<div class="xa-inner">${title}：${esc2(msg)}<br><span class="xa-sub">${sub}</span>`
        + `<button class="xa-retry" type="button">重试</button></div>`;
      const btn = el.querySelector('.xa-retry');
      if (btn) btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        btn.disabled = true; btn.textContent = '检查中…';
        checkXSession();
      });
    } catch (_) {
      // 自检请求本身失败不弹（避免干扰），由刷新/加载失败提示兜底。
      el.style.display = 'none';
    } finally {
      _sessionChecking = false;
    }
  }
  // 仅当告警条正显示时才复检：网络恢复后自动清除，不必等用户手动刷新面板。
  function recheckSessionIfAlerted() {
    const el = $('xd-session-alert');
    if (el && el.style.display !== 'none' && el.innerHTML) checkXSession();
  }
  async function refreshBrowseKeepPos() {
    if (brLoading) return;
    brLoading = true;
    try {
      const r = await req(`${API}/timeline?count=50`);
      const d = await r.json();
      if (!d.success) {
        if (!brList.querySelector('.bm-card'))
          brList.innerHTML = `<div class="bm-empty err">加载失败: ${esc2(d.message || '未知错误')}</div>`;
        else showBrowseStatus('刷新失败: ' + (d.message || '未知错误'), 'err');
        return;
      }
      const ins = prependNewTweets(d.items || []);
      brCursor = d.next_cursor || null;
      const nt = newestTimeOf(d.items || []);
      if (!ins) showBrowseStatus('已是最新' + (nt ? ' · 后端最新 ' + nt : ''), 'ok');
      else showBrowseStatus('已更新' + (nt ? ' · 最新 ' + nt : ''), 'ok');
    } catch (e) {
      if (!brList.querySelector('.bm-card'))
        brList.innerHTML = `<div class="bm-empty err">请求异常: ${esc2(e.message)}</div>`;
      else showBrowseStatus('刷新异常: ' + esc2(e.message), 'err');
    } finally {
      brLoading = false;
    }
  }

  // 顶部「正在后台加载」提示（不打断查看）
  function showBgLoading(on) {
    let el = $('br-bgload');
    if (!el) {
      el = document.createElement('div');
      el.id = 'br-bgload';
      el.className = 'bm-newbar';
      brList.parentNode.insertBefore(el, brList);
    }
    if (on) {
      el.style.display = '';
      el.innerHTML = '<button disabled style="width:100%;padding:9px;border:none;border-radius:9px;font-size:13px;background:#eef5fd;color:#1d9bf0;cursor:default">🔄 正在后台加载最新推文…</button>';
    } else {
      el.style.display = 'none';
      el.innerHTML = '';
    }
  }

  // 底部状态条：加载中转圈 / 到底「没有更多了」/ 失败「点击重试」（点击＝loadBrowse(false)）。
  // 自动无限滚动期间也让它常驻可见，避免用户以为「卡住、不知道在不在加载」。
  function setBrBottom(state) {
    if (state === 'hidden') { brLoadmore.style.display = 'none'; return; }
    brLoadmore.style.display = '';
    if (state === 'loading') {
      brMoreBtn.disabled = true;
      brMoreBtn.innerHTML = '<span class="spinner"></span>加载中…';
    } else if (state === 'end') {
      brMoreBtn.disabled = true;
      brMoreBtn.innerHTML = '没有更多了';
    } else if (state === 'error') {
      brMoreBtn.disabled = false;
      brMoreBtn.innerHTML = '加载失败，点击重试';
    }
  }

  async function loadBrowse(reset = true) {
    if (brLoading) return;
    brLoading = true;
    const isOlder = !reset;
    let olderErr = false;
    const openMode = !!(reset && brOpenMode);
    brOpenMode = false;
    let preview = false;
    let syncP = null;
    if (reset) {
      brUserScrolled = false;
      // 打开/刷新浏览视图＝刻意使用本设备 → 抢占主控权（内含强制对账 pull）。
      // 故意不 await：先让「打开即秒开」用本地缓存把首屏渲染出来，缩短白屏；
      // 但取锚点定位前必须等它落地（见下方 await syncP），否则用的是本机旧锚点。
      syncP = acquireMaster();
      setBrBottom('hidden');
