<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X</title>
<!-- HLS 播放支持：X 视频为 m3u8 流，原生 <video> 无法直接播放，需 hls.js。
     若 CDN 不可达（离线环境），会静默失败，下方逻辑自动退化为“打开详情预览”。 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" onerror="window.__HLS_FAILED=true"></script>
<!-- 框架下发的统一状态 SDK：跨设备同步「浏览缓存 / 已读边界 / 当前标签页」。
     本地优先读取（首屏不等待网络）、脏键防抖上报、卸载时 keepalive 落盘。 -->
<script src="/api/ext-sdk/state.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f7f8fa; color: #1f2329; }

  /* 用 100% 而非 100vh：面板跑在 iframe 里，100vh 取的是「iframe 视口」且形态切换（小窗↔全屏）
     时尺寸变化后不会可靠重算，导致内部 flex 容器高度错乱（需刷新才恢复）。100% 配合 html/body
     的 height:100% 形成百分比链，iframe 尺寸一变就自动重排。 */
  .wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  /* ---- 工具栏 ---- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e3e6eb; background: #fff; flex-shrink: 0; }
  .toolbar .title { font-weight: 600; font-size: 14px; }
  .toolbar #fullscreen { background: none; border: 1px solid #d0d4dc; color: #555; border-radius: 8px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .toolbar #fullscreen:hover { color: #1d9bf0; border-color: #1d9bf0; }
  /* 桌面端刷新按钮：仅精确指针（鼠标）设备显示，触摸端用下拉刷新，避免按钮膨胀 */
  .tb-refresh { display: none; margin-left: auto; width: 34px; height: 34px; border: 1px solid #d0d4dc; background: #fff; color: #1d9bf0; border-radius: 8px; font-size: 17px; line-height: 1; cursor: pointer; transition: transform .2s, color .15s, border-color .15s; }
  .tb-refresh:hover { color: #1d9bf0; border-color: #1d9bf0; }
  .tb-refresh:active { transform: scale(.92); }
  .tb-refresh.spinning { animation: xd-spin 0.8s linear infinite; pointer-events: none; color: #8ec9f3; }
  @media (hover: hover) and (pointer: fine) { .tb-refresh { display: inline-flex; align-items: center; justify-content: center; } }

  /* ---- 表单区（始终可见） ---- */
  .form { padding: 10px 12px; border-bottom: 1px solid #e3e6eb; background: #fff; flex-shrink: 0; }
  .form input[type=text] { width: 100%; border: 1px solid #d0d4dc; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }
  .form select { width: 100%; border: 1px solid #d0d4dc; border-radius: 8px; padding: 7px 10px; font-size: 13px; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .opts label { display: inline-flex; align-items: center; gap: 4px; }
  .form .run-row { display: flex; gap: 8px; align-items: center; }
  .form button { background: #1d9bf0; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
  .form button:hover { filter: brightness(1.06); }
  .hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.5; }

  /* ---- 预览区（表单下方，不隐藏表单） ---- */
  .preview { flex: 1; overflow-y: auto; padding: 10px 12px; display: none; flex-direction: column; gap: 10px; min-height: 0; }
  .preview.active { display: flex; }
  .preview .tweet { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 10px 12px; }
  .preview .author { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .preview .author a { color: #1d9bf0; text-decoration: none; }
  .preview .ttext { font-size: 12.5px; color: #333; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .preview .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .media { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .media .thumb { position: relative; width: 100%; aspect-ratio: 16 / 10; background: #eef0f4; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; max-height: 200px; }
  .media .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .media .thumb:hover img { transform: scale(1.03); }
  .media .thumb .placeholder { font-size: 12px; color: #999; text-align: center; padding: 8px; }
  .media .play { position: absolute; inset: 0; margin: auto; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(0,0,0,.45); color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-left: 3px; }
  .media .play:hover { background: rgba(29,155,240,.85); }
  .media video { width: 100%; max-height: 70vh; object-fit: contain; background: #000; display: block; }
  .media .note { position: absolute; inset: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; }
  .media .meta { padding: 7px 10px; font-size: 12px; color: #555; display: flex; align-items: center; gap: 6px; }
  .media .meta input { accent-color: #1d9bf0; }
  .media .tag { margin-left: auto; font-size: 11px; color: #1a7f37; background: #e8f5e9; border-radius: 4px; padding: 0 5px; }
  .preview .actions { display: flex; gap: 8px; padding-bottom: 8px; }
  .preview .actions button { flex: 1; border-radius: 8px; padding: 10px 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .preview .actions .primary { background: #1d9bf0; color: #fff; }
  .preview .actions .primary:hover { filter: brightness(1.06); }
  .preview .actions .cancel { background: #fff; color: #666; border: 1px solid #d0d4dc; }
  .preview .actions .cancel:hover { color: #d33; border-color: #f3a6a6; }

  /* ---- 状态/日志区（下载时显示；预览时收为辅助区） ---- */
  .status { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; display: none; }
  .status.active { display: block; }
  /* 预览阶段：日志区缩小，让预览内容成为主视图 */
  .preview.active ~ .status.active { flex: 0 0 auto; max-height: 120px; }
  .progress { height: 8px; background: #e3e6eb; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .progress > div { height: 100%; background: #1d9bf0; width: 0; transition: width .3s; }
  .status-msg { font-size: 13px; color: #333; margin-bottom: 10px; }
  .log { font-size: 12px; color: #666; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; padding: 8px; max-height: 220px; overflow-y: auto; }
  .log .err { color: #f56c6c; }

  /* ---- Lightbox（点击图片放大 + 左右切换） ---- */
  .lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; cursor: pointer; touch-action: none; overscroll-behavior: contain; user-select: none; -webkit-user-select: none; }
  .lightbox.active { display: flex; }
  .lightbox img, .lightbox video { max-width: 92%; max-height: 85%; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.5); user-select: none; -webkit-user-select: none; }
  .lightbox .lb-stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .lightbox .lb-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; will-change: transform; user-select: none; -webkit-user-select: none; }
  .lightbox .lb-layer.lb-anim { transition: transform .3s ease, opacity .3s ease; }
  .lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; font-size: 28px; opacity: 0; transition: opacity .2s; user-select: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .lightbox:hover .nav { opacity: .7; }
  .lightbox .nav:hover { opacity: 1; }
  .lightbox .nav.prev { left: 0; }
  .lightbox .nav.next { right: 0; }
  .lightbox .nav.prev::after { content: '‹'; }
  .lightbox .nav.next::after { content: '›'; }
  .lightbox .counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 4px 14px; border-radius: 12px; z-index: 1; }
  .lightbox .lb-note { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1; }
  .lightbox .lb-note-tip { color: #fff; font-size: 13px; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 10px; max-width: 80%; text-align: center; }
  .lightbox .lb-dl { align-self: center; background: #1d9bf0; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  .lightbox .lb-dl:hover { background: #1a8cd8; }

  /* 资源库选择弹窗：点击下载时才弹出 */
  .lib-picker { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
  .lib-picker-box { background: #fff; border-radius: 14px; padding: 20px 22px; width: min(360px, 86vw); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .lib-picker-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #14171a; }
  .lib-picker-box select { width: 100%; padding: 9px 10px; border: 1px solid #cfd9de; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 16px; background: #fff; }
  .lib-picker-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; margin-bottom: 16px; cursor: pointer; }
  .lib-picker-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .lib-picker-actions button { padding: 8px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  .lib-picker-actions .primary { background: #1d9bf0; color: #fff; }
  .lib-picker-actions .primary:hover { background: #1a8cd8; }
  .lib-picker-actions .cancel { background: #fff; border-color: #cfd9de; color: #536471; }

  /* 推文详情页覆盖层 */
  .detail { position: fixed; inset: 0; z-index: 9998; background: #f5f6f7; display: none; flex-direction: column; }
  .detail.active { display: flex; }
  .detail-box { display: flex; flex-direction: column; height: 100%; }
  .detail-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e3e6eb; }
  .detail-back { background: none; border: none; color: #1d9bf0; font-size: 14px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .detail-back:hover { background: #eef5fd; }
  .detail-title { font-weight: 600; font-size: 14px; color: #0f1419; }
  .detail-scroll { flex: 1; overflow-y: auto; padding: 14px; }
  /* 用户详情页资料卡（DBox 内自行解析，不打开 x.com） */
  .uprof { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .uprof-head { display: flex; align-items: center; gap: 12px; }
  .uprof-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #e9eef2; flex: 0 0 auto; }
  .uprof-id { min-width: 0; }
  .uprof-name { font-size: 17px; font-weight: 700; color: #0f1419; line-height: 1.25; }
  .uprof-handle { font-size: 14px; color: #536471; }
  .uprof-bio { margin-top: 10px; font-size: 14px; color: #0f1419; white-space: pre-wrap; word-break: break-word; }
  .uprof-stats { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #536471; }
  .uprof-stats b { color: #0f1419; }
  .dt-card { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .dt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dt-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #e9eef2; }
  /* 转推提示：转发人的头像 + @id 都要可见，主头像/名字仍是原推作者 */
  .rt-note { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6b7785; padding: 2px 2px 6px; }
  .rt-note .rt-icon { color: #00ba7c; font-size: 13px; line-height: 1; }
  .rt-note .rt-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; background: #e9eef2; flex: 0 0 auto; }
  .rt-note b { color: #536471; font-weight: 600; }
  .rt-note .rt-handle { color: #8899a6; font-weight: 400; }
  /* 评论（回复）上下文条：说明这是回复谁，并给出「查看完整帖子」入口。
     搜索常直接搜到评论，点开后需要能回到上下文里的原贴。 */
  .dt-reply-ctx { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px; padding: 6px 10px; border-radius: 8px;
    background: #f0f7ff; border: 1px solid #cfe6fb; font-size: 12px; color: #4a6572; }
  .dt-reply-ctx-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dt-goto-parent { flex: 0 0 auto; border: 1px solid #1d9bf0; background: #1d9bf0;
    color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .dt-goto-parent:hover { filter: brightness(1.06); }
  .dt-name { font-weight: 600; font-size: 15px; color: #0f1419; }
  .dt-handle { color: #536471; font-size: 13px; }
  .dt-time { color: #8899a6; font-size: 13px; margin-left: auto; }
  .dt-text { font-size: 16px; line-height: 1.6; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
  .dt-media { border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .dt-media img { width: 100%; display: block; max-height: 70vh; object-fit: contain; background: #e9eef2; }
  .dt-media video { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; display: block; background: #000; }
  /* 详情页视频：与浏览卡片同构（封面 + ▶，点按原地点播走 hls.js）。
     .bm-media / .bm-play / .bm-vclose 的样式都定义在 .bm-card 作用域下，详情页
     够不着，必须自带一份，否则 ▶ 与关闭按钮会掉进普通文档流、位置错乱。 */
  .dt-media .dt-video { position: relative; cursor: pointer; border-radius: 12px; overflow: hidden; background: #000; }
  .dt-media .dt-video > video { width: 100%; max-height: 70vh; display: block; background: #000; }
  /* 封面缩略图（<img>）：与上面的 video 同规则，保证点播前后尺寸一致、不跳动 */
  .dt-media .dt-video > img { width: 100%; max-height: 70vh; display: block; object-fit: contain; background: #000; }

  /* 用户详情页：资料头 + 推文列表（推文复用 .bm-card） */
  .user-profile { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .user-profile.loading { color: #8899a6; }
  .user-profile { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .user-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #e9eef2; flex: 0 0 auto; }
  .user-meta { min-width: 0; }
  .user-name { font-weight: 700; font-size: 16px; color: #0f1419; display: flex; align-items: center; gap: 5px; }
  .user-verified { color: #1d9bf0; font-size: 13px; }
  .user-handle { color: #536471; font-size: 14px; }
  .user-bio { flex-basis: 100%; font-size: 14px; line-height: 1.5; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .user-stats { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #536471; margin-top: 4px; }
  .user-stats b { color: #0f1419; }
  /* 头像/名字可点进用户页：仅当用户本身在列表里时也成立；这里给资料头里的元素加手型 */
  .avatar[data-user], .name[data-user], .dt-avatar[data-user], .dt-name[data-user],
  .q-avatar[data-user], .q-name[data-user] { cursor: pointer; }
  .dt-media .dt-video .bm-play { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; padding-left: 3px; pointer-events: none; }
  .dt-media .dt-video.playing .bm-play { display: none; }
  .dt-media .dt-video .bm-vclose { position: absolute; top: 8px; right: 8px; z-index: 3; width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
  .dt-counts { display: flex; gap: 16px; padding: 10px 0; border-top: 1px solid #eef0f2; border-bottom: 1px solid #eef0f2; margin-bottom: 12px; color: #536471; font-size: 13px; }
  .dt-counts b { color: #0f1419; }
  .dt-actions { display: flex; gap: 8px; }
  .dt-actions button { flex: 1; border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 9px; font-size: 13px; cursor: pointer; color: #536471; transition: background .15s; }
  .dt-actions .dl { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .dt-actions .dl:hover { background: #1a8cd8; }
  .dt-actions .fav.on { background: #e0245e; color: #fff; border-color: #e0245e; }
  .dt-actions .openx { color: #1d9bf0; }
  .dt-reply-title { font-weight: 600; font-size: 14px; color: #0f1419; margin: 6px 0 10px; }
  .dt-reply { display: flex; gap: 8px; background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .dt-reply .rv { flex: 1; min-width: 0; }
  .dt-reply .rv .head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dt-reply .rv .rname { font-weight: 600; font-size: 13px; color: #0f1419; }
  .dt-reply .rv .rhandle { color: #536471; font-size: 12px; }
  .dt-reply .rv .rtext { font-size: 14px; line-height: 1.5; color: #0f1419; white-space: pre-wrap; word-break: break-word; }
  .dt-reply img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .dt-reply .dt-reply-media { margin-top: 6px; }
  .dt-reply .dt-reply-media img { width: 100%; height: auto; max-height: 240px; object-fit: contain; border-radius: 8px; }
  .bm-newbar { text-align: center; margin-bottom: 10px; }
  .bm-newbar button { width: 100%; padding: 9px; border: none; background: #fff5d6; color: #b58900; border-radius: 9px; font-size: 13px; cursor: pointer; font-weight: 500; }
  /* X 登录态失效告警条：置顶、跨视图常驻，直到自检通过 */
  .xd-session-alert { position: sticky; top: 0; z-index: 30; margin: 6px 8px 0; }
  .xd-session-alert .xa-inner { background: #fdecec; color: #c0392b; border: 1px solid #f5c6c6; border-radius: 9px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; font-weight: 500; }
  .xd-session-alert .xa-sub { color: #a33; font-size: 11.5px; font-weight: 400; }
  .xd-session-alert .xa-retry { display: block; margin-top: 8px; padding: 4px 12px; border: 1px solid #f5c6c6; border-radius: 6px; background: #fff; color: #c0392b; font-size: 12px; cursor: pointer; }
  .xd-session-alert .xa-retry:disabled { opacity: .6; cursor: default; }
  .bm-folderbar { display: flex; gap: 6px; margin-bottom: 10px; }
  .bm-folderbar select, .bm-folderbar input { flex: 1; border: 1px solid #e3e6eb; border-radius: 8px; padding: 7px 8px; font-size: 12px; color: #0f1419; background: #fff; }
  .bm-folderbar button { border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; color: #536471; }
  .mc-stats { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: #536471; }
  .mc-stats b { color: #0f1419; }
  .mc-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: #536471; }
  .mc-item .type { font-weight: 600; color: #0f1419; min-width: 40px; }
  .mc-item .size { margin-left: auto; }

  /* 选择型交互 */
  .pick { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .pick label { display: block; padding: 4px 0; font-size: 13px; }
  .pick button { margin-top: 8px; background: #1d9bf0; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }

  /* 标签切换 */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { flex: 1; background: #f3f5f7; border: 1px solid #e3e6eb; border-radius: 9px; padding: 9px 10px; font-size: 13px; cursor: pointer; color: #536471; }
  .tab.active { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .quickdl { display: flex; gap: 6px; margin-bottom: 10px; }
  .quickdl input { flex: 1; border: 1px solid #e3e6eb; border-radius: 9px; padding: 9px 12px; font-size: 13px; color: #0f1419; background: #fff; }
  .quickdl input:focus { outline: none; border-color: #1d9bf0; box-shadow: 0 0 0 3px rgba(29,155,240,.15); }
  .quickdl button { border: none; background: #1d9bf0; color: #fff; border-radius: 9px; padding: 0 16px; font-size: 13px; cursor: pointer; }
  .quickdl button:hover { background: #1a8cd8; }

  /* X 收藏 / 浏览 */
  /* 视图需独立滚动：wrap 是 overflow:hidden 的 flex column，此视图占满剩余高度并滚动。
     注意：任何新增的 .view 都必须进这条规则，否则内容会溢出被裁掉且无法下滑
     （搜索/历史/缓存三个视图此前就漏在这里）。 */
  #view-bookmarks, #view-browse, #view-search, #view-history, #view-cache {
    flex: 1; overflow-y: auto; min-height: 0; padding: 12px;
  }
  .bm-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .bm-toolbar button { flex: 1; border-radius: 9px; padding: 9px 10px; font-size: 13px; cursor: pointer; border: 1px solid #e3e6eb; }
  .bm-toolbar .primary { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .bm-toolbar .secondary { background: #fff; color: #536471; }
  .bm-toolbar .srch-prod { display: flex; gap: 6px; flex: 0 0 auto; }
  .bm-toolbar .srch-prod button { flex: 0 0 auto; padding: 9px 12px; }
  .bm-toolbar .srch-prod button.primary { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .bm-list { display: flex; flex-direction: column; gap: 10px; }
  .bm-empty { color: #8899a6; font-size: 13px; text-align: center; padding: 24px 0; }
  .bm-card { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 10px 12px; }
  .bm-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bm-card .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; background: #e9eef2; }
  .bm-card .name { font-weight: 600; font-size: 13px; color: #0f1419; cursor: pointer; }
  .bm-card .name:hover { text-decoration: underline; }
  .bm-card .handle { color: #536471; font-size: 12px; }
  .bm-card .time { color: #8899a6; font-size: 12px; margin-left: auto; }
  .bm-card .text { font-size: 13px; line-height: 1.4; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; }
  /* 正文里的 @提及：跳 DBox 内用户页，蓝色可点 */
  .x-mention { color: #1d9bf0; cursor: pointer; }
  .x-mention:hover { text-decoration: underline; }
  /* 媒体布局：单图占满限高，多图 grid（2x2/3+） */
  .bm-card .media { display: grid; gap: 4px; margin-bottom: 6px; border-radius: 10px; overflow: hidden; }
  .bm-card .media.m1 { grid-template-columns: 1fr; }
  /* 单图：保持原图比例完整显示，限高 320px 不裁切，背景浅灰填充 */
  .bm-card .media.m1 .bm-media { max-height: 320px; background: #f3f5f7; }
  /* 视频安全网：即使封面未加载 / 尺寸缺失，也保证最小可见高度（防塌成一行） */
  .bm-card .media.m1 .bm-media[data-type="video"] { min-height: 120px; }
  /* 视频封面必须撑满容器宽度：X 部分视频的 cover 是缩略图尺寸（如 80x45），
     width:auto 会按原始小尺寸显示 → 图很小。视频封面统一 width:100% 撑满。 */
  .bm-card .media.m1 .bm-media[data-type="video"] > img {
    width: 100%; height: auto; max-height: 320px;
    object-fit: contain; display: block;
  }
  .bm-card .media.m1 .bm-media img, .bm-card .media.m1 .bm-media video {
    width: auto; max-width: 100%; max-height: 320px;
    object-fit: contain; display: block; margin: 0 auto;
  }
  .bm-card .media.m2 { grid-template-columns: 1fr 1fr; }
  .bm-card .media.m3, .bm-card .media.m4 { grid-template-columns: 1fr 1fr; }
  .bm-card .media.m2 .bm-media, .bm-card .media.m3 .bm-media, .bm-card .media.m4 .bm-media { aspect-ratio: 16/10; }
  .bm-card .media.m2 img, .bm-card .media.m2 video,
  .bm-card .media.m3 img, .bm-card .media.m3 video,
  .bm-card .media.m4 img, .bm-card .media.m4 video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bm-card .bm-media { position: relative; cursor: pointer; overflow: hidden; background: #f3f5f7; }
  /* 图片加载失败：显示重试按钮，不再静默隐藏。
     错误态下容器折叠到内容高度（retry 按钮），不再占满 320px/16:10 的预留位，
     避免把文字和按钮推到卡片底部被滚动容器裁切。 */
  .bm-media.img-err { display: flex; align-items: center; justify-content: center;
    max-height: none; height: auto; aspect-ratio: unset; min-height: 80px; }
  .bm-media.img-err::before { content: '🖼'; font-size: 24px; opacity: .25; }
  .bm-media .img-retry { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; background: rgba(255,255,255,.85);
    border: none; color: #536471; font-size: 12px; cursor: pointer; z-index: 1; }
  .bm-media .img-retry:hover { background: rgba(255,255,255,.95); }
  .bm-media .img-retry span { font-size: 20px; }
  /* 引用转发（转发 + 评论）：被转发的原推以嵌套卡片整体呈现，
     引用者与被引用者的头像、@id 都要看得见，避免只看得到评论看不到原贴 */
  .quoted { margin: 2px 0 6px; border: 1px solid #e3e6eb; border-radius: 10px; padding: 8px 10px; background: #fafbfc; cursor: pointer; }
  .quoted:hover { background: #f5f7f9; }
  .quoted .q-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .quoted .q-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: #e9eef2; flex: 0 0 auto; }
  .quoted .q-name { font-weight: 600; font-size: 12.5px; color: #0f1419; cursor: pointer; }
  .quoted .q-name:hover { text-decoration: underline; }
  .quoted .q-handle { color: #536471; font-size: 11.5px; }
  .quoted .q-text { font-size: 12.5px; line-height: 1.4; color: #0f1419; white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
  .quoted .media { display: grid; gap: 4px; border-radius: 10px; overflow: hidden; margin-bottom: 0; }
  .quoted .media.m1 { grid-template-columns: 1fr; }
  .quoted .media.m1 .bm-media { max-height: 220px; background: #f3f5f7; }
  .quoted .media.m1 .bm-media img, .quoted .media.m1 .bm-media video { width: auto; max-width: 100%; max-height: 220px; object-fit: contain; display: block; margin: 0 auto; }
  .quoted .media.m2, .quoted .media.m3, .quoted .media.m4 { grid-template-columns: 1fr 1fr; }
  .quoted .media.m2 .bm-media, .quoted .media.m3 .bm-media, .quoted .media.m4 .bm-media { aspect-ratio: 16/10; }
  .quoted .media.m2 img, .quoted .media.m2 video, .quoted .media.m3 img, .quoted .media.m3 video, .quoted .media.m4 img, .quoted .media.m4 video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .quoted .bm-media { position: relative; cursor: pointer; overflow: hidden; background: #f3f5f7; }

  /* 下拉刷新指示器：贴在滚动容器顶部内侧，默认隐藏在内容上沿之上；
     下拉时资源整体向下平移，指示器同步在露出的空隙里出现，与资源一起往下走 */
  #view-browse, #view-search { position: relative; }
  .ptr-indicator {
    position: absolute; top: 12px; left: 0; right: 0; height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,.94); border: 1px solid #e3e6eb; border-radius: 12px;
    margin: 0 12px; color: #536471; font-size: 13px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    transform: translateY(-100%); opacity: 0; z-index: 5;
    pointer-events: none;
  }
  .ptr-indicator .ptr-icon { font-size: 16px; }
  .bm-card .bm-play, .quoted .bm-play { position: absolute; inset: 0; margin: auto; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; padding-left: 3px; pointer-events: none; }
  .bm-card .bm-media.playing, .quoted .bm-media.playing { background: #000; }
  .bm-card .bm-media.playing video, .quoted .bm-media.playing video { object-fit: contain; }
  .bm-card .bm-vclose, .quoted .bm-vclose { position: absolute; top: 6px; right: 6px; z-index: 3; width: 26px; height: 26px; border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
  .bm-card .actions { display: flex; gap: 6px; margin-top: 4px; }
  .bm-card .actions button { flex: 1; border: 1px solid #e3e6eb; background: #fff; border-radius: 8px; padding: 6px; font-size: 12px; cursor: pointer; color: #536471; transition: background .15s, color .15s, border-color .15s; }
  .bm-card .actions .dl { background: #1d9bf0; color: #fff; border-color: #1d9bf0; }
  .bm-card .actions .dl:hover { background: #1a8cd8; }
  .bm-card .actions .fav { color: #e0245e; }
  .bm-card .actions .fav.on { background: #e0245e; color: #fff; border-color: #e0245e; }
  .bm-card .actions button:disabled { opacity: .6; cursor: not-allowed; }
  .bm-card .loading, .bm-card .err { font-size: 13px; color: #8899a6; padding: 8px 0; }
  .bm-card .err { color: #e0245e; }
  .bm-loadmore { margin-top: 10px; text-align: center; }
  .bm-loadmore button { width: 100%; padding: 9px; border: 1px solid #e3e6eb; background: #fff; border-radius: 9px; color: #1d9bf0; font-size: 13px; cursor: pointer; transition: opacity .15s; }
  .bm-loadmore button:disabled { color: #8899a6; cursor: default; opacity: .7; }
  .bm-loadmore .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #e3e6eb; border-top-color: #1d9bf0; border-radius: 50%; animation: xd-spin .7s linear infinite; margin-right: 6px; vertical-align: -1px; }
  @keyframes xd-spin { to { transform: rotate(360deg); } }
  /* 通用 spinner：让下拉刷新/上拉加载里内联创建的指示器转起来（.bm-loadmore 之外也能转） */
  .spinner { display: inline-block; width: 15px; height: 15px; box-sizing: border-box; border: 2px solid #cfd9e0; border-top-color: #1d9bf0; border-radius: 50%; animation: xd-spin .7s linear infinite; vertical-align: -2px; }
  /* 加载更多时新卡片淡入+上滑，避免硬插入的突兀感（带轻微缩放，更明显） */
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .bm-card.card-enter { animation: cardIn .4s cubic-bezier(.22,.61,.36,1) both; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <span class="title">🐦 X</span>
    <button class="tb-refresh" id="tb-refresh" title="刷新" aria-label="刷新">↻</button>
  </div>

  <!-- 标签切换：首页（浏览）为主；链接（粘贴 X 推文链接 → 解析/预览/仅浏览 → 下载）紧随其后，作为独立页常驻导航。
       下载只是「链接」页里的子动作，故不再单独占一个标签；资源库选择也推迟到真正点下载时才弹出。 -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="browse">🏠 首页</button>
    <button class="tab" data-view="download">🔗 链接</button>
    <button class="tab" data-view="search">🔍 搜索</button>
    <button class="tab" data-view="bookmarks">⭐ 收藏</button>
    <button class="tab" data-view="history">🕘 历史</button>
    <button class="tab" data-view="cache">📦 缓存</button>
  </div>

  <!-- X 登录态自检告警：Cookie 失效/残缺时整条横幅置顶，不打断浏览但必须可见 -->
  <div id="xd-session-alert" class="xd-session-alert" style="display:none"></div>

  <!-- 链接表单视图（原「下载」页）：粘贴推文链接 → 解析预览/仅浏览 → 下载只是其中的子动作。
       资源库选择不再常驻表单，改为点击「下载整个帖子」时弹出，避免过早暴露。 -->
  <div class="view" id="view-download" style="display:none">
  <!-- 表单：只负责「预览」；下载是预览之后的子动作，不在表单上暴露 -->
  <div class="form" id="form">
    <input id="url" type="text" placeholder="粘贴 X / Twitter 推文链接…" />
    <div class="run-row">
      <button id="run">预览</button>
    </div>
    <div class="hint">粘贴链接 → 解析并把图文/视频爬取到本地缓存并预览；确认无误后在预览里点「下载」，选好资源库即把数据持久化进以推文 ID 命名的文件夹。</div>
  </div>
  </div><!-- /view-download -->

  <!-- X 收藏视图 -->
  <div class="view" id="view-bookmarks" style="display:none">
    <div class="bm-toolbar">
      <button id="bm-sync" class="primary">🔄 从 X 同步收藏</button>
      <button id="bm-show-folder" class="secondary">📁 我已收藏 (dbox)</button>
    </div>
    <div id="bm-folder-bar" class="bm-folderbar" style="display:none">
      <select id="bm-collection"><option value="">全部收藏</option></select>
      <input id="bm-collection-input" type="text" placeholder="新集合名" />
      <button id="bm-collection-add" class="secondary">＋ 新建集合</button>
    </div>
    <div id="bm-x-list" class="bm-list"><div class="bm-empty">点击「从 X 同步收藏」加载你在 X 上收藏的推文。</div></div>
    <div id="bm-folder-list" class="bm-list" style="display:none"><div class="bm-empty">你还没有把任何收藏保存到 dbox。在「从 X 同步收藏」中点击「加入收藏夹」即可。</div></div>
  </div>

  <!-- 历史视图（P1-7 本地浏览历史） -->
  <div class="view" id="view-history" style="display:none">
    <div class="bm-toolbar">
      <button id="hs-clear" class="secondary">🗑 清空</button>
    </div>
    <div id="hs-list" class="bm-list"><div class="bm-empty">浏览过的推文会记录在这里，可回看。</div></div>
  </div>

  <!-- 缓存管理视图（P2-9） -->
  <div class="view" id="view-cache" style="display:none">
    <div class="bm-toolbar">
      <button id="mc-clear" class="secondary">🗑 清空缓存</button>
    </div>
    <div id="mc-stats" class="mc-stats"></div>
    <div id="mc-list" class="bm-list"><div class="bm-empty">点开的图片/视频会缓存到本地。</div></div>
  </div>

  <!-- 浏览（首页·关注流）视图 -->
  <div class="view" id="view-browse">
    <div id="br-list" class="bm-list"><div class="bm-empty">下拉刷新加载你关注的人的最新推文。</div></div>
    <div class="bm-loadmore" id="br-loadmore" style="display:none"><button id="br-more">加载更多</button></div>
  </div>

  <!-- 搜索视图 -->
  <div class="view" id="view-search" style="display:none">
    <div class="quickdl" id="srch-box">
      <input id="srch-input" type="text" placeholder="搜索关键词、话题或 @用户，回车搜索…" />
      <button id="srch-btn">🔍 搜索</button>
    </div>
    <div class="bm-toolbar">
      <span class="srch-prod" id="srch-prod">
        <button id="srch-prod-top" class="primary sm">🔥 热门</button>
        <button id="srch-prod-latest" class="sm">🕐 最新</button>
      </span>
    </div>
    <div id="srch-list" class="bm-list"><div class="bm-empty">输入关键词搜索 X 推文。</div></div>
    <div class="bm-loadmore" id="srch-loadmore" style="display:none"><button id="srch-more">加载更多</button></div>
  </div>

  <!-- 预览区：在表单下方展开，不隐藏表单 -->
  <div class="preview" id="pv-wrap">
    <div class="tweet">
      <div class="author" id="pv-author"></div>
      <div class="ttext" id="pv-text"></div>
    </div>
    <div class="grid" id="pv-grid"></div>
    <div class="actions">
      <button id="pv-download" class="primary">⬇ 下载整个帖子</button>
      <button id="pv-cancel" class="cancel">关闭预览</button>
    </div>
  </div>

  <!-- Lightbox：点击图片放大 -->
  <div class="lightbox" id="lb">
    <button class="nav prev" id="lb-prev" aria-label="上一张"></button>
    <div class="lb-stage" id="lb-stage"></div>
    <button class="nav next" id="lb-next" aria-label="下一张"></button>
    <div class="counter" id="lb-counter"></div>
  </div>

  <!-- 资源库选择弹窗：点击「下载」时才弹出，不在表单里过早暴露。
       隐藏资源同样是下载时的选项，故一并收进此弹窗，避免与「预览」混淆。 -->
  <div class="lib-picker" id="lib-picker" style="display:none">
    <div class="lib-picker-box">
      <div class="lib-picker-title">选择目标资源库</div>
      <select id="lib-picker-sel"><option value="">加载中…</option></select>
      <label class="lib-picker-check"><input type="checkbox" id="lib-picker-hidden" /> 隐藏资源（仅帖子流可见）</label>
      <div class="lib-picker-actions">
        <button id="lib-picker-ok" class="primary">确定</button>
        <button id="lib-picker-cancel" class="cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 推文详情页（DBox 内预览推文 + 评论区） -->
  <div class="detail" id="detail">
    <div class="detail-box">
      <div class="detail-top">
        <button class="detail-back" id="dt-back">← 返回</button>
        <span class="detail-title">推文详情</span>
      </div>
      <div class="detail-scroll" id="dt-scroll">
        <div id="dt-body"><div class="bm-empty">加载中…</div></div>
        <div class="detail-replies" id="dt-replies"></div>
        <div class="bm-loadmore" id="dt-loadmore" style="display:none"><button id="dt-more">加载更多回复</button></div>
      </div>
    </div>
  </div>

  <!-- 用户详情页（DBox 内自行解析该用户的资料与推文，不打开 x.com） -->
  <div class="detail" id="user">
    <div class="detail-box">
      <div class="detail-top">
        <button class="detail-back" id="user-back">← 返回</button>
        <span class="detail-title">用户</span>
      </div>
      <div class="detail-scroll" id="user-scroll">
        <div id="user-body"><div class="bm-empty">加载中…</div></div>
        <div class="bm-list" id="user-list"></div>
        <div class="bm-loadmore" id="user-loadmore" style="display:none"><button id="user-more">加载更多</button></div>
      </div>
    </div>
  </div>

  <!-- 日志/状态区：下载时显示 -->
  <div class="status" id="status">
    <div class="progress" id="prog" style="display:none"><div id="prog-bar"></div></div>
    <div class="status-msg" id="status-msg"></div>
    <div class="log" id="log" style="display:none"></div>
    <div id="pick"></div>
  </div>
</div>
<script>
  let TOKEN = '';
  let librariesLoaded = false;
  let standaloneRoute = '';
  let _lbItems = [];    // lightbox 左右切换的混合序列（图片 + 视频）
  let _lbIdx = 0;
  const API = '/api/ext/x';
  const JOB_KEY = 'xd_job';  // localStorage key for active job

  // ── 统一跨设备状态（框架 SDK，命名空间自动隔离为 x）──────────────────
  // 各状态的合并语义不同，必须按键声明，否则会互相覆盖/回退：
  //   read_at    （已下线）   原「已读置灰」边界：时间线可双向滚动、max 边界会把几乎整列判成
  //                           已读，价值低且干扰阅读，已移除；续读改由 anchor 负责
  //   cache      union_by_id  多设备各自拉到的帖子取并集，而非整份覆盖
  //   cursor     max          游标只前进
  //   active_view lww         以后一次点击为准
  //   feed:main:anchor lww    浏览滚动锚点（条目 id + 卡内偏移），由框架 feed() 管理，同步跨设备
  const XSTATE = (window.DBoxState && window.DBoxState.init({ ns: 'x' })) || null;
  function xSet(key, value, opts) { if (XSTATE) try { XSTATE.set(key, value, opts); } catch (_) {} }

  // 主控租约：多设备同时滚动时，只有主控设备把「精确浏览位置」推到服务端，
  // 避免锚点被交替覆盖（抖动）或空闲设备把陈旧位置推回覆盖正在看的那台。
  // acquire 只在「刻意使用」的时机调用（打开/刷新浏览视图、面板重新显示、点击状态灯接管）。
  const XLEDGER = XSTATE ? XSTATE.lease('main') : null;

  let _lastMasterMine = null;   // 上一次已通知宿主的主控状态，用于去重
  function updateMasterLight() {
    if (!XLEDGER) return;
    const mine = XLEDGER.mine();
    // 状态没变就不重复通知：下面有定期轮询会频繁调用本函数，去重避免无谓的
    // postMessage（宿主每收到一次都要重绘指示灯）。
    if (_lastMasterMine === mine) return;
    _lastMasterMine = mine;
    try {
      window.parent.postMessage({
        type: 'DBOX_LIGHT', extId: 'x',
        state: mine ? 'ok' : 'warn',
        text: mine ? '主控' : '已让出',
        title: mine
          ? '本设备为主控：浏览位置会同步到其它设备'
          : '已被其它设备接管：本设备仅本地记忆，点击可接管',
        clickable: true
      }, '*');
    } catch (_) {}
  }
  // 抢占主控权。acquire 内部会先强制 pull 与服务端对账，避免用本设备陈旧状态覆盖服务端；
  // 对账完成后刷新指示灯，并按「服务端真相」重新定位（此时本地已是服务端快照）。
  // 硬栅栏反馈：位置写入因主控权已被其它设备抢占而被服务端拒绝 →
  // 与服务端对账后刷新指示灯（此时本设备已非主控，应显示「已让出」）。
  // 主控被其它设备抢走、服务端锚点已更新到新位置：本设备若非主控，应强制把服务端
  // 浏览位置应用到客户端（跟随主控），否则本机停在陈旧位置、且其本地锚点会在下次接管时
  // 被误当成"当前位置"回写服务端、覆盖真实进度。用户正在看则不动（别拽用户）。
  function followServerAnchorWhenNotMaster() {
    if (!XLEDGER || !XFEED) return;
    if (XLEDGER.mine()) return;       // 本机仍主控：以本地为准，不跟随
    if (brUserScrolled) return;       // 用户正在滚动：别打断
    if (activeView !== 'browse') return;
    // 服务端已是最新（onStale 即在 pull 后触发），直接按本地缓存里的服务端锚点重定位
    restoreBrowseScroll();
  }
  if (XSTATE && XLEDGER) {
    XSTATE.onStale((key) => {
      // 锚点被拒＝主控可能已让出；租约键自身变化也要响应
      const isAnchor = XFEED && key === XFEED.keys.anchor;
      if (!isAnchor && key !== XLEDGER.key) return;
      XLEDGER.refresh().then(updateMasterLight);
      // 锚点被别的设备更新＝主控已让出，强制把服务端位置拉到客户端
      if (isAnchor) followServerAnchorWhenNotMaster();
    });
  }

  /* ---- 主控状态定期轮询 ----
     主控权本质是 UserState 里的一个普通键（feed:main:lease），别的设备抢占后
     本机【不会自动感知】：mine() 读的是本地缓存，要感知变化必须 pull 对账，
     而 pull 只在「锚点写入被服务端以 lease_rev 拒绝（onStale）」「面板重新显示」
     「启动时」发生——于是别的设备抢走主控后，本机要滑动好几下、等锚点写入被拒
     才反馈回来，指示灯才变黄。这里在面板可见时定期与服务端对账，让指示灯尽快
     反映真实主控状态。页面隐藏时跳过，不打扰服务端。 */
  const MASTER_POLL_MS = 2500;
  let _masterPollTimer = null;
  function pollMasterState() {
    if (!XLEDGER || document.hidden) return;
    XLEDGER.refresh().then((mine) => {
      updateMasterLight();
      // 刚被抢走：把服务端位置拉过来跟随主控（内部会判断用户是否正在滚动）
      if (!mine) followServerAnchorWhenNotMaster();
    }).catch(() => {});
  }
  function startMasterPoll() {
    if (_masterPollTimer || !XLEDGER) return;
    _masterPollTimer = setInterval(pollMasterState, MASTER_POLL_MS);
  }
  function stopMasterPoll() {
    if (_masterPollTimer) { clearInterval(_masterPollTimer); _masterPollTimer = null; }
  }
  // 页面重新可见时立刻对账一次，不等下一个轮询周期
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pollMasterState();
  });
  function acquireMaster(opts) {
    opts = opts || {};
    if (!XLEDGER) return Promise.resolve(false);
    // 丢弃接管前遗留的旧锚点脏键（键名由框架 feed() 决定），避免用它覆盖服务端较新位置
    const p = XLEDGER.acquire({ drop: XFEED ? [XFEED.keys.anchor] : [] });
    updateMasterLight();   // 乐观置位后先给一次即时反馈，不等网络
    return p.then((mine) => {
      updateMasterLight();
      if (!brUserScrolled) {
        // 对账后本地缓存已是服务端快照，但 DOM 仍是本设备旧的卡片集合。若服务端锚点
        // 指向的推文不在这批 DOM 里，restore() 只能失败并退回本机旧位置——而本设备此时
        // 已是新主控，随后一滚动就会把陈旧位置推回服务端、覆盖真正的进度。
        // 故接管（resync）必须按服务端快照重建列表再定位，与启动对账同一范式。
        if (opts.resync && activeView === 'browse' && XFEED && XFEED.items().length) {
          renderCachedBrowse();
        }
        restoreBrowseScroll();   // 用户已自己滚动则不动，避免拽回
      }
      return mine;
    });
  }

  // 用户是否已手动切换过视图：若是，后台对账不再覆盖他的选择（避免"被拉走"）
  let userSwitchedView = false;
  // 宿主侧 URL：独立全屏页（/ext/x）会把顶层 URL 的 hash 推给面板，面板据此
  // 深链到对应子页面，并把内部路由变化回写过去（让地址栏/刷新/分享都能用）。
  let hostHash = '';
  let urlSyncEnabled = false;   // 仅独立全屏页支持；小窗形态不动宿主 URL
  let routeInited = false;      // 初始路由是否已应用（宿主后到的 hash 走导航而非初始化）
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'DBOX_TOKEN' && e.data.token) {
      TOKEN = e.data.token;
      // 资源库改为点击「下载」时再惰性加载（chooseLibrary），不再启动时预拉
      // token 到达后恢复可能存在的旧任务（iframe 重建场景）
      if (!jobId) { const saved = restoreJob(); if (saved) { jobId = saved; startPolling(); } }
    }
    if (e.data.type === 'DBOX_EXT_INFO' && e.data.standalone_route) {
      standaloneRoute = e.data.standalone_route;
    }
    // 宿主（独立全屏页）把顶层 URL 的 hash 推给面板：可能是首次进入的深链，
    // 也可能是用户在浏览器里前进/后退导致的 URL 变化。
    if (e.data.type === 'DBOX_ROUTE' && typeof e.data.hash === 'string') {
      const firstLink = !urlSyncEnabled;
      urlSyncEnabled = true;
      if (e.data.hash !== hostHash) {
        hostHash = e.data.hash;
        const r = parseRoute(hostHash);
        if (r && !routeInited) {
          bootRoute();   // 深链已到：立即落地，不必再等启动超时
        } else if (r && buildHash(r) !== location.hash) {
          try { history.replaceState(null, '', buildHash(r)); } catch (_) {}
          applyRoute(r, { fromUrl: true });
        }
      } else if (firstLink && routeInited) {
        // 首次连上宿主（如小窗切全屏）：把面板当前所在页面补写到顶层 URL，
        // 否则地址栏停在 /ext/x，用户复制不到当前页。
        if (dtEl && dtEl.classList.contains('active') && dtCurTweet) {
          navigate({ name: 'tweet', id: dtCurTweet.tweet_id, screen_name: (dtCurTweet.author || {}).screen_name }, { replace: true, silent: true });
        } else {
          navigate(currentListRoute(), { replace: true, silent: true });
        }
      }
    }
    if (e.data.type === 'DBOX_MODE') {
      if (e.data.hidden) {
        // 面板被收起/最小化（小窗或全屏→hidden，DOM 变为 display:none）：显式暂停内联视频，
        // 否则 display:none 不会自动停掉媒体，声音会继续播（同时销毁 hls 实例避免泄漏）。
        if (_inlineVid) stopInlineVideo(_inlineVid);
        return;
      }
      // 面板重新显示：与服务端对账主控权（可能已被其它设备接管），刷新状态灯
      if (XLEDGER) XLEDGER.refresh().then(updateMasterLight);
      // 重开面板只切 CSS、不会重跑启动自检，这里补一次复检，让网络恢复后的旧告警消失
      recheckSessionIfAlerted();
      // 形态切换（小窗<->全屏）后 iframe 视口尺寸变化：重铺当前视图内容，
      // 例如浏览流用 brAutoFill 补满变高后的视口；并派发 resize 让内部尺寸依赖重新计算。
      setTimeout(() => {
        if (activeView === 'browse') brAutoFill();
        window.dispatchEvent(new Event('resize'));
      }, 60);
    }
    if (e.data.type === 'DBOX_LIGHT_CLICK') {
      // 点击面板状态灯＝用户要求本设备接管主控：必须按服务端快照重建列表后再定位，
      // 否则本机旧进度会作为新主控回写服务端（见 acquireMaster 的 resync 说明）
      acquireMaster({ resync: true });
    }
  });
  window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), logEl = $('log'), progEl = $('prog'), progBar = $('prog-bar');
  const formEl = $('form'), previewEl = $('pv-wrap'), gridEl = $('pv-grid');
  let jobId = null, poller = null;
  const seenLogs = new Set();

  // ---- 跨 iframe 重建恢复：从 localStorage 恢复活跃任务 ----
  function saveJob(id) {
    if (id) { try { localStorage.setItem(JOB_KEY, id); } catch(_) {} }
    else { try { localStorage.removeItem(JOB_KEY); } catch(_) {} }
  }
  function restoreJob() {
    try { return localStorage.getItem(JOB_KEY) || null; } catch(_) { return null; }
  }
  // 页面加载时检查是否有未完成任务，自动恢复轮询
  window.addEventListener('load', () => {
    const saved = restoreJob();
    if (saved && latestToken()) {
      jobId = saved;
      startPolling();
    }
  });
  // token 到达时也尝试恢复（token 可能比 load 晚）
  const _origTokenHandler = null; // 标记需要在 message 监听里加恢复逻辑

  // 全屏入口已统一由框架层（ExtensionHost）面板 header 的「⛶ 全屏」按钮提供，
  // panel 自身不再维护独立全屏按钮。


  // 用 latestToken() 而非仅 TOKEN 变量：后者依赖父窗口 postMessage 推送，
  // 初始化时序上可能尚未到达，导致请求以空 token 发出被判「未授权」。
  const AUTH = () => ({ 'Authorization': 'Bearer ' + latestToken() });

  // 读取当前最可能有效的 token（主站 axios 刷新后会写回 localStorage，iframe 同源可共享）。
  function latestToken() {
    try {
      return localStorage.getItem('token')
        || localStorage.getItem('access_token')
        || sessionStorage.getItem('token')
        || TOKEN;
    } catch (_) { return TOKEN; }
  }

  // 向父窗口重新索要最新 token（父窗口会实时读 localStorage/store）。
  function requestTokenFromParent() {
    return new Promise((resolve) => {
      let resolved = false;
      const done = (e) => {
        if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) {
          resolved = true;
          window.removeEventListener('message', done);
          resolve(e.data.token);
        }
      };
      window.addEventListener('message', done);
      window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: 'x' }, '*');
      setTimeout(() => { window.removeEventListener('message', done); if (!resolved) resolve(null); }, 1500);
    });
  }

  // 用 refresh_token 主动刷新 access_token（不依赖主站是否触发刷新）。
  async function refreshToken() {
    try {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return null;
      const resp = await fetch('/api/v2/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      const data = await resp.json();
      if (data && data.success && data.data && data.data.access_token) {
        const nt = data.data.access_token;
        localStorage.setItem('token', nt);
        localStorage.setItem('access_token', nt);
        if (data.data.refresh_token) localStorage.setItem('refresh_token', data.data.refresh_token);
        return nt;
      }
    } catch (_) {}
    return null;
  }

  // 获取新鲜 token：优先父窗口注入，其次 refresh_token 主动刷新，最后读 localStorage。
  async function requestToken() {
    const fromParent = await requestTokenFromParent();
    if (fromParent && fromParent !== latestToken()) return fromParent;
    const refreshed = await refreshToken();
    if (refreshed) return refreshed;
    return latestToken();
  }

  // 带鉴权 + 401 自动重试的请求：优先用最新可用 token（localStorage / sessionStorage /
  // 父窗口推送的 TOKEN），过期时再尝试从父窗口获取或刷新 refresh_token 后重试一次。
  async function req(path, opts = {}) {
    const _do = (token) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token } });
    // 首次请求用 latestToken()（读 localStorage/sessionStorage/TOKEN），而非仅依赖
    // 父窗口 postMessage 推送的 TOKEN 变量——后者在 iframe 初始化时序上可能尚未到达，
    // 导致首次请求以空 token 发出、被扩展宿主 login_required 拦截返回「未授权」。
    let r = await _do(latestToken());
    if (r.status === 401) {
      const fresh = await requestToken();
      if (fresh && fresh !== latestToken()) {
        TOKEN = fresh;
        r = await _do(fresh);
      }
    }
    return r;
  }

  // 资源库列表：按需拉取并缓存（不再在表单里常驻展示）
  let _libsCache = null;
  async function fetchLibraries() {
    if (_libsCache) return _libsCache;
    const r = await fetch('/api/my-libraries', { headers: AUTH() });
    const d = await r.json();
    _libsCache = d.data || d.libraries || [];
    return _libsCache;
  }

  // 点击「下载」时弹出资源库选择；返回 { library_id, hidden }，取消则返回 null
  function chooseLibrary() {
    return new Promise((resolve) => {
      const picker = $('lib-picker');
      const sel = $('lib-picker-sel');
      const hiddenCb = $('lib-picker-hidden');
      const finish = (v) => {
        picker.style.display = 'none';
        $('lib-picker-ok').onclick = null;
        $('lib-picker-cancel').onclick = null;
        picker.onclick = null;
        resolve(v);
      };
      fetchLibraries().then((libs) => {
        sel.innerHTML = libs.length
          ? libs.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('')
          : '<option value="">（无可用资源库）</option>';
      }).catch(() => {
        sel.innerHTML = '<option value="">（加载失败）</option>';
      }).finally(() => {
        hiddenCb.checked = false;  // 每次重新打开重置，避免沿用上次勾选
        picker.style.display = 'flex';
        $('lib-picker-ok').onclick = () => {
          const v = sel.value;
          if (!v) { alert('请选择目标资源库'); return; }
          finish({ library_id: v, hidden: hiddenCb.checked });
        };
        $('lib-picker-cancel').onclick = () => finish(null);
        picker.onclick = (e) => { if (e.target === picker) finish(null); };
      });
    });
  }

  /* ---- 视图切换 ---- */
  function showStatus() { statusEl.classList.add('active'); previewEl.classList.remove('active'); }
  function showPreview() { previewEl.classList.add('active'); statusEl.classList.remove('active'); }
  function showIdle() { previewEl.classList.remove('active'); statusEl.classList.remove('active'); }

  /* ---- 缓存：预览数据在关闭后保留，重新打开时直接渲染 ---- */
  let _cachedPreview = null;

  function pushLog(msg, isErr) {
    logEl.style.display = 'block';
    if (seenLogs.has(msg)) return;
    seenLogs.add(msg);
    const line = document.createElement('div');
    line.className = isErr ? 'err' : '';
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(pct, msg) {
    progEl.style.display = 'block';
    progBar.style.width = (pct || 0) + '%';
    if (msg) $('status-msg').textContent = msg;
  }

  function startPolling() {
    if (poller) clearInterval(poller);
    poller = setInterval(async () => {
      if (!jobId) return;
      try {
        const r = await fetch(`${API}/status?job_id=${encodeURIComponent(jobId)}`, { headers: AUTH() });
        const s = await r.json();
        if (!s.success) return;
        setProgress(s.percent, s.message || '');
        (s.logs || []).forEach((l) => pushLog(l));
        if (s.pending_input) {
          // 解析已完成（预览/选择），进度应标满
          setProgress(100, s.message || s.pending_input.title || '解析完成');
          if (s.pending_input.type === 'preview') renderPreview(s.pending_input);
          else renderPick(s.pending_input);
        }
        if (s.done) {
          clearInterval(poller); poller = null;
          pushLog(s.error ? ('失败: ' + s.error) : '任务完成。');
          const btn = document.createElement('button');
          btn.textContent = '← 再来一个';
          btn.style.cssText = 'margin-top:10px;background:#1d9bf0;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;';
          btn.onclick = () => { showIdle(); seenLogs.clear(); $('log').textContent = ''; $('status-msg').textContent = ''; progEl.style.display = 'none'; jobId = null; saveJob(null); };
          statusEl.appendChild(btn);
        }
      } catch (e) {}
    }, 800);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ---- 预览渲染 ---- */
  function renderPreview(input) {
    _cachedPreview = input; // 缓存

    const author = input.author || {};
    let authorHtml = '';
    if (author.screen_name) {
      const name = author.name || author.screen_name;
      authorHtml = `<a href="https://x.com/${esc(author.screen_name)}" target="_blank" rel="noopener">${esc(name)}</a> @${esc(author.screen_name)}`;
    } else if (author.name) {
      authorHtml = esc(author.name);
    }
    $('pv-author').innerHTML = authorHtml;
    $('pv-text').textContent = (input.text || '').trim() || '（该推文无文字内容）';

    const media = input.media || [];
    gridEl.innerHTML = media.map((m, i) => {
      const kindTag = m.type === 'video' ? '<span class="tag">视频</span>'
                    : m.type === 'document' ? '<span class="tag">文档</span>'
                    : '<span class="tag">图片</span>';
      let thumb;
      if (m.type === 'video') {
        const cover = m.cover || '';
        const playable = m.mp4 || (m.url || '').endsWith('.mp4');
        thumb = `<div class="thumb">
          ${cover
            ? `<img src="${esc(mediaUrl(cover, 'image'))}" alt="" loading="lazy" onerror="_onImgErr(this)" />`
            : '<div class="placeholder">视频</div>'}
          <button class="play" data-i="${i}">▶</button>
          <div class="note" hidden>该视频需下载后播放</div>
        </div>`;
        if (!playable) {
          thumb = thumb.replace('<button class="play"', '<button class="play" data-noplay="1"');
        }
      } else if (m.type === 'document') {
        thumb = '<div class="thumb"><div class="placeholder">📄 文档附件</div></div>';
      } else {
        // 必须走 mediaUrl() 代理：直接用原始 pbs.twimg.com 地址会被网络拦截，
        // 图片永远加载不出来（浏览卡 renderBmCard 一直走代理，这里此前漏了）。
        thumb = `<div class="thumb">
          <img src="${esc(mediaUrl(m.url, 'image'))}" alt="" loading="lazy" onerror="_onImgErr(this)" />
        </div>`;
      }
      const label = m.label || (m.type === 'video' ? '视频' : m.type === 'document' ? '文档' : '图片');
      return `<div class="media" data-i="${i}">${thumb}
        <label class="meta"><input type="checkbox" data-i="${i}" checked /> ${esc(label)}${kindTag}</label>
      </div>`;
    }).join('');

    // 视频点击播放
    gridEl.querySelectorAll('.media .play').forEach((btn) => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.i);
        const m = media[i];
        const wrap = btn.parentElement;
        if (btn.dataset.noplay) {
          wrap.querySelector('.note').hidden = false;
          btn.hidden = true;
          return;
        }
        const src = mediaUrl(m.mp4 || m.url, 'video');
        wrap.innerHTML = `<video src="${esc(src)}" controls autoplay playsinline></video>`;
      });
    });

    // 收集 lightbox 可切换序列（图片 + 视频）。视频同时携带 mp4 直链与 m3u8 流，
    // 灯箱优先用 hls.js 播 m3u8（自适应码率 + 全屏最高清），其次直链 mp4。
    _lbItems = [];
    media.forEach((m, i) => {
      if (m.type === 'video') {
        const isM3u8 = !!(m.url && m.url.includes('.m3u8'));
        const mp4 = (m.mp4 && !m.mp4.includes('.m3u8')) ? mediaUrl(m.mp4, 'video') : '';
        const m3u8 = isM3u8 ? mediaUrl(m.url, 'video') : '';
        _lbItems.push({
          type: 'video',
          mi: i,                       // 原始媒体索引，用于单独下载
          src: mp4,                    // 直链 mp4（高清，经 /media 缓存）；空则回退 m3u8
          m3u8: m3u8,                  // HLS 流（经 /media 代理），hls.js 播放
          cover: mediaUrl(m.cover || '', 'image'),
          label: m.label || '视频',
          playable: !!(mp4 || m3u8),
        });
      } else if (m.type !== 'document') {
        // 灯箱大图同样必须走代理，否则点开放大后是一张空图
        if (m.url) _lbItems.push({ type: 'image', src: mediaUrl(m.url, 'image'), label: m.label || '图片' });
      }
    });

    // 缩略图点击放大（lightbox，图片/视频均可）
    gridEl.querySelectorAll('.media .thumb').forEach((thumb) => {
      thumb.addEventListener('click', (e) => {
        if (e.target.closest('.play')) return; // 不拦截视频列表内播放按钮
        const i = Number(thumb.closest('.media').dataset.i);
        // 在 lightbox 序列中按原始媒体索引匹配
        const idx = _lbItems.findIndex((x) => x.mi === i);
        showLightbox(idx >= 0 ? idx : 0);
      });
    });

    // 显示预览，但【不要隐藏状态/日志区】：解析/下载往往还在后台进行
    // （如 GraphQL 阶段已先返回预览数据），隐藏会让人误以为卡死/消失。
    previewEl.classList.add('active');
    // 注意：故意不调用 showPreview()，以免移除 status 的 active 类。
  }

  // 关闭预览 → 回到空闲状态（表单保留），缓存不清除
  $('pv-cancel').onclick = () => { showIdle(); };

  /* ---- Lightbox：点击图片放大查看 + 左右切换（图片/视频，带层叠过渡） ---- */
  const lbEl = $('lb');
  const lbStage = $('lb-stage');
  const lbCounter = $('lb-counter');

  // 构建某一项的「媒体层」：图片直接 <img>；视频走 hls.js/直链，不可播时回退封面 + 下载提示。
  // 返回独立的 .lb-layer 元素，便于切换时在 stage 内叠放旧层与新层做过渡。
  function lbBuildLayer(item) {
    const layer = document.createElement('div');
    layer.className = 'lb-layer';
    if (item.type === 'video') {
      const m3u8 = item.m3u8 || '';
      const mp4 = item.src || '';
      if (m3u8 && window.Hls && window.Hls.isSupported()) {
        const v = document.createElement('video');
        v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false;
        v.preload = 'metadata';
        v.addEventListener('click', (e) => e.stopPropagation());
        layer.appendChild(v);
        const hls = new Hls({ enableWorker: true, lowLatencyMode: false, capLevelToPlayerSize: false });
        hls.loadSource(m3u8);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
        const syncLevel = () => {
          if (hls.levels && hls.levels.length) {
            hls.currentLevel = (document.fullscreenElement === v || v.webkitDisplayingFullscreen)
              ? hls.levels.length - 1 : -1;
          }
        };
        v.addEventListener('fullscreenchange', syncLevel);
        v.addEventListener('webkitbeginfullscreen', syncLevel);
        v.addEventListener('webkitendfullscreen', syncLevel);
        v._hls = hls;
      } else if (mp4) {
        const v = document.createElement('video');
        v.src = mp4;
        v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false;
        v.preload = 'metadata';
        v.addEventListener('loadedmetadata', () => v.play().catch(() => {}));
        v.addEventListener('click', (e) => e.stopPropagation());
        layer.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = item.cover || '';
        layer.appendChild(img);
        const note = document.createElement('div');
        note.className = 'lb-note';
        note.innerHTML = `<div class="lb-note-tip">该视频暂无法在线预览，可下载后查看。</div>`
          + (item.mi !== undefined ? `<button class="lb-dl" id="lb-dl-video">⬇ 下载此视频</button>` : '');
        layer.appendChild(note);
        if (item.mi !== undefined) {
          note.querySelector('#lb-dl-video').addEventListener('click', (e) => {
            e.stopPropagation();
            showStatus();
            setProgress(0, '开始下载视频…');
            postInput({ action: 'download', items: [item.mi] });
          });
        }
      }
    } else {
      const img = document.createElement('img');
      img.src = item.src;
      layer.appendChild(img);
    }
    return layer;
  }

  let lbCurLayer = null;     // stage 中当前显示的层
  let _lbAnimating = false;  // 过渡进行中：屏蔽重复触发，避免层叠错乱

  function _lbUpdateChrome() {
    const total = _lbItems.length;
    lbCounter.textContent = total > 1 ? `${_lbIdx + 1} / ${total}` : '';
    const hide = total <= 1;
    $('lb-prev').style.display = hide ? 'none' : 'flex';
    $('lb-next').style.display = hide ? 'none' : 'flex';
  }

  // 即时渲染（初始打开 / 视频项切换）：清掉旧层（含销毁 hls）后直接挂新层
  function renderLightbox() {
    const item = _lbItems[_lbIdx];
    if (!item) return;
    const oldVid = lbStage.querySelector('video');
    if (oldVid) { try { oldVid._hls && oldVid._hls.destroy(); } catch (e) {} oldVid.pause(); }
    lbStage.innerHTML = '';
    const layer = lbBuildLayer(item);
    lbStage.appendChild(layer);
    lbCurLayer = layer;
    _lbUpdateChrome();
  }

  // 层叠过渡：旧层滑出、新层从对侧滑入；过渡期间两张图同时存在于 stage（即「同时存在」）。
  // 全部用 px 计算，可与手指拖动释放后的当前位移无缝衔接继续滑出。
  function lbAnimateTransition(dir, startX) {
    _lbAnimating = true;
    const W = lbStage.clientWidth || lbEl.clientWidth || 1;
    const outLayer = lbCurLayer;
    const inLayer = lbBuildLayer(_lbItems[_lbIdx]);
    inLayer.classList.add('lb-anim');
    outLayer.classList.add('lb-anim');
    outLayer.style.transition = '';   // 清掉拖动时残留的 inline none，让类上的过渡生效
    lbStage.appendChild(inLayer);
    inLayer.style.transform = `translateX(${dir * W}px)`;
    outLayer.style.transform = `translateX(${startX}px)`;
    outLayer.style.opacity = '1';
    void lbStage.offsetWidth;         // 强制重排，让初始位置先生效再开始过渡
    inLayer.style.transform = 'translateX(0)';
    outLayer.style.transform = `translateX(${-dir * W}px)`;
    outLayer.style.opacity = '0';
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      inLayer.removeEventListener('transitionend', finish);
      if (outLayer.parentNode) {
        const ov = outLayer.querySelector('video');
        if (ov) { try { ov._hls && ov._hls.destroy(); } catch (e) {} ov.pause(); }
        outLayer.parentNode.removeChild(outLayer);
      }
      inLayer.classList.remove('lb-anim');
      inLayer.style.transform = ''; inLayer.style.opacity = '';
      lbCurLayer = inLayer;
      _lbAnimating = false;
    };
    inLayer.addEventListener('transitionend', finish);
    setTimeout(finish, 380);          // 无 transitionend 时的兜底（图片层可能不派发）
  }

  function lbStep(dir) {
    if (_lbItems.length <= 1 || _lbAnimating) return;
    const cur = _lbItems[_lbIdx];
    const newIdx = (_lbIdx + dir + _lbItems.length) % _lbItems.length;
    const next = _lbItems[newIdx];
    // 视频/文档项不参与层叠过渡，维持原即时切换（避免 hls 实例在过渡中错乱）
    if (cur.type !== 'image' || next.type !== 'image') {
      _lbIdx = newIdx;
      renderLightbox();
      return;
    }
    _lbIdx = newIdx;
    _lbUpdateChrome();
    lbAnimateTransition(dir, 0);
  }

  function showLightbox(idx) {
    _lbIdx = idx;
    renderLightbox();
    if (!lbEl.classList.contains('active')) enterDrill('lb');   // 拦截浏览器后退
    lbEl.classList.add('active');
  }
  $('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); lbStep(-1); });
  $('lb-next').addEventListener('click', (e) => { e.stopPropagation(); lbStep(1); });
  // 点击大图（lb-img）不再拦截：事件冒泡到 lbEl 的统一 click 处理，与点击空白处一样收起灯箱。
  // 视频(v)仍保留 stopPropagation（见上方插入逻辑），避免点击播放控件时误关。
  lbCounter.addEventListener('click', (e) => e.stopPropagation());

  /* ---- 视频原地点播：点击视频缩略图直接在卡片内播放，不再弹出单独窗口 ---- */
  let _inlineVid = null;
  function stopInlineVideo(rec) {
    if (!rec) return;
    try { rec.hls && rec.hls.destroy(); } catch (e) {}
    try { rec.v.pause(); } catch (e) {}
    if (rec.el && rec.el._thumbHtml !== undefined) {
      rec.el.innerHTML = rec.el._thumbHtml;
      rec.el.classList.remove('playing');
      rec.el.style.height = '';   // 解除冻结，高度交还封面自行撑开
    }
    if (_inlineVid && _inlineVid.el === rec.el) _inlineVid = null;
  }
  function playInlineVideo(mediaEl, mp4, m3u8) {
    // 已在该卡片内播放：交给原生 controls 处理暂停/继续；直接返回，避免点击视频中央或
    // 原生控件时又被重建为新的 <video>+hls 实例（旧实例未停干净 → 残留声音 / 多实例）。
    if (mediaEl.classList.contains('playing')) return;
    if (_inlineVid) stopInlineVideo(_inlineVid);   // 同时只播一个
    if (mediaEl._thumbHtml === undefined) mediaEl._thumbHtml = mediaEl.innerHTML;
    // 冻结容器高度：单图/单视频（m1）的 .bm-media 高度是「由内容撑开」的，
    // 一旦 innerHTML 清空就塌陷，video 的 height:100% 失去基准 → 先黑成一条，
    // 等 loadedmetadata 拿到内在尺寸后才撑开，即「加载前框变小、加载后框变大」。
    // 把当前实测高度钉住，可让点播前后尺寸完全一致（停止时还原）。
    const _rect = mediaEl.getBoundingClientRect();
    if (_rect.height > 0) mediaEl.style.height = Math.round(_rect.height) + 'px';
    mediaEl.classList.add('playing');
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true; v.muted = false; v.preload = 'metadata';
    v.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000;display:block';
    const close = document.createElement('button');
    close.className = 'bm-vclose'; close.textContent = '✕';
    close.addEventListener('click', (e) => { e.stopPropagation(); stopInlineVideo(_inlineVid); });
    mediaEl.innerHTML = '';
    mediaEl.appendChild(v);
    mediaEl.appendChild(close);
    // 注意：不在这里调 v.play()——此时 src 尚未设置（下面才赋），调用必失败并被吞掉。
    // 各分支（HLS / mp4）在源就绪后各自触发 play。
    if (m3u8 && window.Hls && window.Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true, capLevelToPlayerSize: false });
      hls.loadSource(m3u8); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      const sync = () => {  // 全屏强制最高清晰度
        if (hls.levels && hls.levels.length) {
          hls.currentLevel = (document.fullscreenElement === v || v.webkitDisplayingFullscreen)
            ? hls.levels.length - 1 : -1;
        }
      };
      v.addEventListener('fullscreenchange', sync);
      v.addEventListener('webkitbeginfullscreen', sync);
      v.addEventListener('webkitendfullscreen', sync);
      v._hls = hls;
      _inlineVid = { el: mediaEl, v, hls, close };
    } else if (mp4) {
      v.src = mp4;
      v.addEventListener('loadedmetadata', () => v.play().catch(() => {}));
      // mp4 直链加载失败时（代理超时/403/网络断开/CORS），<video> 会静默进入死锁：
      // 黑屏 + 0:00 + 播放按钮点了没反应（error 事件不冒泡、原生控件无错误提示）。
      // 这里监听 error 事件，自动重试一次（覆盖瞬时网络抖动），仍失败则给用户明确提示。
      let _mp4Errs = 0;
      const _onMp4Error = () => {
        _mp4Errs++;
        if (_mp4Errs <= 1) {
          // 首次错误：清空 src 后重新赋值触发重新加载（覆盖瞬时抖动/代理首次未命中）
          const prev = v.src;
          v.src = '';
          v.load();
          // 微任务延迟确保 src='' 已生效
          setTimeout(() => { if (_inlineVid && _inlineVid.v === v) { v.src = prev; v.load(); } }, 50);
        } else {
          // 重试仍失败：在播放器内显示错误提示，让用户知道不是卡了而是源不可用
          if (v.parentNode) {
            const errEl = document.createElement('div');
            errEl.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#f66;font-size:13px;z-index:2';
            errEl.textContent = '视频加载失败（可点击关闭后重试）';
            v.parentNode.appendChild(errEl);
            // 5 秒后自动淡出提示（不影响用户操作）
            setTimeout(() => { try { errEl.remove(); } catch (_) {} }, 5000);
          }
        }
      };
      v.addEventListener('error', _onMp4Error);
      _inlineVid = { el: mediaEl, v, hls: null, close };
    } else {
      mediaEl.innerHTML = mediaEl._thumbHtml; mediaEl.classList.remove('playing');  // 无可用源：还原缩略图
    }
  }

  /* ---- 拦截浏览器后退：打开灯箱/详情时压入历史，后退即关闭而非离开页面 ---- */
  let _drillStack = [];
  // pushHistory=false：历史项由路由（navigate 写 URL）负责压入，这里只登记栈，
  // 避免「打开一条推文」在历史里留下两条记录（后退一次关不掉）。
  function enterDrill(kind, pushHistory) {
    if (pushHistory !== false) {
      try { history.pushState({ dboxDrill: kind }, ''); } catch (e) { return; }
    }
    _drillStack.push(kind);
  }
  // 只收起详情层，不碰历史：用于「URL 已经变了、详情层只需跟着收起」的场景
  // （如用户在浏览器里后退，历史由浏览器消费，这里再 back 一次就会多退一页）。
  function hideDetailLayer() {
    if (!dtEl || !dtEl.classList.contains('active')) return;
    dtEl.classList.remove('active');
    if (_inlineVid) stopInlineVideo(_inlineVid);
    if (_drillStack.length && _drillStack[_drillStack.length - 1] === 'detail') _drillStack.pop();
  }

  function closeDrillViaApp(kind) {
    // 直接关闭浮层，确保「返回」按钮始终有效（不再依赖 popstate 时序）
    if (kind === 'lb') lbEl.classList.remove('active');
    else if (kind === 'detail') {
      hideDetailLayer();
      // 推文详情是一个 URL（#/tweet/<id>），「返回」＝回到来源列表页。
      // 这里统一改路由而不是 history.back()：面板与宿主各持有自己的 history，
      // back 只能消费其中一份，另一份会尴尬地停在推文页 URL 上（表现为地址栏与
      // 页面内容不符）。用 replace 回到列表，两边 URL 一起对齐且不留多余历史。
      const back = lastListRoute || { name: 'browse', params: {} };
      navigate(back, { replace: true });
      return;
    } else if (kind === 'user') {
      if (userEl) userEl.classList.remove('active');
      // 用户页同样是 URL（#/<seg>/<screen_name>），「返回」＝回到来源列表页，
      // 与推文详情一致：用 replace 对齐地址栏，不依赖 history.back()。
      const back = lastListRoute || { name: 'browse', params: {} };
      navigate(back, { replace: true });
      return;
    }
    // 同步历史栈：仅当本浮层是当前最上层（最近压入的 drill）时，回退一次以消费
    // 对应历史项；出栈与再次关闭交由 popstate 统一处理（幂等，重复移除 active 无副作用）
    if (_drillStack.length && _drillStack[_drillStack.length - 1] === kind) {
      try { history.back(); } catch (e) {}
    }
  }
  window.addEventListener('popstate', () => {
    const kind = _drillStack.pop();
    if (kind === 'lb') {
      const v = lbEl.querySelector('video'); if (v) { try { v._hls && v._hls.destroy(); } catch (e) {} v.pause(); }
      lbEl.classList.remove('active');
    } else if (kind === 'detail') {
      hideDetailLayer();
    } else if (kind === 'user') {
      if (userEl) userEl.classList.remove('active');
    }
  });
  // 触摸左右滑动切换（图片/视频）；竖向滑动或点按不触发，避免误关/误触。
  // 关键：在 touchmove 阶段对横向滑动 e.preventDefault()，阻止浏览器将滑动
  // 识别为「系统/浏览器的后退手势」（否则松手前浏览器已发起后退，切图失败）。
  let _lbSwiped = false;
  let _lbSX = 0, _lbSY = 0, _lbSwiping = false, _lbLocked = false;
  function _lbMediaEl() {
    return lbCurLayer || lbStage.firstElementChild || lbEl;
  }
  lbEl.addEventListener('touchstart', (e) => {
    if (_lbItems.length <= 1 || _lbAnimating) return;
    const t = e.touches[0];
    _lbSX = t.clientX; _lbSY = t.clientY;
    _lbSwiping = true; _lbLocked = false;
    // 复位上一轮滑动残留的 _lbSwiped：touchend 的 preventDefault 会抑制合成 click，
    // 若上次滑动后没有 click 来消费该标志，下个真实点击会被误吞导致「点一次关不掉」。
    _lbSwiped = false;
  }, { passive: true });
  lbEl.addEventListener('touchmove', (e) => {
    if (!_lbSwiping || _lbItems.length <= 1 || _lbAnimating) return;
    const t = e.touches[0];
    const dx = t.clientX - _lbSX, dy = t.clientY - _lbSY;
    // 一旦判定为横向滑动，即锁定并吞掉浏览器默认手势（核心防后退手段）
    if (!_lbLocked && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) _lbLocked = true;
    if (_lbLocked) {
      e.preventDefault();
      e.stopPropagation();
      const m = _lbMediaEl();
      m.style.transition = 'none';
      m.style.transform = `translateX(${dx}px)`;   // 实时跟手指，反馈更跟手
    }
  }, { passive: false });
  lbEl.addEventListener('touchend', (e) => {
    if (!_lbSwiping || _lbItems.length <= 1) { _lbSwiping = false; return; }
    _lbSwiping = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - _lbSX, dy = t.clientY - _lbSY;
    const m = _lbMediaEl();
    if (_lbLocked && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      e.preventDefault();          // 阻止随后合成的 click 关闭灯箱
      _lbSwiped = true;
      const dir = dx < 0 ? 1 : -1;
      // 拖到阈值即切换；以当前位移 dx 作为旧层起点，从手指处无缝继续滑出
      _lbIdx = (_lbIdx + dir + _lbItems.length) % _lbItems.length;
      const prevItem = _lbItems[(_lbIdx - dir + _lbItems.length) % _lbItems.length];
      const nextItem = _lbItems[_lbIdx];
      if (prevItem.type === 'image' && nextItem.type === 'image') {
        _lbUpdateChrome();
        lbAnimateTransition(dir, dx);
      } else {
        // 涉及视频/文档：复位拖拽并重渲染（即时切换，无层叠过渡）
        m.style.transition = ''; m.style.transform = '';
        renderLightbox();
      }
    } else {
      // 未达阈值：回弹归位
      m.style.transition = 'transform .2s ease';
      m.style.transform = '';
      setTimeout(() => { m.style.transition = ''; }, 220);
    }
  }, { passive: false });
  lbEl.addEventListener('click', () => {
    if (_lbSwiped) { _lbSwiped = false; return; }   // 横向滑动的误触 click 直接吞掉
    closeDrillViaApp('lb');
  });
  // 关闭时停止视频播放
  document.addEventListener('keydown', (e) => {
    if (!lbEl.classList.contains('active')) return;
    if (e.key === 'Escape') {
      closeDrillViaApp('lb');
    }
    else if (e.key === 'ArrowLeft') { lbStep(-1); }
    else if (e.key === 'ArrowRight') { lbStep(1); }
  });
  // 点击背景关闭并停止视频
  // 注：背景点击关闭与停止视频已在上方统一处理，此处不再重复绑定。

  /* ---- 备选选择 ---- */
  function renderPick(input) {
    if ($('pick').dataset.for === jobId + JSON.stringify(input)) return;
    $('pick').dataset.for = jobId + JSON.stringify(input);
    const opts = (input.options || []).map((o) =>
      `<label><input type="${input.multi ? 'checkbox' : 'radio'}" name="pick" value="${esc(o.value)}"> ${esc(o.label)}</label>`).join('');
    $('pick').innerHTML = `<div class="pick"><div>${esc(input.prompt || '请选择')}</div>${opts}
      <button id="pick-ok">确认</button></div>`;
    $('pick-ok').onclick = async () => {
      const vals = Array.from(document.querySelectorAll('input[name=pick]:checked')).map(x => x.value);
      if (!vals.length) { alert('请至少选择一项'); return; }
      await postInput({ action: 'download', items: vals });
      $('pick').innerHTML = '';
    };
  }

  async function postInput(value) {
    await fetch(`${API}/input`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...AUTH() },
      body: JSON.stringify({ job_id: jobId, value }),
    });
  }

  /* ---- 提交任务：只做「预览」（把图文/视频爬取到缓存并预览）---- */
  $('run').onclick = async () => {
    const url = $('url').value.trim();
    if (!url) { alert('请填写推文链接'); return; }
    if (!latestToken()) { alert('尚未获取到 token'); return; }
    jobId = null; seenLogs.clear();
    $('log').textContent = ''; $('pick').innerHTML = ''; $('status-msg').textContent = ''; progEl.style.display = 'none';
    previewEl.dataset.for = '';
    showStatus();
    setProgress(0, '提交任务…');
    try {
      const r = await fetch(`${API}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...AUTH() },
        body: JSON.stringify({
          params: {
            url,
            preview: true,
            auto: true,
          }
        })
      });
      const d = await r.json();
      if (!d.success) { pushLog('提交失败: ' + (d.message || ''), true); return; }
      jobId = d.job_id;
      saveJob(jobId);
      startPolling();
    } catch (e) { pushLog('提交异常: ' + e.message, true); }
  };

  /* ---- 预览区下载：此时才选资源库与隐藏选项，避免过早暴露 ---- */
  $('pv-download').onclick = async () => {
    const items = Array.from(gridEl.querySelectorAll('input[data-i]:checked')).map(x => Number(x.dataset.i));
    if (!items.length) { alert('请至少勾选一个媒体'); return; }
    const res = await chooseLibrary();
    if (!res) return;   // 用户取消选择资源库
    const { library_id, hidden } = res;
    showStatus();
    setProgress(0, '开始下载…');
    await postInput({ action: 'download', items, library_id, hidden });
  };

  /* ---- 首次加载兜底 ---- */
  let loadRetries = 0;
  (function ensureLibraries() {
    if (librariesLoaded) return;
    if (latestToken()) { return; }   // 资源库改惰性加载，无需启动时预拉
    if (loadRetries++ < 20) setTimeout(ensureLibraries, 300);
  })();

  /* ---- 标签切换 ---- */
  const tabsEl = $('tabs');
  const viewDownload = $('view-download');
  const viewBrowse = $('view-browse');
  const viewHistory = $('view-history');
  const viewCache = $('view-cache');
  const viewBookmarks = $('view-bookmarks');
  const viewSearch = $('view-search');
  // 进入浏览 tab 时同步 dbox folder 到 favSet（仅一次）
  let brFavSynced = false;
  async function syncFavFromServer() {
    if (brFavSynced) return;
    brFavSynced = true;
    try {
      const r = await req(`${API}/bookmarks/folder`);
      const d = await r.json();
      if (d.success && d.items) {
        let added = 0;
        for (const it of d.items) {
          if (it.tweet_id && !favSet.has(it.tweet_id)) { favSet.add(it.tweet_id); added++; }
        }
        if (added) saveFavSet();
      }
    } catch (_) {}
  }

  /* ---- 面板路由：每个页面都是一个 URL（可复制 / 刷新 / 前进后退）----
     · #/home                          首页（关注流）
     · #/search?q=关键词&tab=top|latest 搜索（搜索参数进 URL）
     · #/bookmarks  #/history  #/cache  #/download
     · #/tweet/<id>                    推文详情（中立：不绑定来源，
                                       首页/搜索/收藏/历史/粘贴链接进来都是同一个 URL）
   · #/<seg>/<screen_name>           用户主页（对齐 x.com/<screen_name>）
   · #/<seg>/<screen_name>/status/<id> 推文详情（对齐 x.com/<screen_name>/status/<id>，
                                       <seg> 见下方 NATIVE_SEG 常量）
     兼容旧格式 #/view/<view> 与 #/tweet/<id>。
     重要：从 URL 进来只渲染已有缓存，**绝不自动发起搜索**；只有点「搜索」按钮
     才真正请求 X 刷新缓存。
  */
  const VIEW_ROUTES = ['browse', 'search', 'bookmarks', 'history', 'cache', 'download'];
  const ROUTE_PATH = { browse: 'home', search: 'search', bookmarks: 'bookmarks',
                       history: 'history', cache: 'cache', download: 'download' };
  const PATH_VIEW = { home: 'browse', search: 'search', bookmarks: 'bookmarks',
                      history: 'history', cache: 'cache', download: 'download',
                      browse: 'browse', download: 'download' };
  // X 原生 URL 命名空间：把推文/用户页的 URL 对齐到 x.com 真实结构
  // （#/<seg>/<screen_name> 与 #/<seg>/<screen_name>/status/<id>）。改名只需改这一处。
  const NATIVE_SEG = 'tw';

  // 历史兼容：宿主曾把面板已编码的 hash 再编码一次（Vue Router 的 encodeHash
  // 会对 % 再编码成 %25）。这类旧链接解一层后仍是「整串百分号编码」，
  // 若不再解一层，用户刷新时就会拿编码串当关键词去搜，结果与原来完全不同。
  // 只在整串都形如 %XX（可夹杂 URL 安全字符）时才继续解，避免误伤真正含 %
  // 的搜索词——「100%」解出来是 100%，不匹配 %XX 模式，不会被多解一层。
  function _deepDecode(v) {
    let out = v;
    let guard = 0;
    while (guard++ < 2) {
      if (!/^(?:%[0-9A-Fa-f]{2}|[A-Za-z0-9\-_.~])+$/.test(out)) break;
      if (!/%[0-9A-Fa-f]{2}/.test(out)) break;
      let next;
      try { next = decodeURIComponent(out); } catch (_) { break; }
      if (next === out) break;
      out = next;
    }
    return out;
  }

  function parseRoute(hashStr) {
    const raw = String(hashStr || '').replace(/^#/, '');
    if (!raw) return null;
    const qi = raw.indexOf('?');
    const path = qi >= 0 ? raw.slice(0, qi) : raw;
    const qs = qi >= 0 ? raw.slice(qi + 1) : '';
    const params = {};
    if (qs) {
      qs.split('&').forEach((kv) => {
        if (!kv) return;
        const p = kv.split('=');
        try {
          const key = decodeURIComponent(p[0]);
          const val = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
          params[key] = _deepDecode(val);
        } catch (_) {}
      });
    }
    const seg = path.split('/').filter(Boolean);
    if (!seg.length) return null;
    if (seg[0] === 'tweet' && seg[1]) {
      let id = seg[1];
      try { id = decodeURIComponent(id); } catch (_) {}
      return { name: 'tweet', id: id, params: params };
    }
    // X 原生 URL 对齐：#/<seg>/<screen_name> 与 #/<seg>/<screen_name>/status/<id>
    if (seg[0] === NATIVE_SEG && seg[1]) {
      let screen = seg[1];
      try { screen = decodeURIComponent(screen); } catch (_) {}  // 与 id 一致，避免 CJK 被双重编码
      if (seg[2] === 'status' && seg[3]) {
        let id = seg[3];
        try { id = decodeURIComponent(id); } catch (_) {}
        return { name: 'tweet', id: id, screen_name: screen, params: params };
      }
      return { name: 'user', screen_name: screen, params: params };
    }
    // 旧格式 #/view/<view> 与现行 #/<path> 都认
    const key = (seg[0] === 'view' && seg[1]) ? seg[1] : seg[0];
    const view = PATH_VIEW[key] || (VIEW_ROUTES.indexOf(key) >= 0 ? key : null);
    return view ? { name: view, params: params } : null;
  }

  function buildHash(route) {
    if (!route) return '#/home';
    if (route.name === 'user' && route.screen_name)
      return '#/' + NATIVE_SEG + '/' + encodeURIComponent(route.screen_name);
    if (route.name === 'tweet') {
      // 优先对齐 x.com 结构：#/<seg>/<screen_name>/status/<id>；拿不到作者时回退中立 #/tweet/<id>
      if (route.screen_name)
        return '#/' + NATIVE_SEG + '/' + encodeURIComponent(route.screen_name) + '/status/' + encodeURIComponent(route.id);
      return '#/tweet/' + encodeURIComponent(route.id);
    }
    const q = [];
    if (route.name === 'search') {
      const pr = route.params || {};
      if (pr.q) q.push('q=' + encodeURIComponent(pr.q));
      if (pr.tab) q.push('tab=' + encodeURIComponent(String(pr.tab).toLowerCase()));
    }
    return '#/' + (ROUTE_PATH[route.name] || route.name) + (q.length ? '?' + q.join('&') : '');
  }

  // 当前搜索视图的 URL 参数（读输入框与当前排序，始终反映界面真实状态）
  function searchRouteParams() {
    const inp = $('srch-input');
    const q = ((inp && inp.value) || '').trim();
    const params = {};
    if (q) params.q = q;
    if (typeof srchProduct === 'string' && srchProduct) {
      params.tab = srchProduct === 'Latest' ? 'latest' : 'top';
    }
    return params;
  }

  function currentListRoute() {
    return { name: activeView, params: activeView === 'search' ? searchRouteParams() : {} };
  }

  // 写 URL：面板自身 hash + 同步宿主顶层 URL（仅独立全屏页，小窗不动宿主地址栏）
  function navigate(route, opts) {
    opts = opts || {};
    const hash = buildHash(route);
    if (urlSyncEnabled) {
      try {
        window.parent.postMessage({
          type: 'DBOX_URL_SYNC', extId: 'x', hash: hash, replace: !!opts.replace,
        }, '*');
      } catch (_) {}
    }
    if (opts.replace) {
